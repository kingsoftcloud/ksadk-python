name: Prepare reviewed Web candidate
description: Verify the checked-in Web artifact used by both applications.
runs:
  using: composite
  steps:
    - name: Verify the reviewed Web archive
      shell: bash
      run: |
        set -eu
        python3 scripts/reviewed_web_assets.py check-archive
        version=$(python3 scripts/reviewed_web_assets.py identity --field package_version)
        artifact=$(python3 scripts/reviewed_web_assets.py identity --field artifact)
        tarball="$GITHUB_WORKSPACE/ksadk/studio/react-ui/vendor/$artifact"
        if [ "$RUNNER_OS" = Windows ]; then tarball="$(cygpath -u "$tarball")"; fi
        test -f "$tarball"
        echo "KSADK_WEB_VERSION=$version" >> "$GITHUB_ENV"
        echo "KSADK_WEB_TARBALL=$tarball" >> "$GITHUB_ENV"
        echo 'Verified the manifest-pinned Web source archive; this is not registry release evidence.' >> "$GITHUB_STEP_SUMMARY"
