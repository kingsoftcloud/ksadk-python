name: Prepare pinned Web package
description: Verify the pinned Web release or reviewed candidate used by both applications.
runs:
  using: composite
  steps:
    - name: Verify the reviewed Web archive
      shell: bash
      run: |
        set -eu
        python3 scripts/reviewed_web_assets.py check-archive
        version=$(python3 scripts/reviewed_web_assets.py identity --field package_version)
        echo "KSADK_WEB_VERSION=$version" >> "$GITHUB_ENV"
        if [ "$(python3 scripts/reviewed_web_assets.py identity --field registry_release)" = True ]; then
          echo 'Verified the manifest-pinned npm release and its provenance.' >> "$GITHUB_STEP_SUMMARY"
        else
          artifact=$(python3 scripts/reviewed_web_assets.py identity --field artifact)
          tarball="$GITHUB_WORKSPACE/ksadk/studio/react-ui/vendor/$artifact"
          if [ "$RUNNER_OS" = Windows ]; then tarball="$(cygpath -u "$tarball")"; fi
          test -f "$tarball"
          echo "KSADK_WEB_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo 'Verified the reviewed Web source archive; this is not registry release evidence.' >> "$GITHUB_STEP_SUMMARY"
        fi
