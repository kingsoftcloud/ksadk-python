name: Prepare shared Web source candidate
description: Build the exact companion Web commit for source-only Studio checks.
runs:
  using: composite
  steps:
    - name: Check out the companion source
      uses: actions/checkout@v7
      with:
        repository: aibuilder-leo/ksadk-web
        ref: 607c5d49caccaa54cb0ad8822bbca46d947e7be4
        path: .cache/ksadk-web-candidate
        persist-credentials: false
    - name: Pack the companion source
      shell: bash
      working-directory: .cache/ksadk-web-candidate
      run: |
        npm ci
        mkdir -p "$RUNNER_TEMP/ksadk-web-candidate"
        npm pack --pack-destination "$RUNNER_TEMP/ksadk-web-candidate"
        version=$(node -p 'require("./package.json").version')
        tarball="$RUNNER_TEMP/ksadk-web-candidate/kingsoftcloud-ksadk-web-$version.tgz"
        test -f "$tarball"
        echo "KSADK_WEB_TARBALL=$tarball" >> "$GITHUB_ENV"
        echo 'Shared Web source: aibuilder-leo/ksadk-web@607c5d49caccaa54cb0ad8822bbca46d947e7be4 (0.3.11). This is source verification, not npm release evidence.' >> "$GITHUB_STEP_SUMMARY"
      env:
        # The candidate's build:ksadk script uses POSIX VAR=value syntax.
        # npm invokes scripts through cmd.exe on Windows unless this is set.
        npm_config_script_shell: ${{ runner.os == 'Windows' && 'C:\\Program Files\\Git\\bin\\bash.exe' || '' }}
