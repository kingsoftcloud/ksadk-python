version: 2
# Dependabot 依赖更新配置
# 网页 Settings → Code security 需开启: dependency graph + dependabot alerts +
# security updates + grouped security updates (本文件控制常规版本更新行为)
updates:
  # GitHub Actions 依赖 (CI workflow 用的 action 版本)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    # 同类 action 更新合并成一个 PR, 减少打扰
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"

  # Python pip 依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    # 开发依赖合并成一个 PR, 生产依赖各自一个
    groups:
      dev-dependencies:
        dependency-type: "development"
