name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "open-source/**"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KSADK_WEB_VERSION: "0.3.8"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: uv sync --extra all

      - name: Build frontend static assets
        run: make build-frontend

      - name: Build package artifacts
        run: uv build

      - name: Run public release gate tests
        run: make public-test

      - name: Audit public repository candidate
        run: |
          if [ -f export-manifest.json ]; then
            audit_root="$PWD"
          else
            audit_root="${RUNNER_TEMP}/ksadk-python-public-audit"
            rm -rf "$audit_root"
            uv run --extra dev python scripts/prepare_ksadk_python_export.py \
              --output-dir "$audit_root" \
              --summary
          fi
          uv run --extra dev python scripts/open_source_audit.py \
            --root "$audit_root" \
            --target public-repo

      - name: Build and audit public docs
        run: make docs-site-build

      - name: Check package metadata
        run: uv run --extra dev python -m twine check dist/*

      - name: Audit wheel and sdist file lists
        run: make open-source-audit-dist

  test-studio-react:
    name: React Studio responsive browser gate
    runs-on: ubuntu-latest
    # Browser navigation requires the provisioned Studio/DSH runtime. Keep
    # the hosted runner gate opt-in while that environment is unavailable.
    if: ${{ vars.KSADK_STUDIO_BROWSER_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        if: ${{ hashFiles('ksadk/studio/react-ui/package-lock.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ksadk/studio/react-ui/package-lock.json

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run React Studio browser gate
        run: make studio-react-test

  # goal-00: google-adk 多版本 matrix。依赖窗口 >=1.34.0,<3.0,
  # 对最低锚点 1.34.x 与最新 2.x(2.5.x)各跑一遍全量测试,防止任何一端回归。
  # 版本差异统一由 ksadk/compat/adk_compat.py 收口(见 docs/adk-multi-version-compat.md)。
  test-adk-matrix:
    name: full pytest (google-adk ${{ matrix.google-adk }})
    runs-on: ubuntu-latest
    env:
      KSADK_WEB_VERSION: "0.3.8"
    strategy:
      fail-fast: false
      matrix:
        google-adk: ["1.34.3", "2.5.0"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up pnpm for DSH toolchain tests
        uses: pnpm/action-setup@v6
        with:
          version: "10.33.2"

      - name: Install dependencies
        run: uv sync --extra all

      - name: Pin google-adk for this matrix leg
        run: uv pip install "google-adk==${{ matrix.google-adk }}"

      - name: Verify google-adk version
        run: uv run --no-sync python -c "from importlib.metadata import version; print('google-adk', version('google-adk'))"

      # Both internal and public branches compile Studio from source.
      # Generated assets belong in packages, never in the Git tree.
      - name: Build frontend static assets
        run: make build-frontend

      # Packaging tests inspect the wheel itself; build it in each isolated ADK
      # environment rather than depending on an artifact from another job.
      - name: Build package artifacts
        run: uv build

      # --no-sync: 防止 uv run 按 lock 重新同步、把上一步行覆盖的 adk 版本回退。
      - name: Run full test suite
        run: uv run --no-sync pytest tests/ -q

  # goal-16: Windows a2a 命令 bug 回归(用户首报:"No such command 'a2a'")。
  # 在本机 macOS 无法闭环 Windows,故 CI 加 Windows runner 跑 CLI smoke:
  # `agentengine a2a -h` 退出码 0,且 a2a 命令确已注册(非 try/except ImportError 静默吞)。
  test-cli-windows:
    name: CLI smoke (windows-latest, a2a -h 注册回归)
    runs-on: windows-latest
    env:
      # GitHub's non-interactive Windows output can default to cp1252 while
      # KsADK's public CLI help includes Chinese text.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra all

      - name: a2a -h exits 0
        run: uv run --no-sync agentengine a2a -h

      - name: a2a command is registered (no silent ImportError swallow)
        run: uv run --no-sync python -c "from ksadk.cli import _register_commands, cli; _register_commands(); assert 'a2a' in cli.commands, 'a2a command was silently swallowed'; print('a2a registered OK')"

  test-codex-native-runtime:
    name: Codex native ManagedRuntime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install KsADK and native Codex runtime
        run: uv sync --extra dev --extra codex

      - name: Import platform package, resolve binary, and start local Web
        run: uv run --no-sync pytest tests/test_managed_runtime_native_smoke.py -q

  # DSH/Codex plugin E2E: installs the pinned DSH toolchain and a real upstream
  # Cordis plugin, then exercises the single full-Core Web UI + MCP host.
  # Gated env vars enable tests that are skipped by default (see §8.6 T6).
  test-plugin-e2e:
    name: DSH/Codex plugin E2E (real toolchain + upstream plugin)
    runs-on: ubuntu-latest
    # The public runner does not always have the complete pinned DSH
    # companion graph. Keep this expensive integration gate opt-in until a
    # runner with the official toolchain is provisioned.
    if: ${{ vars.KSADK_DSH_E2E_ENABLED == 'true' }}
    env:
      KSADK_DSH_TOOLCHAIN_E2E: "1"
      KSADK_DSH_UPSTREAM_E2E: "1"
      KSADK_CODEX_PLUGIN_E2E: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Core invokes pnpm by name when mutating a profile, even when its
      # managed installation was bootstrapped through corepack.
      # pnpm 11.7.0 can hang after removing the official Codex bundle.
      # Match the verified profile CLI; managed bootstrap still uses its own pin.
      - name: Set up pnpm for DSH profile plugins
        uses: pnpm/action-setup@v6
        with:
          version: "10.33.2"

      - name: Install KsADK with the pinned Codex SDK and binary
        run: uv sync --extra dev --extra codex

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Run DSH capability + upstream plugin E2E
        run: |
          uv run --no-sync pytest \
            tests/plugins/test_dsh_capability_host_e2e.py \
            tests/plugins/test_dsh_upstream_plugin_e2e.py \
            -v

      - name: Run real Codex plugin E2E against the deterministic model
        env:
          KSADK_CODEX_PLUGIN_E2E_BIN: ${{ secrets.KSADK_CODEX_PLUGIN_E2E_BIN }}
        run: |
          uv run --no-sync pytest \
            tests/e2e/test_codex_plugin_bridge_e2e.py \
            -v
