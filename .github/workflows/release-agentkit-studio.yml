name: Clean obsolete Studio prerelease storage without publication
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inventory, cleanup]
        default: inventory
        required: true
      plan_run:
        type: string
        required: false
      plan_sha256:
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-obsolete-storage-cleanup
  cancel-in-progress: false
jobs:
  studio-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: studio-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact reviewed inventory
        if: inputs.mode == 'cleanup'
        uses: actions/download-artifact@v4
        with:
          name: studio-old-ks3-inventory
          run-id: ${{ inputs.plan_run }}
          github-token: ${{ github.token }}
          path: plan
      - name: Inventory or remove only fixed Studio prerelease namespace
        env:
          STUDIO_DOWNLOAD_PROD_KS3_ACCESS_KEY: ${{ secrets.STUDIO_DOWNLOAD_PROD_KS3_ACCESS_KEY }}
          STUDIO_DOWNLOAD_PROD_KS3_SECRET_KEY: ${{ secrets.STUDIO_DOWNLOAD_PROD_KS3_SECRET_KEY }}
          CLEANUP_MODE: ${{ inputs.mode }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: python3 scripts/cleanup-studio-ks3.py "$CLEANUP_MODE" --sha256 "$PLAN_SHA256"
      - name: Retain object names and redacted status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-old-ks3-${{ inputs.mode }}
          path: .studio-cleanup-evidence
          include-hidden-files: true
          if-no-files-found: error
