name: Qualify AgentKit Studio Windows online update (temporary public runner)
on:
  workflow_dispatch:
    inputs:
      studio_ref:
        description: Immutable qualification tools commit
        type: string
        required: true
      studio_checkout_ref:
        description: Branch containing qualification tools
        type: string
        default: main
      baseline_repository:
        description: Repository containing the signed baseline run
        type: string
        default: kingsoftcloud/agentkit-studio
      baseline_run:
        description: Completed signed baseline build run
        type: string
        required: true
      baseline_source:
        description: Actual immutable baseline Studio source
        type: string
        required: true
      baseline_version:
        description: Actual baseline version
        type: string
        required: true
      target_version:
        description: Public feed target to install
        type: string
        required: true
      require_differential:
        description: Require completed native download bytes smaller than the full installer
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    environment: studio-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Studio source
        env:
          SOURCE_SHA: ${{ inputs.studio_ref }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: make public-gate
  online-update:
    runs-on: windows-latest
    environment: studio-signing
    timeout-minutes: 30
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable qualification tools
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.studio_ref }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full tools SHA is required' }
          git merge-base --is-ancestor $env:SOURCE_SHA HEAD
          if ($LASTEXITCODE) { throw 'Tools are outside the selected branch' }
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -or (git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Tools checkout mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Install qualification dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify and install the actual signed baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_REPOSITORY: ${{ inputs.baseline_repository }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          BASELINE_SOURCE: ${{ inputs.baseline_source }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
        run: |
          node scripts/prepare-windows-candidate.mjs --repository $env:BASELINE_REPOSITORY --run $env:BASELINE_RUN --source $env:BASELINE_SOURCE --version $env:BASELINE_VERSION --output .artifacts/online-baseline
          if ($LASTEXITCODE) { throw 'Signed baseline provenance validation failed' }
          Expand-Archive .artifacts/online-baseline/candidate.zip .artifacts/online-baseline/unpacked
          $exe = @(Get-ChildItem .artifacts/online-baseline/unpacked -Recurse -File -Filter "deepseek-harness-$env:BASELINE_VERSION-win-x64.exe")
          if ($exe.Count -ne 1) { throw 'Expected one signed baseline installer' }
          $signature=Get-AuthenticodeSignature $exe[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Baseline signature invalid' }
          $destination=Join-Path $env:RUNNER_TEMP 'studio-online-update-installed'
          $process=Start-Process $exe[0].FullName -ArgumentList @('/S',"/D=$destination") -Wait -PassThru
          if ($process.ExitCode) { throw 'Baseline installation failed' }
          "STUDIO_UPDATE_BASELINE=$destination/AgentKit Studio.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Exercise public feed, native download, installation and automatic restart
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          REQUIRE_DIFFERENTIAL: ${{ inputs.require_differential }}
        run: |
          $options=@()
          if ($env:REQUIRE_DIFFERENTIAL -eq 'false') { $options+= '--allow-full-fallback' }
          node scripts/verify-windows-online-update.mjs --baseline $env:STUDIO_UPDATE_BASELINE --version $env:TARGET_VERSION --output .artifacts/windows-online-update @options
          if ($LASTEXITCODE) { throw 'Real online Windows update qualification failed' }
      - name: Retain credential-free native update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-online-update-${{ inputs.baseline_version }}-to-${{ inputs.target_version }}
          path: |
            .artifacts/online-baseline/provenance.json
            .artifacts/windows-online-update/*.json
            .artifacts/windows-online-update/*.png
            .artifacts/windows-online-update/journals/
          if-no-files-found: warn
