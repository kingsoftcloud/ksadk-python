name: Qualify AgentKit Studio refactor Windows package
on:
  workflow_dispatch:
    inputs:
      studio_ref:
        description: Immutable Studio source and verification tools SHA
        type: string
        required: true
      studio_checkout_ref:
        description: Private Studio branch containing studio_ref
        type: string
        required: true
      build_version:
        description: Local unsigned diagnostic version
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: studio-refactor-windows-${{ inputs.studio_ref }}
  cancel-in-progress: false
jobs:
  source-gate:
    runs-on: ubuntu-latest
    environment: studio-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source
        env:
          SOURCE_SHA: ${{ inputs.studio_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install verified scanner
        run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: make public-gate
  windows-package:
    needs: source-gate
    runs-on: windows-2025
    environment: studio-signing
    timeout-minutes: 90
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.0-rc.2
          path: dsh-source
          persist-credentials: false
      - name: Verify immutable inputs
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.studio_ref }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
          if ($env:BUILD_VERSION -notmatch '^0\.2\.0-rc\.2\.[0-9]{8}\.[0-9]+$') { throw 'Diagnostic version invalid' }
          git merge-base --is-ancestor $env:SOURCE_SHA HEAD
          if ($LASTEXITCODE) { throw 'Source outside selected branch' }
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -or (git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source mismatch' }
          if ((git -C dsh-source rev-parse HEAD) -ne '639ed015397290b3745d163aafe02ffee4aa3f84') { throw 'DSH baseline mismatch' }
          git config --system core.longpaths true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: dsh-source/package.json
      - name: Prepare frozen Studio package and diagnostic settings
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Studio dependency installation failed' }
          pnpm pack --pack-destination .artifacts
          if ($LASTEXITCODE) { throw 'Studio pack failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inputRoot = Join-Path $env:RUNNER_TEMP 'studio-plugin-input'
          New-Item -ItemType Directory -Force $inputRoot | Out-Null
          Copy-Item ".artifacts/kingsoftcloud-agentkit-studio-$version.tgz" $inputRoot
          "DSH_DESKTOP_PLUGIN_INPUTS=$inputRoot" | Out-File $env:GITHUB_ENV -Append
          "STUDIO_PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          $settings = @{
            DSH_DESKTOP_APP_ID = 'com.kingsoftcloud.agentkit-studio'
            DSH_DESKTOP_AUTO_UPDATE_ENV = 'production'
            DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN = 'https://agentkit.ks3-cn-beijing.ksyuncs.com'
            DSH_DESKTOP_UPDATE_ORIGIN = 'https://agentkit.ks3-cn-beijing.ksyuncs.com'
            DSH_DESKTOP_UPDATE_CHANNEL = 'preview'
          }
          $lines = foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)='$($entry.Value)'" }
          [IO.File]::WriteAllText("$PWD/dsh-source/apps/desktop/.env.windows", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Build official unsigned Windows package and run packaged smoke
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
          DSH_CLIENT_TITLE: AgentKit Studio
          DSH_DESKTOP_PLUGIN_ROOTS: '@kingsoftcloud/agentkit-studio'
          DSH_DESKTOP_PLUGIN_BUNDLES: '@kingsoftcloud/agentkit-studio'
        run: |
          [string[]]$options = @('--source', "$PWD/dsh-source", '--output', "$env:RUNNER_TEMP/studio-build", '--patches', "$PWD/patches/dsh-v0.2.0-rc.2", '--commit', '639ed015397290b3745d163aafe02ffee4aa3f84', '--target', 'win-x64', '--dsh-version', '0.2.0-rc.2', '--studio-version', $env:STUDIO_PACKAGE_VERSION, '--build-version', $env:BUILD_VERSION, '--unsigned')
          $env:DSH_DESKTOP_PRODUCT_ICON = "$PWD/assets/agentkit-studio-macos.png"
          $env:DSH_DESKTOP_PRODUCT_TRAY_ICON = "$PWD/assets/agentkit-studio-tray.ico"
          pnpm exec node scripts/package-desktop.mjs @options 2>&1 | ForEach-Object { "$_" -replace '([?&]token=)[^\s"<>]+', '$1[redacted]' } | Tee-Object -FilePath .artifacts/windows-package.log
          if ($LASTEXITCODE) { throw 'Unsigned Windows packaging failed' }
      - name: Check actual packaged Studio imports and record hashes
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.studio_ref }}
          BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $roots = @(Get-ChildItem "$env:RUNNER_TEMP/studio-build/desktop-checkouts" -Directory)
          if ($roots.Count -ne 1) { throw 'Expected exactly one isolated checkout' }
          $artifacts = Join-Path $roots[0].FullName 'source/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $archives = @(Get-ChildItem $artifacts -Filter app.asar -Recurse -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one actual app.asar' }
          node scripts/verify-desktop-module-graph.mjs $archives[0].FullName --studio > .artifacts/windows-studio-module-graph.json
          if ($LASTEXITCODE) { throw 'Packaged Studio module graph failed' }
          $hashes = @(Get-ChildItem $artifacts -File | ForEach-Object { @{name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $report = @{sourceCommit=$env:SOURCE_SHA; dshCommit='639ed015397290b3745d163aafe02ffee4aa3f84'; buildVersion=$env:BUILD_VERSION; unsigned=$true; packagedSmokePassed=$true; studioModuleGraphPassed=$true; artifacts=$hashes; passed=$true}
          $report | ConvertTo-Json -Depth 10 | Out-File .artifacts/windows-package-acceptance.json -Encoding utf8
      - name: Collect redacted package diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-diagnostics | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/studio-build/desktop-checkouts" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $runs = Join-Path $_.FullName 'source/apps/desktop/.desktop-build/packaging-runs'
            if (Test-Path $runs) {
              Get-ChildItem $runs -Recurse -File | Where-Object { $_.Extension -in @('.json', '.jsonl', '.log') } | ForEach-Object {
                $text = [IO.File]::ReadAllText($_.FullName) -replace '([?&]token=)[^\s"<>]+', '$1[redacted]'
                [IO.File]::WriteAllText((Join-Path "$PWD/.artifacts/windows-diagnostics" ($_.Directory.Name + '-' + $_.Name)), $text, [Text.UTF8Encoding]::new($false))
              }
            }
          }
      - name: Retain diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-refactor-windows-${{ inputs.build_version }}
          path: |
            .artifacts/windows-package.log
            .artifacts/windows-studio-module-graph.json
            .artifacts/windows-package-acceptance.json
            .artifacts/windows-diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Remove local settings
        if: always()
        shell: pwsh
        run: Remove-Item dsh-source/apps/desktop/.env.windows -Force -ErrorAction SilentlyContinue
