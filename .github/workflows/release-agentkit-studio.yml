name: Qualify Studio signed refactor candidates
on:
  workflow_dispatch:
    inputs:
      studio_ref:
        description: AgentKit Studio immutable commit SHA to package
        required: true
        type: string
      studio_checkout_ref:
        description: Private Studio branch or tag that contains studio_ref (checkout transport only)
        required: true
        default: codex/studio-refactor-clean-ci-20261015
        type: string
      channel:
        description: Production update lane; empty uses product configuration
        required: false
        default: ""
        type: string
      update_origin:
        description: HTTPS origin that will serve the Studio feed
        required: false
        default: ""
        type: string
      storage_origin:
        description: KS3 origin for versioned Studio binaries
        required: false
        default: ""
        type: string
      release_layout:
        description: Versioned studio/<version> storage or legacy DSH layout
        required: true
        default: studio
        type: choice
        options:
          - studio
          - legacy
      update_mode:
        description: Incremental update or full-only ZIP using the official full-download fallback
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
      build_version:
        description: Semver build version; use a higher test suffix for update and rollback qualification
        required: false
        default: ""
        type: string
      release_tools_ref:
        description: Optional immutable release-tools SHA; defaults to studio_ref, does not change signed sources
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-windows-signing
  cancel-in-progress: false
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      name: ${{ steps.product.outputs.name }}
      app_id: ${{ steps.product.outputs.app_id }}
      channel: ${{ steps.product.outputs.channel }}
      update_origin: ${{ steps.product.outputs.update_origin }}
      storage_origin: ${{ steps.product.outputs.storage_origin }}
      build_version: ${{ steps.product.outputs.build_version }}
      update_environment: ${{ steps.product.outputs.update_environment }}
      plugin_roots: ${{ steps.product.outputs.plugin_roots }}
      plugin_bundles: ${{ steps.product.outputs.plugin_bundles }}
    steps:
      - name: Require immutable fresh signed candidates without publication
        env:
          DIAGNOSTIC_ONLY: ${{ false }}
          CANDIDATE_RUN: ${{ '' }}
          TOOLS_SHA: ${{ inputs.release_tools_ref || inputs.studio_ref }}
        run: |-
          test "$DIAGNOSTIC_ONLY" = false
          test -z "$CANDIDATE_RUN"
          [[ "$TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Qualify exact public source snapshot
        shell: bash
        env:
          STUDIO_SHA: ${{ inputs.studio_ref }}
        run: |
          set -euo pipefail
          [[ "$STUDIO_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$STUDIO_SHA" HEAD
          git checkout --detach "$STUDIO_SHA"
          pnpm install --frozen-lockfile
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks/gitleaks" make public-gate
      - name: Checkout workflow-owned public product resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tools_ref || inputs.studio_ref }}
          path: .product-tools
          persist-credentials: false
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
      - name: Resolve public product inputs
        id: product
        env:
          STUDIO_PRODUCT_BUILD_VERSION: ${{ inputs.build_version }}
          STUDIO_PRODUCT_UPDATE_ORIGIN: ${{ inputs.update_origin }}
          STUDIO_PRODUCT_STORAGE_ORIGIN: ${{ inputs.storage_origin }}
          STUDIO_PRODUCT_CHANNEL: ${{ inputs.channel }}
        run: node .product-tools/scripts/product-config.mjs github-outputs "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
    environment: studio-signing
  macos-arm64:
    env:
      STUDIO_PRODUCT_NAME: ${{ needs.source-gate.outputs.name }}
      STUDIO_PRODUCT_APP_ID: ${{ needs.source-gate.outputs.app_id }}
      STUDIO_PRODUCT_UPDATE_ENV: ${{ needs.source-gate.outputs.update_environment }}
    needs:
      - source-gate
    if: ${{ '' == '' }}
    runs-on: macos-14
    environment: studio-signing
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
      - name: Checkout AgentKit Studio
        uses: actions/checkout@v4
        with:
          repository: kingsoftcloud/agentkit-studio
          ref: ${{ inputs.studio_checkout_ref }}
          path: studio
          fetch-depth: 0
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Checkout pinned DSH
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ 'dsh-v0.2.0-rc.2' }}
          path: dsh-source
          fetch-depth: 1
      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: dsh-source/package.json
      - name: Verify immutable source inputs
        shell: bash
        env:
          EXPECTED_DSH_COMMIT: ${{ '639ed015397290b3745d163aafe02ffee4aa3f84' }}
          STUDIO_REF_VALUE: ${{ inputs.studio_ref }}
          STUDIO_CHECKOUT_REF_VALUE: ${{ inputs.studio_checkout_ref }}
          UPDATE_ORIGIN_VALUE: ${{ needs.source-gate.outputs.update_origin }}
          BUILD_VERSION_VALUE: ${{ needs.source-gate.outputs.build_version }}
        run: |
          set -euo pipefail
          actual_dsh_commit="$(git -C dsh-source rev-parse HEAD)"
          test "$actual_dsh_commit" = "$EXPECTED_DSH_COMMIT"
          [[ "$STUDIO_REF_VALUE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "studio_ref must be an immutable 40-character commit SHA" >&2
            exit 1
          }
          [[ "$STUDIO_CHECKOUT_REF_VALUE" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "studio_checkout_ref must be a branch or tag name" >&2
            exit 1
          }
          git -C studio merge-base --is-ancestor "$STUDIO_REF_VALUE" HEAD
          git -C studio checkout --detach "$STUDIO_REF_VALUE"
          test "$(git -C studio rev-parse HEAD)" = "$STUDIO_REF_VALUE"
          [[ "$UPDATE_ORIGIN_VALUE" =~ ^https://[^/[:space:]]+$ ]] || {
            echo "update_origin must be an HTTPS origin with a host" >&2
            exit 1
          }
          [[ "$UPDATE_ORIGIN_VALUE" != *example.com ]] || {
            echo "update_origin cannot use the example placeholder" >&2
            exit 1
          }
          [[ "$BUILD_VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "build_version must be a semantic version" >&2
            exit 1
          }
      - name: Prepare temporary Apple signing keychain
        shell: bash
        env:
          P12_BASE64: ${{ secrets.STUDIO_APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.STUDIO_APPLE_P12_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.STUDIO_APPLE_ID }}
          APPLE_APP_PASSWORD_VALUE: ${{ secrets.STUDIO_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.STUDIO_APPLE_TEAM_ID }}
          UPDATE_ORIGIN_VALUE: ${{ needs.source-gate.outputs.update_origin }}
          UPDATE_CHANNEL_VALUE: ${{ needs.source-gate.outputs.channel }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" -a -n "$P12_PASSWORD" -a -n "$APPLE_ID_VALUE" -a -n "$APPLE_APP_PASSWORD_VALUE" -a -n "$APPLE_TEAM_ID_VALUE"
          certificate_path="$RUNNER_TEMP/agentkit-studio-signing.p12"
          keychain_path="$RUNNER_TEMP/agentkit-studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains_file="$RUNNER_TEMP/agentkit-studio-existing-keychains"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -n "$existing_keychain" ]] && existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"$/\1/')
          printf '%s\n' "${existing_keychains[@]}" > "$existing_keychains_file"
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          identity_line="$(security find-identity -v -p codesigning "$keychain_path" | grep 'Developer ID Application' | head -1)"
          identity_full="${identity_line#*\"}"
          identity_full="${identity_full%\"}"
          identity="${identity_full#Developer ID Application: }"
          test -n "$identity" -a "$identity" != "$identity_full"
          {
            echo "STUDIO_KEYCHAIN_PATH=$keychain_path"
            echo "STUDIO_CERTIFICATE_PATH=$certificate_path"
            echo "STUDIO_CODESIGN_IDENTITY=$identity"
            echo "STUDIO_EXISTING_KEYCHAINS_PATH=$existing_keychains_file"
          } >> "$GITHUB_ENV"
          {
            printf '%s\n' \
              "DSH_DESKTOP_APP_ID=$STUDIO_PRODUCT_APP_ID" \
              "DSH_DESKTOP_AUTO_UPDATE_ENV=$STUDIO_PRODUCT_UPDATE_ENV" \
              "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$UPDATE_ORIGIN_VALUE" \
              "DSH_DESKTOP_UPDATE_ORIGIN=$UPDATE_ORIGIN_VALUE" \
              "DSH_DESKTOP_UPDATE_CHANNEL=$UPDATE_CHANNEL_VALUE" \
              "DSH_DESKTOP_MACOS_SIGNING_IDENTITY=$identity" \
              "DSH_DESKTOP_MACOS_TEAM_ID=$APPLE_TEAM_ID_VALUE" \
              "CSC_LINK=$certificate_path" \
              "CSC_KEY_PASSWORD=$P12_PASSWORD" \
              "APPLE_ID=$APPLE_ID_VALUE" \
              "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PASSWORD_VALUE" \
              "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE"
          } > dsh-source/apps/desktop/.env.macos
          chmod 600 dsh-source/apps/desktop/.env.macos
      - name: Build, sign and notarize Studio
        shell: bash
        working-directory: studio
        env:
          DSH_ROOT: ${{ github.workspace }}/dsh-source
          DSH_COMMIT: ${{ '639ed015397290b3745d163aafe02ffee4aa3f84' }}
          DSH_VERSION: 0.2.0-rc.2
          BUILD_VERSION: ${{ needs.source-gate.outputs.build_version }}
          PACK_DIR: ${{ github.workspace }}/studio/.artifacts
          EXPECTED_APP_ID: ${{ needs.source-gate.outputs.app_id }}
          EXPECTED_UPDATE_ORIGIN: ${{ needs.source-gate.outputs.update_origin }}
          EXPECTED_UPDATE_CHANNEL: ${{ needs.source-gate.outputs.channel }}
          EXPECTED_RELEASE_VERSION: ${{ needs.source-gate.outputs.build_version }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          DSH_DESKTOP_BUILD_VERSION="$BUILD_VERSION" make desktop-package-mac-arm64 DSH_ROOT="$DSH_ROOT" DSH_COMMIT="$DSH_COMMIT" DSH_VERSION="$DSH_VERSION" PACK_DIR="$PACK_DIR"
      - name: Verify signed and notarized artifacts
        id: verified-artifacts
        shell: bash
        working-directory: studio
        env:
          DSH_ROOT: ${{ github.workspace }}/dsh-source
          DSH_COMMIT: ${{ '639ed015397290b3745d163aafe02ffee4aa3f84' }}
          DSH_VERSION: 0.2.0-rc.2
          BUILD_VERSION: ${{ needs.source-gate.outputs.build_version }}
          PACK_DIR: ${{ github.workspace }}/studio/.artifacts
          EXPECTED_APP_ID: ${{ needs.source-gate.outputs.app_id }}
          EXPECTED_UPDATE_ORIGIN: ${{ needs.source-gate.outputs.update_origin }}
          EXPECTED_UPDATE_CHANNEL: ${{ needs.source-gate.outputs.channel }}
          EXPECTED_RELEASE_VERSION: ${{ needs.source-gate.outputs.build_version }}
        run: |
          set -euo pipefail
          artifacts="$(find "$PACK_DIR/desktop-checkouts" -type d -path '*/source/apps/desktop/.desktop-build/targets/mac-arm64/artifacts' -print -quit)"
          test -n "$artifacts" -a -d "$artifacts"
          dmg="$(find "$artifacts" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          zip="$(find "$artifacts" -maxdepth 1 -name '*.zip' -type f -print -quit)"
          blockmap="$(find "$artifacts" -maxdepth 1 -name '*.zip.blockmap' -type f -print -quit)"
          metadata="$(find "$artifacts" -maxdepth 1 -name '${{ needs.source-gate.outputs.channel }}-mac.yml' -type f -print -quit)"
          test -n "$dmg" -a -n "$zip" -a -n "$blockmap" -a -n "$metadata"
          unzip -tq "$zip"
          unpacked="$RUNNER_TEMP/agentkit-studio-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          unzip -q "$zip" -d "$unpacked"
          app="$(find "$unpacked" -name '*.app' -type d -print -quit)"
          test -n "$app"
          app_id="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")"
          test "$app_id" = "$EXPECTED_APP_ID"
          app_update="$app/Contents/Resources/app-update.yml"
          test -f "$app_update"
          export APP_UPDATE_PATH="$app_update" ZIP_PATH="$zip" METADATA_PATH="$metadata"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile, stat } from 'node:fs/promises'
          import { basename } from 'node:path'
          import YAML from 'yaml'

          const appUpdate = YAML.parse(await readFile(process.env.APP_UPDATE_PATH, 'utf8'))
          const expectedFeedUrl = `${process.env.EXPECTED_UPDATE_ORIGIN}/dsh-desk/feeds/mac-arm64/`
          if (appUpdate?.provider !== 'generic' || appUpdate.url !== expectedFeedUrl || appUpdate.channel !== process.env.EXPECTED_UPDATE_CHANNEL) {
            throw new Error(`packaged app-update.yml does not match the requested Studio feed: expected ${expectedFeedUrl} (${process.env.EXPECTED_UPDATE_CHANNEL}), got ${appUpdate?.url} (${appUpdate?.channel})`)
          }
          const metadata = YAML.parse(await readFile(process.env.METADATA_PATH, 'utf8'))
          const zipName = basename(process.env.ZIP_PATH)
          if (metadata?.version !== process.env.EXPECTED_RELEASE_VERSION || metadata?.path !== zipName || !Array.isArray(metadata.files)) {
            throw new Error('update metadata does not match the packaged ZIP/version')
          }
          const entry = metadata.files.find(file => file?.url === zipName || file?.url?.endsWith(`/${zipName}`))
          if (!entry || !Number.isInteger(entry.size) || entry.size !== (await stat(process.env.ZIP_PATH)).size) {
            throw new Error('update metadata ZIP size is missing or incorrect')
          }
          const sha512 = createHash('sha512').update(await readFile(process.env.ZIP_PATH)).digest('base64')
          if (entry.sha512 !== sha512 || metadata.sha512 !== undefined && metadata.sha512 !== sha512) {
            throw new Error('update metadata ZIP SHA-512 is missing or incorrect')
          }
          NODE
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/verify-desktop-module-graph.mjs "$app"
          node scripts/verify-codex-signing.mjs "$app" "$artifacts/mac-arm64-release.json"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          printf 'artifacts=%s\ndmg=%s\nzip=%s\nblockmap=%s\nmetadata=%s\n' "$artifacts" "$dmg" "$zip" "$blockmap" "$metadata" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify native Studio first-use configuration
        shell: bash
        working-directory: studio
        env:
          BUILD_VERSION: ${{ needs.source-gate.outputs.build_version }}
        run: |
          node scripts/verify-macos-onboarding.mjs --app "$RUNNER_TEMP/agentkit-studio-unpacked/${STUDIO_PRODUCT_NAME}.app" --version "$BUILD_VERSION" --output .artifacts/onboarding-proof
      - name: Retain native onboarding diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-onboarding-${{ needs.source-gate.outputs.build_version }}-mac-arm64
          path: studio/.artifacts/onboarding-proof/
          if-no-files-found: warn
      - name: Stage signed release candidate
        id: staged-candidate
        if: ${{ always() && steps.verified-artifacts.conclusion == 'success' }}
        shell: bash
        working-directory: studio
        env:
          PACK_DIR: ${{ github.workspace }}/studio/.artifacts
          CHANNEL: ${{ needs.source-gate.outputs.channel }}
        run: |
          set -euo pipefail
          artifacts="$(find "$PACK_DIR/desktop-checkouts" -type d -path '*/source/apps/desktop/.desktop-build/targets/mac-arm64/artifacts' -print -quit)"
          test -n "$artifacts" -a -d "$artifacts"
          dmg="$(find "$artifacts" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          zip="$(find "$artifacts" -maxdepth 1 -name '*.zip' -type f ! -name '*.zip.blockmap' -print -quit)"
          blockmap="$(find "$artifacts" -maxdepth 1 -name '*.zip.blockmap' -type f -print -quit)"
          metadata="$artifacts/${CHANNEL}-mac.yml"
          release_record="$artifacts/mac-arm64-release.json"
          test -n "$dmg" -a -n "$zip" -a -n "$blockmap" -a -f "$metadata" -a -f "$release_record"
          staging="$GITHUB_WORKSPACE/release-candidate"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp "$dmg" "$zip" "$blockmap" "$metadata" "$release_record" "$staging/"
          (cd "$staging" && shasum -a 256 ./* > SHA256SUMS)
          printf 'staging=%s\n' "$staging" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed Studio release candidate
        if: ${{ always() && steps.staged-candidate.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-studio-${{ inputs.studio_ref }}-${{ needs.source-gate.outputs.channel }}-mac-arm64
          path: release-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          existing_keychains_path="${STUDIO_EXISTING_KEYCHAINS_PATH:-}"
          if [ -n "$existing_keychains_path" ] && [ -f "$existing_keychains_path" ]; then
            existing_keychains=()
            while IFS= read -r existing_keychain; do
              [[ -n "$existing_keychain" ]] && existing_keychains+=("$existing_keychain")
            done < "$existing_keychains_path"
            if [ "${#existing_keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${existing_keychains[@]}"
            fi
            rm -f "$existing_keychains_path"
          fi
          certificate_path="${STUDIO_CERTIFICATE_PATH:-}"
          [ -z "$certificate_path" ] || rm -f "$certificate_path"
          rm -f "$GITHUB_WORKSPACE/dsh-source/apps/desktop/.env.macos"
          keychain_path="${STUDIO_KEYCHAIN_PATH:-}"
          [ -z "$keychain_path" ] || security delete-keychain "$keychain_path"
  windows-x64:
    runs-on: windows-2025
    environment: studio-signing
    timeout-minutes: 90
    steps:
      - name: Preserve canonical source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_checkout_ref }}
          fetch-depth: 0
          persist-credentials: false
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
      - name: Verify immutable Studio source
        shell: pwsh
        env:
          STUDIO_SHA: ${{ inputs.studio_ref }}
          TOOLS_SHA: ${{ inputs.release_tools_ref || inputs.studio_ref }}
        run: |
          if ($env:STUDIO_SHA -notmatch '^[0-9a-f]{40}$') { throw 'studio_ref must be a full commit SHA' }
          if ($env:TOOLS_SHA -notmatch '^[0-9a-f]{40}$') { throw 'release_tools_ref must be a full commit SHA' }
          git merge-base --is-ancestor $env:TOOLS_SHA HEAD
          if ($LASTEXITCODE) { throw 'Qualification tools are outside the selected branch' }
          git merge-base --is-ancestor $env:STUDIO_SHA HEAD
          if ($LASTEXITCODE) { throw 'Source commit is outside the selected branch' }
          git checkout --detach $env:STUDIO_SHA
          if ($LASTEXITCODE -or (git rev-parse HEAD) -ne $env:STUDIO_SHA) { throw 'Studio checkout mismatch' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tools_ref || inputs.studio_ref }}
          path: .qualification-tools
          persist-credentials: false
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
      - name: Checkout workflow-owned public product resolver
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tools_ref || inputs.studio_ref }}
          path: .product-tools
          persist-credentials: false
          repository: kingsoftcloud/agentkit-studio
          token: ${{ secrets.AGENTKIT_STUDIO_SOURCE_TOKEN }}
      - uses: actions/checkout@v4
        if: ${{ '' == '' }}
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.2.0-rc.2
          path: dsh-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        if: ${{ '' == '' }}
        with:
          version: 11.7.0
          package_json_file: dsh-source/package.json
      - uses: pnpm/action-setup@v4
        if: ${{ '' != '' }}
        with:
          version: 10.33.2
          package_json_file: package.json
      - name: Resolve qualified public product inputs
        id: product
        shell: pwsh
        env:
          STUDIO_PRODUCT_BUILD_VERSION: ${{ inputs.build_version }}
          STUDIO_PRODUCT_UPDATE_ORIGIN: ${{ inputs.update_origin }}
          STUDIO_PRODUCT_CHANNEL: ${{ inputs.channel }}
        run: |
          $values = & node .product-tools/scripts/product-config.mjs github-outputs "$PWD"
          if ($LASTEXITCODE) { throw 'Public product input resolution failed' }
          $values | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prepare verified signed candidate reuse
        if: ${{ '' != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.studio_ref }}
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          CANDIDATE_RUN: ${{ '' }}
        run: |
          if ('${{ false }}' -eq 'true') { throw 'Signed candidate reuse cannot be diagnostic-only' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Qualification dependencies failed' }
          node .qualification-tools/scripts/prepare-windows-candidate.mjs --repository '${{ github.repository }}' --run $env:CANDIDATE_RUN --source $env:SOURCE_SHA --version $env:BUILD_VERSION --output .artifacts/windows-candidate
          if ($LASTEXITCODE) { throw 'Signed candidate identity or digest failed' }
          Expand-Archive -LiteralPath .artifacts/windows-candidate/candidate.zip -DestinationPath .artifacts/windows-candidate/unpacked
          $candidate = @(Get-ChildItem .artifacts/windows-candidate/unpacked -Directory -Recurse | Where-Object { $_.Name -eq 'windows-release' })
          if ($candidate.Count -ne 1) { throw 'Expected one signed release directory' }
          "STUDIO_REUSE_ARTIFACTS=$($candidate[0].FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Prepare short isolated build root
        if: ${{ '' == '' }}
        shell: pwsh
        run: |
          if ((git -C dsh-source rev-parse HEAD) -ne '639ed015397290b3745d163aafe02ffee4aa3f84') { throw 'DSH baseline mismatch' }
          git config --system core.longpaths true
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { throw 'Studio dependency installation failed' }
          pnpm pack --pack-destination .artifacts
          if ($LASTEXITCODE) { throw 'Studio plugin pack failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $inputRoot = Join-Path $env:RUNNER_TEMP 'studio-plugin-input'
          New-Item -ItemType Directory -Force $inputRoot | Out-Null
          Copy-Item ".artifacts/kingsoftcloud-agentkit-studio-$version.tgz" $inputRoot
          "DSH_DESKTOP_PLUGIN_INPUTS=$inputRoot" | Out-File $env:GITHUB_ENV -Append
          "STUDIO_PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      - name: Prepare fresh Certum authentication URI
        if: ${{ ! false && '' == '' }}
        id: certum
        shell: pwsh
        env:
          CERTUM_ACCOUNT: ${{ secrets.CERTUM_ACCOUNT }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
        run: |
          $account = if ($env:CERTUM_ACCOUNT) {$env:CERTUM_ACCOUNT} else {$env:CERTUM_EMAIL}
          if (-not $account -or -not $env:CERTUM_TOTP_SECRET) { throw 'Certum account and TOTP configuration are required' }
          $seed = $env:CERTUM_TOTP_SECRET.Trim()
          if ($seed.StartsWith('otpauth://')) { $uri = $seed }
          elseif ($seed -match '^[A-Za-z2-7]+=*$') { $uri = "otpauth://totp/SimplySign?secret=$seed&algorithm=SHA256&digits=6&period=30" }
          else { throw 'CERTUM_TOTP_SECRET must be a Base32 seed or complete otpauth URI' }
          Write-Output "::add-mask::$uri"
          Write-Output "::add-mask::$account"
          "uri=$uri" | Out-File $env:GITHUB_OUTPUT -Append
          "account=$account" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Authenticate Certum cloud certificate
        if: ${{ ! false && '' == '' }}
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
        with:
          certum-username: ${{ steps.certum.outputs.account }}
          certum-otp-uri: ${{ steps.certum.outputs.uri }}
          certum-key-id: ${{ secrets.CERTUM_THUMBPRINT }}
          capture-diagnostics: "false"
      - name: Configure verified certificate-store signing
        if: ${{ ! false && '' == '' }}
        shell: pwsh
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
          UPDATE_ORIGIN: ${{ steps.product.outputs.update_origin }}
          CHANNEL: ${{ steps.product.outputs.channel }}
          STUDIO_PRODUCT_APP_ID: ${{ steps.product.outputs.app_id }}
          STUDIO_PRODUCT_UPDATE_ENV: ${{ steps.product.outputs.update_environment }}
        run: ./.product-tools/scripts/prepare-windows-signing.ps1 -DshRoot "$PWD/dsh-source" -UpdateOrigin $env:UPDATE_ORIGIN -Channel $env:CHANNEL -AppId $env:STUDIO_PRODUCT_APP_ID -UpdateEnvironment $env:STUDIO_PRODUCT_UPDATE_ENV
      - name: Configure isolated unsigned diagnostic package
        if: ${{ false && '' == '' }}
        shell: pwsh
        env:
          UPDATE_ORIGIN: ${{ steps.product.outputs.update_origin }}
          CHANNEL: ${{ steps.product.outputs.channel }}
          STUDIO_PRODUCT_APP_ID: ${{ steps.product.outputs.app_id }}
          STUDIO_PRODUCT_UPDATE_ENV: ${{ steps.product.outputs.update_environment }}
        run: |
          $uri = [Uri]$env:UPDATE_ORIGIN
          if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.AbsolutePath -ne '/') { throw 'Invalid update origin' }
          $settings = @{
            DSH_DESKTOP_APP_ID = $env:STUDIO_PRODUCT_APP_ID
            DSH_DESKTOP_AUTO_UPDATE_ENV = $env:STUDIO_PRODUCT_UPDATE_ENV
            DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN = $env:UPDATE_ORIGIN
            DSH_DESKTOP_UPDATE_ORIGIN = $env:UPDATE_ORIGIN
            DSH_DESKTOP_UPDATE_CHANNEL = $env:CHANNEL
          }
          $lines = foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)='$($entry.Value)'" }
          [IO.File]::WriteAllText("$PWD/dsh-source/apps/desktop/.env.windows", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Package the official DSH Windows target
        if: ${{ '' == '' }}
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
          DSH_CLIENT_TITLE: ${{ steps.product.outputs.name }}
          DSH_DESKTOP_PLUGIN_ROOTS: ${{ steps.product.outputs.plugin_roots }}
          DSH_DESKTOP_PLUGIN_BUNDLES: ${{ steps.product.outputs.plugin_bundles }}
          STUDIO_PRODUCT_ICON: ${{ steps.product.outputs.windows_icon }}
          STUDIO_PRODUCT_TRAY_ICON: ${{ steps.product.outputs.windows_tray_icon }}
        run: |
          [string[]]$packageArguments = @('--source', "$PWD/dsh-source", '--output', "$env:RUNNER_TEMP/studio-build", '--patches', "$PWD/patches/dsh-v0.2.0-rc.2", '--commit', '639ed015397290b3745d163aafe02ffee4aa3f84', '--target', 'win-x64', '--dsh-version', '0.2.0-rc.2', '--studio-version', $env:STUDIO_PACKAGE_VERSION, '--build-version', $env:BUILD_VERSION)
          if ('${{ false }}' -eq 'true') { $packageArguments += '--unsigned' }
          $env:DSH_DESKTOP_PRODUCT_ICON = Join-Path $PWD $env:STUDIO_PRODUCT_ICON
          $env:DSH_DESKTOP_PRODUCT_TRAY_ICON = Join-Path $PWD $env:STUDIO_PRODUCT_TRAY_ICON
          pnpm exec node scripts/package-desktop.mjs @packageArguments
          if ($LASTEXITCODE) { throw 'Signed Windows packaging failed' }
      - name: Verify timestamped installer and actual installation
        if: ${{ ! false }}
        shell: pwsh
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
        run: |
          if ($env:STUDIO_REUSE_ARTIFACTS) { $artifacts = $env:STUDIO_REUSE_ARTIFACTS }
          else {
            $candidates = @(Get-Item "$env:RUNNER_TEMP/studio-build/desktop-checkouts/*/source/apps/desktop/.desktop-build/targets/win-x64/artifacts")
            if ($candidates.Count -ne 1) { throw 'Expected exactly one signed output directory' }
            $artifacts = $candidates[0].FullName
          }
          ./.qualification-tools/scripts/verify-windows-install.ps1 -Artifacts $artifacts -Version $env:BUILD_VERSION -Evidence .artifacts/windows-proof
          New-Item -ItemType Directory -Force .artifacts/windows-release | Out-Null
          Copy-Item "$artifacts/*" .artifacts/windows-release -Recurse
          if (Test-Path .artifacts/windows-candidate/provenance.json) { Copy-Item .artifacts/windows-candidate/provenance.json .artifacts/windows-proof/candidate-provenance.json }
      - name: Verify the actually installed Windows App UI
        if: ${{ ! false }}
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.product.outputs.build_version }}
        run: |
          node .qualification-tools/scripts/verify-windows-app-ui.mjs
          if ($LASTEXITCODE) { throw 'Installed Windows App UI acceptance failed' }
        timeout-minutes: 20
      - name: Collect credential-free packaging diagnostics
        if: always() && false
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/windows-diagnostics | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/studio-build/desktop-checkouts" -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
            $runs = Join-Path $_.FullName 'source/apps/desktop/.desktop-build/packaging-runs'
            if (Test-Path $runs) {
              Get-ChildItem -LiteralPath $runs -Recurse -File -Force |
                Where-Object { $_.Extension -in @('.json', '.jsonl', '.log') } |
                ForEach-Object { Copy-Item $_.FullName (Join-Path '.artifacts/windows-diagnostics' ($_.Directory.Name + '-' + $_.Name)) }
            }
          }
      - name: Retain signed installer and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-studio-${{ steps.product.outputs.build_version }}-win-x64
          path: |
            .artifacts/windows-release/
            .artifacts/windows-proof/
            .artifacts/windows-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Remove local signing settings
        if: always()
        shell: pwsh
        run: |
          Remove-Item dsh-source/apps/desktop/.env.windows -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP/studio-code-signing.cer" -Force -ErrorAction SilentlyContinue
    needs:
      - source-gate
