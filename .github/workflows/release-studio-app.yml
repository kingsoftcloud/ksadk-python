name: Release Studio App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.8.4). Release must already exist.
        required: false

permissions:
  contents: write  # upload release assets

concurrency:
  group: release-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────
  # macOS arm64: self-contained .app, signed with Developer ID + notarized.
  # ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    environment: studio-signing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # Import the Developer ID Application cert + private key into a temporary
      # keychain. Mirrors Wegent's wework-app.yml flow so the kcwork team can
      # reuse the same .p12 across both products. Skipped when the cert secret
      # is absent (unsigned local-style build). Auto-discovers the identity
      # name so we don't need a separate CODESIGN_IDENTITY secret.
      #
      # GitHub Actions `if` cannot read secrets directly (returns empty / parse
      # error), so we map the secret to an env var and test the env var. The
      # env var is also what the step uses, avoiding a second secret read.
      - name: Prepare Apple signing keychain
        if: ${{ env.P12_PRESENT == 'true' }}
        env:
          P12_PRESENT: ${{ secrets.STUDIO_APPLE_P12_BASE64 != '' && 'true' || 'false' }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.STUDIO_APPLE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.STUDIO_APPLE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/studio-signing.p12"
          keychain_path="$RUNNER_TEMP/studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"$/\1/')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security import "$certificate_path" \
            -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "Developer ID Application identity not found" >&2
            exit 1
          }
          echo "STUDIO_APP_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      # create_studio_icon.py uses PIL to render the app icon. Pillow isn't in
      # the runner's system Python; install it before packaging.
      - name: Install icon build dependency
        run: python -m pip install --quiet pillow

      # Resolve the ksadk version once; both Package and DMG steps use it.
      # workflow_dispatch has no release tag, and github.ref_name is the
      # branch name — package_studio_app.sh requires STUDIO_APP_VERSION.
      - name: Resolve version
        shell: bash
        run: |
          echo "STUDIO_APP_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_ENV"

      # package_studio_app.sh copies the DSH toolchain from
      # ~/.agentengine/plugin-toolchains/dsh/<ver>. CI runners are clean, so
      # install it first via the ksadk CLI (pnpm install of @deepseek-ai/dsh).
      - name: Install DSH toolchain
        run: uv run agentengine plugin toolchain install

      # Notarization uses the Apple ID + app-specific password flow (the team
      # account holder's credential, stored as repo secrets). The App Store
      # Connect API Key path needs admin-gated keys we don't have; the Apple ID
      # flow was verified locally against the same secret set.
      - name: Package + sign + notarize
        # studio-app-package depends on build-wheel, which depends on
        # build-frontend (sync-ksadk-web-static + build-studio-static), so one
        # make invocation produces the full signed .app bundle.
        run: make studio-app-package
        env:
          KSADK_WEB_VERSION: "0.3.12"
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}
          STUDIO_APP_CODESIGN_IDENTITY: ${{ env.STUDIO_APP_CODESIGN_IDENTITY }}
          STUDIO_APP_NOTARIZE: ${{ secrets.STUDIO_APPLE_P12_BASE64 != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.STUDIO_APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.STUDIO_APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.STUDIO_APPLE_TEAM_ID }}

      - name: Build DMG (with Applications shortcut)
        run: make studio-app-dmg
        env:
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}

      - name: Zip the .app bundle
        run: |
          cd dist/studio-app
          ditto -c -k --keepParent AgentKitStudio.app AgentKitStudio-macos-arm64.zip

      - name: Generate latest-mac.yml
        # electron-updater reads this from the release to discover updates.
        # version = release tag, files[].url = bare zip name, sha512 = base64.
        run: |
          python3 scripts/write_studio_update_manifest.py \
            --version "${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}" \
            --artifact dist/studio-app/AgentKitStudio-macos-arm64.zip \
            --release-date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --channel mac \
            --out dist/studio-app/latest-mac.yml

      - name: Upload to GitHub Release
        # Only upload when triggered by a real release publish. workflow_dispatch
        # (manual testing) would otherwise create spurious releases tagged with
        # the branch name.
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            dist/studio-app/AgentKitStudio-*.dmg
            dist/studio-app/AgentKitStudio-macos-arm64.zip
            dist/studio-app/latest-mac.yml
          fail_on_unmatched_files: true

  # ────────────────────────────────────────────────────────────────────
  # Windows x64: NSIS installer, signed via SignPath (HSM-held key).
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    environment: studio-signing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # create_studio_icon.py uses PIL; not in the runner's system Python.
      - name: Install icon build dependency
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Build wheel + sync static assets
        shell: bash
        run: |
          make sync-ksadk-web-static
          make build-studio-static
          make build-wheel
        env:
          KSADK_WEB_VERSION: "0.3.12"

      - name: Prepare DSH toolchain (win32-x64 prebuilds)
        shell: bash
        run: |
          dsh_root="$HOME/.agentengine/plugin-toolchains/dsh/0.1.5-rc.1"
          # Install the pinned DSH CLI on Windows so optionalDependencies
          # (sharp, node-addon-require-builtin) resolve their win32-x64 variants.
          # If npm registry lacks a win32 build the install fails here — that is
          # the intended early signal rather than a broken bundle at runtime.
          mkdir -p "$dsh_root"
          cd "$dsh_root"
          echo '{"name":"agentengine-managed-dsh-toolchain","private":true,"dependencies":{"@deepseek-ai/dsh":"0.1.5-rc.1"}}' > package.json
          npm install --no-audit --no-fund
          test -d node_modules/@deepseek-ai/dsh || { echo "ERROR: @deepseek-ai/dsh not installed"; exit 1; }

      - name: Resolve version
        shell: bash
        run: |
          echo "STUDIO_APP_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_ENV"

      - name: Package Windows zip
        # studio-app-package-windows depends on build-wheel → build-frontend
        # (sync + build-studio-static). Ships a zip (not NSIS) because DSH
        # toolchain's pnpm nested node_modules exceeds Windows 260-char path
        # limit, which NSIS File /r cannot traverse.
        shell: bash
        run: make studio-app-package-windows
        env:
          KSADK_WEB_VERSION: "0.3.12"
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}
          STUDIO_APP_PYTHON_VERSION: "3.13.1"

      # Always expose the built zip as a workflow artifact so the signing job
      # (and manual fallback) can pick it up without creating a release.
      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-unsigned
          path: dist/studio-app/AgentKitStudio-windows-x64.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Sign the Windows bundle on Linux: Certum SimplySign cloud cert.
  # The private key never leaves Certum's cloud; the SimplySign Linux client
  # logs in headlessly (account + TOTP generated from the stored secret) and
  # exposes the certificate via a PKCS#11 module for osslsigncode.
  # ────────────────────────────────────────────────────────────────────
  sign-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    environment: studio-signing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Download unsigned bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle-unsigned
          path: work/

      - name: Install signing tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode xvfb unzip
          osslsigncode --version

      - name: Install SimplySign Linux client
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://files.certum.cn/SimplySignDesktop-2.9.12-9.3.2.0-x86_64-prod-ubuntu.bin" \
            -o /tmp/simplysign-ubuntu.bin
          chmod +x /tmp/simplysign-ubuntu.bin
          # The .bin is a makeself self-extracting installer. Extract its
          # payload — the client binary and PKCS#11 module live in there, so
          # no system install is needed; osslsigncode loads the module
          # directly from the extracted tree.
          /tmp/simplysign-ubuntu.bin --target /tmp/simplysign-extract --noexec
          echo "── extract tree ──"
          find /tmp/simplysign-extract -type f 2>/dev/null | head -60
          CLIENT=$(find /tmp/simplysign-extract -type f -executable 2>/dev/null \
            | grep -iE 'simplysign' | head -1)
          PKCS11=$(find /tmp/simplysign-extract -type f -name '*.so*' 2>/dev/null \
            | grep -iE 'simplysign|pkcs11' | head -1)
          # Fallback: run the self-extracting installer itself (it may install
          # to /opt) if the payload does not carry the files directly.
          if [ -z "$CLIENT" ] || [ -z "$PKCS11" ]; then
            echo "── fallback: run the installer directly ──"
            sudo /tmp/simplysign-ubuntu.bin 2>&1 | tail -20 || true
            CLIENT=$(find /opt /usr/local /usr/bin -name 'SimplySignDesktop' -type f 2>/dev/null | head -1)
            PKCS11=$(find /opt /usr/local /usr/lib -type f -name '*.so' 2>/dev/null \
              | grep -iE 'simplysign|pkcs11' | head -1)
          fi
          [ -n "$CLIENT" ] || { echo "ERROR: SimplySign client binary not found"; exit 1; }
          [ -n "$PKCS11" ] || { echo "ERROR: SimplySign PKCS#11 module not found"; exit 1; }
          echo "SIMPLYSIGN_CLIENT=$CLIENT" >> "$GITHUB_ENV"
          echo "SIMPLYSIGN_PKCS11=$PKCS11" >> "$GITHUB_ENV"
          echo "client: $CLIENT"
          echo "pkcs11: $PKCS11"

      - name: Log in to SimplySign (headless, TOTP from secret)
        env:
          CERTUM_ACCOUNT: ${{ secrets.CERTUM_ACCOUNT }}
          CERTUM_TOTP_SECRET: ${{ secrets.CERTUM_TOTP_SECRET }}
        run: |
          set -euo pipefail
          # Generate the current 6-digit TOTP (SHA256, 30s window) from the
          # stored secret — the same algorithm the SimplySign mobile app uses.
          TOTP=$(python3 - "$CERTUM_TOTP_SECRET" <<'PY'
          import hmac, hashlib, struct, time, base64, sys
          secret = sys.argv[1]
          pad = (8 - len(secret) % 8) % 8
          key = base64.b32decode(secret + "=" * pad)
          counter = int(time.time()) // 30
          h = hmac.new(key, struct.pack(">Q", counter), hashlib.sha256).digest()
          offset = h[-1] & 0x0F
          code = (struct.unpack(">I", h[offset:offset+4])[0] & 0x7FFFFFFF) % 10**6
          print(f"{code:06d}")
          PY
          )
          # Headless login: the client runs under a virtual display and stays
          # alive as a daemon holding the cloud signing session.
          xvfb-run -a "$SIMPLYSIGN_CLIENT" -n "$CERTUM_ACCOUNT" -p "$TOTP" &
          sleep 15
          # Confirm the client process survived login (a login failure exits it).
          pgrep -f SimplySignDesktop >/dev/null || {
            echo "ERROR: SimplySign client exited — login likely failed" >&2
            exit 1
          }
          echo "SimplySign session established"

      - name: Sign all PE files in the bundle
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
        run: |
          set -euo pipefail
          mkdir -p bundle work/extract
          unzip -q work/AgentKitStudio-windows-x64.zip -d work/extract
          BUNDLE_DIR=$(find work/extract -maxdepth 2 -name 'AgentKitStudio' -type d | head -1)
          [ -n "$BUNDLE_DIR" ] || { echo "ERROR: AgentKitStudio dir not found in zip"; exit 1; }
          # Sign every PE file; osslsigncode picks the cert via the SimplySign
          # PKCS#11 module. Timestamping goes to Sectigo per the Certum guide.
          SIGNED=0
          while IFS= read -r file; do
            if osslsigncode sign \
                -pkcs11provider "$SIMPLYSIGN_PKCS11" \
                -h sha256 \
                -t "http://timestamp.sectigo.com" \
                -in "$file" -out "$file.signed" 2>/dev/null; then
              mv "$file.signed" "$file"
              SIGNED=$((SIGNED+1))
            else
              rm -f "$file.signed"
              echo "skip (not signable or unsigned failure): $file"
            fi
          done < <(find "$BUNDLE_DIR" -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.node' -o -name '*.pyd' \) | grep -v app.asar)
          echo "signed $SIGNED files"
          [ "$SIGNED" -gt 0 ] || { echo "ERROR: no files were signed"; exit 1; }
          # Re-zip preserving the bundle root folder.
          cd "$(dirname "$BUNDLE_DIR")"
          zip -qr "$GITHUB_WORKSPACE/work/AgentKitStudio-windows-x64.zip" "$(basename "$BUNDLE_DIR")"

      - name: Generate latest.yml (signed zip)
        run: |
          python3 scripts/write_studio_update_manifest.py \
            --version "${STUDIO_APP_VERSION:-0.8.5}" \
            --artifact work/AgentKitStudio-windows-x64.zip \
            --release-date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --channel win \
            --out work/latest.yml

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentKitStudio-windows-x64-signed
          path: |
            work/AgentKitStudio-windows-x64.zip
            work/latest.yml
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            work/AgentKitStudio-windows-x64.zip
            work/latest.yml
          fail_on_unmatched_files: true
