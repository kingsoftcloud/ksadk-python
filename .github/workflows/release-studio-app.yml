name: Release Studio App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to (e.g. v0.8.4). Release must already exist.
        required: false

permissions:
  contents: write  # upload release assets

concurrency:
  group: release-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────
  # macOS arm64: self-contained .app, signed with Developer ID + notarized.
  # ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    environment: studio-signing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # Import the Developer ID Application cert + private key into a temporary
      # keychain. Mirrors Wegent's wework-app.yml flow so the kcwork team can
      # reuse the same .p12 across both products. Skipped when the cert secret
      # is absent (unsigned local-style build). Auto-discovers the identity
      # name so we don't need a separate CODESIGN_IDENTITY secret.
      #
      # GitHub Actions `if` cannot read secrets directly (returns empty / parse
      # error), so we map the secret to an env var and test the env var. The
      # env var is also what the step uses, avoiding a second secret read.
      - name: Prepare Apple signing keychain
        if: ${{ env.P12_PRESENT == 'true' }}
        env:
          P12_PRESENT: ${{ secrets.STUDIO_APPLE_P12_BASE64 != '' && 'true' || 'false' }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.STUDIO_APPLE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.STUDIO_APPLE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/studio-signing.p12"
          keychain_path="$RUNNER_TEMP/studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("$existing_keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)"$/\1/')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security import "$certificate_path" \
            -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "Developer ID Application identity not found" >&2
            exit 1
          }
          echo "STUDIO_APP_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      # create_studio_icon.py uses PIL to render the app icon. Pillow isn't in
      # the runner's system Python; install it before packaging.
      - name: Install icon build dependency
        run: python -m pip install --quiet pillow

      # Resolve the ksadk version once; both Package and DMG steps use it.
      # workflow_dispatch has no release tag, and github.ref_name is the
      # branch name — package_studio_app.sh requires STUDIO_APP_VERSION.
      - name: Resolve version
        shell: bash
        run: |
          echo "STUDIO_APP_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_ENV"

      # package_studio_app.sh copies the DSH toolchain from
      # ~/.agentengine/plugin-toolchains/dsh/<ver>. CI runners are clean, so
      # install it first via the ksadk CLI (pnpm install of @deepseek-ai/dsh).
      - name: Install DSH toolchain
        run: uv run agentengine plugin toolchain install

      # Notarization uses the Apple ID + app-specific password flow (the team
      # account holder's credential, stored as repo secrets). The App Store
      # Connect API Key path needs admin-gated keys we don't have; the Apple ID
      # flow was verified locally against the same secret set.
      - name: Package + sign + notarize
        # studio-app-package depends on build-wheel, which depends on
        # build-frontend (sync-ksadk-web-static + build-studio-static), so one
        # make invocation produces the full signed .app bundle.
        run: make studio-app-package
        env:
          KSADK_WEB_VERSION: "0.3.10"
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}
          STUDIO_APP_CODESIGN_IDENTITY: ${{ env.STUDIO_APP_CODESIGN_IDENTITY }}
          STUDIO_APP_NOTARIZE: ${{ secrets.STUDIO_APPLE_P12_BASE64 != '' && '1' || '0' }}
          APPLE_ID: ${{ secrets.STUDIO_APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.STUDIO_APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.STUDIO_APPLE_TEAM_ID }}

      - name: Build DMG (with Applications shortcut)
        run: make studio-app-dmg
        env:
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}

      - name: Zip the .app bundle
        run: |
          cd dist/studio-app
          ditto -c -k --keepParent AgentKitStudio.app AgentKitStudio-macos-arm64.zip

      - name: Generate latest-mac.yml
        # electron-updater reads this from the release to discover updates.
        # version = release tag, files[].url = bare zip name, sha512 = base64.
        run: |
          python3 scripts/write_studio_update_manifest.py \
            --version "${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}" \
            --artifact dist/studio-app/AgentKitStudio-macos-arm64.zip \
            --release-date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --channel mac \
            --out dist/studio-app/latest-mac.yml

      - name: Upload to GitHub Release
        # Only upload when triggered by a real release publish. workflow_dispatch
        # (manual testing) would otherwise create spurious releases tagged with
        # the branch name.
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            dist/studio-app/AgentKitStudio-*.dmg
            dist/studio-app/AgentKitStudio-macos-arm64.zip
            dist/studio-app/latest-mac.yml
          fail_on_unmatched_files: true

  # ────────────────────────────────────────────────────────────────────
  # Windows x64: NSIS installer, signed via SignPath (HSM-held key).
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    environment: studio-signing
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # create_studio_icon.py uses PIL; not in the runner's system Python.
      - name: Install icon build dependency
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Build wheel + sync static assets
        shell: bash
        run: |
          make sync-ksadk-web-static
          make build-studio-static
          make build-wheel
        env:
          KSADK_WEB_VERSION: "0.3.10"

      - name: Prepare DSH toolchain (win32-x64 prebuilds)
        shell: bash
        run: |
          dsh_root="$HOME/.agentengine/plugin-toolchains/dsh/0.1.5-rc.1"
          # Install the pinned DSH CLI on Windows so optionalDependencies
          # (sharp, node-addon-require-builtin) resolve their win32-x64 variants.
          # If npm registry lacks a win32 build the install fails here — that is
          # the intended early signal rather than a broken bundle at runtime.
          mkdir -p "$dsh_root"
          cd "$dsh_root"
          echo '{"name":"agentengine-managed-dsh-toolchain","private":true,"dependencies":{"@deepseek-ai/dsh":"0.1.5-rc.1"}}' > package.json
          npm install --no-audit --no-fund
          test -d node_modules/@deepseek-ai/dsh || { echo "ERROR: @deepseek-ai/dsh not installed"; exit 1; }

      - name: Resolve version
        shell: bash
        run: |
          echo "STUDIO_APP_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_ENV"

      - name: Package Windows zip
        # studio-app-package-windows depends on build-wheel → build-frontend
        # (sync + build-studio-static). Ships a zip (not NSIS) because DSH
        # toolchain's pnpm nested node_modules exceeds Windows 260-char path
        # limit, which NSIS File /r cannot traverse.
        shell: bash
        run: make studio-app-package-windows
        env:
          KSADK_WEB_VERSION: "0.3.10"
          STUDIO_APP_VERSION: ${{ env.STUDIO_APP_VERSION }}
          STUDIO_APP_PYTHON_VERSION: "3.13.1"

      - name: Generate latest.yml
        # electron-updater reads this from the release to discover Windows
        # updates. version = release tag, files[].url = bare zip name,
        # sha512 = base64.
        shell: bash
        run: |
          python3 scripts/write_studio_update_manifest.py \
            --version "${{ env.STUDIO_APP_VERSION }}" \
            --artifact dist/studio-app/AgentKitStudio-windows-x64.zip \
            --release-date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --channel win \
            --out dist/studio-app/latest.yml

      - name: Upload to GitHub Release
        # Only upload when triggered by a real release publish. workflow_dispatch
        # (manual testing) would otherwise create spurious releases tagged with
        # the branch name.
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            dist/studio-app/AgentKitStudio-windows-x64.zip
            dist/studio-app/latest.yml
          fail_on_unmatched_files: true
