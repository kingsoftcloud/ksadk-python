name: Secret Pattern Audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "open-source/**"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run Gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            log_opts="${PUSH_BEFORE_SHA}..${PUSH_HEAD_SHA}"
          else
            log_opts="${PUSH_HEAD_SHA}"
          fi
          /tmp/gitleaks detect --source . --config .gitleaks.toml --log-opts "$log_opts" --no-banner --redact --verbose

      - name: Run open-source content audit
        run: |
          if [ -f export-manifest.json ]; then
            audit_root="$PWD"
          else
            make build-frontend
            audit_root="${RUNNER_TEMP}/ksadk-python-public-audit"
            rm -rf "$audit_root"
            python3 scripts/prepare_ksadk_python_export.py \
              --output-dir "$audit_root" \
              --summary
          fi
          python3 scripts/open_source_audit.py \
            --root "$audit_root" \
            --target public-repo
