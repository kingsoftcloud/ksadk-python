# .gitleaks.toml — ksadk-python
# 继承 gitleaks 默认规则 (useDefault = true), 仅追加项目级 allowlist。
# workflow 用法 (见 .github/workflows/secret-patterns.yml):
#   gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
# detect 子命令 + fetch-depth:0 扫全 history; allowlist 同时覆盖历史与当前 tree。

title = "ksadk-python gitleaks config"

[extend]
useDefault = true

# Deterministic EffectRequest.effect_key from generate_teams_extended_fixtures.py.
# This is a SHA-256 operation identity, not an authentication credential. Require
# both the exact fixture path and exact generated value; do not exempt the file.
[[allowlists]]
description = "Deterministic Teams effect identity in contract fixtures"
condition = "AND"
regexTarget = "secret"
regexes = [
    '''^effect_8d165359e4da2f355bb700be8a531b5f4c8d20109cf54056f5d7249f7918a87a$''',
]
paths = [
    '''^tests/contracts/fixtures/teams-cloud-v1\.json$''',
]

# ---- allowlist 统一用 [[allowlists]] 新语法 (gitleaks 8.21+), 不能与 [allowlist] 旧语法混用 ----

# 测试 fixture 假 key (命中当前 tree 与历史 commit)
[[allowlists]]
description = "Allowlist test-fixture placeholders in hermes CLI tests"
regexes = [
    # tests/test_cmd_hermes.py 的假 Bearer token (curl-auth-header 规则命中)
    '''sk-live-secret''',
    # tests/test_cmd_hermes.py 的假 secret value (generic-api-key 兜底)
    '''sk-test-secret''',
]
paths = [
    # 精确限定到测试文件, 避免误 allowlist 其它路径的真 key
    '''tests/test_cmd_hermes\.py''',
    # 公开树新增测试的假 fixture (同一种占位符)
    '''tests/events/''',
    '''tests/kernel/''',
    '''tests/kernel/''',
    '''tests/studio/test_api\.py''',
    '''tests/compat/''',
    '''tests/packaging/''',
]

# Route-manifest fixture checksums are deterministic SHA-256 test data, not
# credentials. The public CI scans every public branch's history, including the
# superseded runtime-foundation candidate where this fixture originated.
[[allowlists]]
description = "Allowlist deterministic route-manifest SHA-256 test fixture"
regexes = [
    '''ac9086d1592d69d7eecd4260c2ca4bfa06b0daaed5cdf0653c4eb409204ed84d''',
]
paths = [
    '''tests/server/test_route_manifest_parity\.py''',
]

