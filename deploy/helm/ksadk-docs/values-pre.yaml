replicaCount: 1

image:
  repository: hub.kce.ksyun.com/bigdata-ai/ksadk-docs
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  className: serverless-network-ingress
  host: agent-api-pre.kspmas-internal.ksyun.com
  path: /ksadk-docs
  officeCidrs: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
  tls:
    enabled: false
    secretName: ""
