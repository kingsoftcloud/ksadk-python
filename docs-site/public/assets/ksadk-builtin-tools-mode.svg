<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" role="img" aria-labelledby="title desc">
  <title id="title">KsADK 内置工具注入模式决策</title>
  <desc id="desc">KSADK_BUILTIN_TOOLS_MODE 与 KSADK_BUILTIN_TOOLS_PROFILE 决定 runtime 注入哪些内置工具:off / dispatcher / focused / deferred / direct,经 _build_tool_registry 解析,runner 自动注入或显式 get_agentengine_tools。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg-light { fill: #0f172a; }
      rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#fbfbf9"] { fill: #0f172a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#eef2ff"] { fill: #1a1f2e; }
      rect[fill="#fef2f2"] { fill: #1f1414; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
      text[fill="#92400e"] { fill: #fbbf24; }
      text[fill="#5b21b6"] { fill: #c4b5fd; }
      text[fill="#7c3aed"] { fill: #a78bfa; }
      text[fill="#047857"] { fill: #34d399; }
      text[fill="#059669"] { fill: #34d399; }
      text[fill="#b91c1c"] { fill: #fca5a5; }
      rect[stroke="#cbd5e1"] { stroke: #475569; }
      rect[stroke="#94a3b8"] { stroke: #64748b; }
    }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="adisp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="askill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="afr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg-light" width="1320" height="880" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="40" y="36" font-size="18" font-weight="700" fill="#0f172a">KsADK · 内置工具注入模式决策</text>
  <text x="40" y="56" font-size="11" fill="#64748b">KSADK_BUILTIN_TOOLS_MODE × KSADK_BUILTIN_TOOLS_PROFILE · runner 自动注入 / 显式 get_agentengine_tools</text>

  <!-- ===== Region: 配置入口 ===== -->
  <rect x="40" y="78" width="1240" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="98" font-size="11.5" font-weight="700" fill="#334155">配置入口 · ksadk/configs/env_registry.py</text>

  <!-- KSADK_BUILTIN_TOOLS_MODE -->
  <g>
    <rect x="80" y="112" width="300" height="58" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="230" y="132" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">KSADK_BUILTIN_TOOLS_MODE</text>
    <text x="230" y="149" font-size="9.5" fill="#64748b" text-anchor="middle">off · dispatcher · focused · deferred · direct</text>
    <text x="230" y="162" font-size="9" fill="#64748b" text-anchor="middle">默认 off（runner 不自动注入）</text>
  </g>

  <!-- KSADK_BUILTIN_TOOLS_PROFILE -->
  <g>
    <rect x="430" y="112" width="300" height="58" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="580" y="132" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">KSADK_BUILTIN_TOOLS_PROFILE</text>
    <text x="580" y="149" font-size="9.5" fill="#64748b" text-anchor="middle">default · coding</text>
    <text x="580" y="162" font-size="9" fill="#64748b" text-anchor="middle">default=全组 · coding=focused 子集</text>
  </g>

  <!-- builtin_tools_mode() / builtin_tools_profile() -->
  <g>
    <rect x="800" y="112" width="290" height="58" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="945" y="132" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">builtin_tools_mode() / _profile()</text>
    <text x="945" y="149" font-size="9.5" fill="#64748b" text-anchor="middle">_normalize_mode() 归一化取值</text>
    <text x="945" y="162" font-size="9" fill="#64748b" text-anchor="middle">none/disabled→off · dispatch→dispatcher · search→deferred</text>
  </g>

  <!-- mode → resolver, profile → resolver -->
  <path d="M 230,170 L 230,195 L 580,195 L 580,210" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#adisp)" stroke-opacity="0.7"/>
  <path d="M 580,170 L 580,210" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.7"/>
  <path d="M 945,170 L 945,195 L 580,195" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-opacity="0.6"/>

  <!-- ===== Region: 模式分发 ===== -->
  <rect x="40" y="200" width="1240" height="156" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="56" y="220" font-size="11.5" font-weight="700" fill="#92400e">模式分发 · _select_agentengine_tools(mode, profile)</text>

  <!-- central resolver -->
  <g>
    <rect x="470" y="232" width="220" height="44" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="580" y="252" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">_select_agentengine_tools</text>
    <text x="580" y="267" font-size="9" fill="#64748b" text-anchor="middle">requested = mode 默认 include</text>
  </g>

  <!-- 5 mode branch boxes -->
  <g>
    <rect x="60" y="300" width="200" height="46" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="160" y="320" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">off</text>
    <text x="160" y="335" font-size="9" fill="#64748b" text-anchor="middle">requested = []</text>
  </g>
  <g>
    <rect x="285" y="300" width="200" height="46" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="385" y="320" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">dispatcher</text>
    <text x="385" y="335" font-size="9" fill="#64748b" text-anchor="middle">requested = [tool_dispatcher]</text>
  </g>
  <g>
    <rect x="510" y="300" width="200" height="46" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="610" y="320" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">focused</text>
    <text x="610" y="335" font-size="9" fill="#64748b" text-anchor="middle">requested = _FOCUSED_TOOL_NAMES</text>
  </g>
  <g>
    <rect x="735" y="300" width="200" height="46" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="835" y="320" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">deferred</text>
    <text x="835" y="335" font-size="9" fill="#64748b" text-anchor="middle">requested = [tool_search, tool_dispatcher]</text>
  </g>
  <g>
    <rect x="960" y="300" width="200" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="1060" y="320" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">direct（默认 mode）</text>
    <text x="1060" y="335" font-size="9" fill="#64748b" text-anchor="middle">requested = _profile_default_include(profile)</text>
  </g>

  <!-- resolver fan-out to 5 modes -->
    <path d="M 580,276 L 580,288 L 160,288 L 160,300" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#ared)" stroke-opacity="0.6"/>
    <path d="M 580,276 L 580,288 L 385,288 L 385,300" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#adisp)" stroke-opacity="0.6"/>
    <path d="M 610,276 L 610,300" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.6"/>
    <path d="M 610,276 L 610,288 L 835,288 L 835,300" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.5"/>
    <path d="M 580,276 L 580,288 L 1060,288 L 1060,300" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-opacity="0.6"/>

  <!-- ===== Region: 注册表构建 ===== -->
  <rect x="40" y="372" width="1240" height="118" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="56" y="392" font-size="11.5" font-weight="700" fill="#7c3aed">注册表构建 · _build_tool_registry / _build_descriptor_registry</text>

  <!-- _build_tool_registry -->
  <g>
    <rect x="80" y="404" width="380" height="74" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="270" y="424" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">_build_tool_registry(include_dispatcher)</text>
    <text x="270" y="441" font-size="9.5" fill="#475569" text-anchor="middle">遍历 _DEFAULT_GROUPS = skill/workspace/platform/sandbox/web</text>
    <text x="270" y="456" font-size="9.5" fill="#475569" text-anchor="middle">+ dispatcher: tool_dispatcher · agentengine_tool_dispatcher(别名)</text>
    <text x="270" y="471" font-size="9.5" fill="#475569" text-anchor="middle">+ tool_search · register_external_tools 注入的外部描述符</text>
  </g>

  <!-- _FOCUSED_TOOL_NAMES / _DEFERRED -->
  <g>
    <rect x="490" y="404" width="320" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="650" y="424" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">_FOCUSED_TOOL_NAMES · _DEFERRED_TOOL_NAMES</text>
    <text x="650" y="442" font-size="9" fill="#64748b" text-anchor="middle">focused = workspace 读写 / search / sandbox_status</text>
    <text x="650" y="456" font-size="9" fill="#64748b" text-anchor="middle">/ run_command / run_code / web_fetch / web_search / tool_search</text>
    <text x="650" y="471" font-size="9" fill="#64748b" text-anchor="middle">deferred = (tool_search, tool_dispatcher)</text>
  </g>

  <!-- _expand_requested_names -->
  <g>
    <rect x="840" y="404" width="320" height="74" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="1000" y="424" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">_expand_requested_names</text>
    <text x="1000" y="442" font-size="9" fill="#64748b" text-anchor="middle">"focused"/"core" → 展开 _FOCUSED_TOOL_NAMES</text>
    <text x="1000" y="456" font-size="9" fill="#64748b" text-anchor="middle">组名 → _TOOLSET_FACTORIES[group]() 全量</text>
    <text x="1000" y="471" font-size="9" fill="#64748b" text-anchor="middle">单工具名 → registry[name] 单选</text>
  </g>

  <!-- mode branches → registry (one consolidated arrow) -->
  <path d="M 1060,346 L 1060,365 L 270,365 L 270,404" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.55"/>
  <text x="660" y="361" font-size="9" fill="#64748b" text-anchor="middle">查注册表展开 requested</text>

  <!-- ===== Region: 注入路径 ===== -->
  <rect x="40" y="506" width="1240" height="276" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="56" y="526" font-size="11.5" font-weight="700" fill="#047857">注入路径 · runner 自动注入 / 显式 API</text>

  <!-- 自动注入: builtin_tools_for_runtime -->
  <g>
    <rect x="70" y="540" width="380" height="92" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="260" y="560" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">runner 自动注入</text>
    <text x="260" y="577" font-size="9.5" fill="#475569" text-anchor="middle">builtin_tools_for_runtime(mode, profile)</text>
    <text x="260" y="592" font-size="9" fill="#64748b" text-anchor="middle">mode=off → 返回 [] · 否则 get_agentengine_tools</text>
    <text x="260" y="607" font-size="9" fill="#64748b" text-anchor="middle">ADKRunner._inject_builtin_tools()</text>
    <text x="260" y="621" font-size="9" fill="#64748b" text-anchor="middle">LangChain/Remote: builtin_tool_descriptors_for_runtime()</text>
  </g>

  <!-- 显式 API: get_agentengine_tools / get_ksadk_builtin_tools -->
  <g>
    <rect x="490" y="540" width="380" height="92" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="680" y="560" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">显式 API</text>
    <text x="680" y="577" font-size="9.5" fill="#475569" text-anchor="middle">get_agentengine_tools(include=..., mode=..., profile=...)</text>
    <text x="680" y="592" font-size="9" fill="#64748b" text-anchor="middle">get_ksadk_builtin_tools(profile) = (profile, mode="direct")</text>
    <text x="680" y="607" font-size="9" fill="#64748b" text-anchor="middle">include=["focused"] / ["focused","execute_skills"]</text>
    <text x="680" y="621" font-size="9" fill="#64748b" text-anchor="middle">describe_agentengine_tools → 仅描述符</text>
  </g>

  <!-- deferred 按需展开 -->
  <g>
    <rect x="900" y="540" width="350" height="92" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="1075" y="560" font-size="11.5" font-weight="600" fill="#7c3aed" text-anchor="middle">deferred 按需展开</text>
    <text x="1075" y="577" font-size="9.5" fill="#475569" text-anchor="middle">inject_deferred_tools_for_request(names)</text>
    <text x="1075" y="592" font-size="9" fill="#64748b" text-anchor="middle">模型先 tool_search(query) 取 deferred_tool_names</text>
    <text x="1075" y="607" font-size="9" fill="#64748b" text-anchor="middle">→ get_agentengine_tools(include=names, mode="direct")</text>
    <text x="1075" y="621" font-size="9" fill="#64748b" text-anchor="middle">把单个工具对象补进 agent,context 不预载全量</text>
  </g>

  <!-- runtime tool agent -->
  <g>
    <rect x="280" y="672" width="760" height="92" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="660" y="692" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">runtime 内 agent 可见工具</text>
    <text x="660" y="710" font-size="9.5" fill="#475569" text-anchor="middle">off=空 · dispatcher=[tool_dispatcher, tool_search(隐式)] · focused=13 个 focused 工具</text>
    <text x="660" y="725" font-size="9.5" fill="#475569" text-anchor="middle">deferred=[tool_search, tool_dispatcher] → 模型搜索后按需补单个 · direct=profile 全组</text>
    <text x="660" y="740" font-size="9" fill="#64748b" text-anchor="middle">所有 call 经 ToolGateway.invoke · 继承目标工具 ToolPolicy · strict 模式 approval_required</text>
    <text x="660" y="755" font-size="9" fill="#64748b" text-anchor="middle">boundary: local_ksadk_builtin_tools · local_ksadk_builtin_tool_registry · isolated_sandbox · workspace_root</text>
  </g>

  <!-- arrows from inject paths down to agent -->
  <path d="M 260,632 L 260,660 L 460,660 L 460,672" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-opacity="0.7"/>
  <path d="M 680,632 L 680,660 L 660,660 L 660,672" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-opacity="0.7"/>
  <path d="M 1075,632 L 1075,660 L 860,660 L 860,672" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.7"/>

  <!-- registry → inject paths -->
  <path d="M 270,478 L 270,500 L 260,500 L 260,540" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.5"/>
  <path d="M 460,478 L 460,500 L 680,500 L 680,540" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.5"/>
  <path d="M 1000,478 L 1000,500 L 1075,500 L 1075,540" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.5"/>

  <!-- ===== 图例 ===== -->
  <g>
    <rect x="40" y="800" width="1240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="56" y="820" font-size="10.5" font-weight="700" fill="#334155">图例</text>

    <rect x="56" y="830" width="14" height="14" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="76" y="841" font-size="9.5" fill="#475569">off / alert(不注入)</text>

    <rect x="200" y="830" width="14" height="14" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="220" y="841" font-size="9.5" fill="#475569">dispatcher / dispatcher 工具</text>

    <rect x="380" y="830" width="14" height="14" rx="3" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="400" y="841" font-size="9.5" fill="#475569">focused / deferred / 注册表</text>

    <rect x="560" y="830" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="580" y="841" font-size="9.5" fill="#475569">direct / runner 注入</text>

    <rect x="730" y="830" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="750" y="841" font-size="9.5" fill="#475569">runtime agent(框架层)</text>

    <line x1="900" y1="837" x2="930" y2="837" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)"/>
    <text x="936" y="841" font-size="9.5" fill="#475569">查注册表展开</text>

    <line x1="1050" y1="837" x2="1080" y2="837" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
    <text x="1086" y="841" font-size="9.5" fill="#475569">注入工具对象</text>
  </g>

  <text x="1280" y="868" font-size="8.5" fill="#94a3b8" text-anchor="end">基于 ksadk/toolsets/__init__.py · ksadk/configs/env_registry.py · ksadk/runners/{adk,langchain,remote}_runner.py</text>
</svg>
