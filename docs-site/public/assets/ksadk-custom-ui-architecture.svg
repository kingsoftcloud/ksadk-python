<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" role="img" aria-labelledby="t d">
  <title id="t">KsADK 自定义 UI Agent 托管架构</title>
  <desc id="d">业务自带前端 bundle,经 FastAPI 解析 custom UI spec,按 bundle 路径静态路由;GetAgentUiBootstrap 透传 CustomUI 给 hosted/local 共用。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      rect[fill="#fbfbf9"], rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#eff6ff"] { fill: #1a1f2e; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#f5f3ff"] { fill: #1f1a2e; }
      rect[fill="#fef3c7"] { fill: #1e1b14; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#059669"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#d97706"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect class="bg" width="1480" height="760" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">KsADK — 自定义 UI Agent 托管</text>
  <text x="40" y="60" font-size="12" fill="#64748b">业务自带前端 · runtime 暴露 bootstrap · hosted / local 共用</text>

  <!-- ===== Layer 1: 业务 Agent ===== -->
  <rect x="40" y="85" width="1400" height="100" rx="12" fill="#eff6ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="108" font-size="13" font-weight="700" fill="#4338ca">业务 Agent（用户自带）</text>

  <rect x="90" y="120" width="380" height="55" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="280" y="143" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Agent 代码 · runner</text>
  <text x="280" y="161" font-size="10" fill="#64748b" text-anchor="middle">agent.py · prompt · domain tools · workflow</text>

  <rect x="1010" y="120" width="400" height="55" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1210" y="143" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">research-ui/ · 自定义前端 bundle</text>
  <text x="1210" y="161" font-size="10" fill="#64748b" text-anchor="middle">Next.js / Vite 静态导出 dist/index.html</text>

  <!-- Agent 代码 → Runner -->
  <path d="M 280,175 L 280,205 L 430,205 L 430,235" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ar)" stroke-opacity="0.6"/>

  <!-- ===== Layer 2: KsADK Runtime 数据面 ===== -->
  <rect x="40" y="200" width="1400" height="340" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="56" y="223" font-size="14" font-weight="700" fill="#047857">KsADK Runtime · 数据面</text>
  <text x="240" y="223" font-size="11" fill="#64748b">FastAPI · UI spec 解析 · 静态路由 · bootstrap 透传</text>

  <!-- Runner -->
  <rect x="310" y="240" width="240" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="430" y="266" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Runner 编排</text>
  <text x="430" y="284" font-size="10" fill="#475569" text-anchor="middle">BaseRunner · 框架适配</text>
  <text x="430" y="304" font-size="9" fill="#047857" text-anchor="middle">invoke · stream</text>
  <text x="430" y="318" font-size="9" fill="#64748b" text-anchor="middle">get_runtime_capabilities</text>

  <!-- FastAPI app -->
  <rect x="590" y="240" width="320" height="170" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="750" y="266" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">ksadk.server.app · FastAPI</text>
  <line x1="610" y1="276" x2="890" y2="276" stroke="#059669" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="610" y="286" width="260" height="28" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="740" y="304" font-size="10" fill="#047857" text-anchor="middle">_resolve_agent_ui_spec() · custom / builtin</text>
  <rect x="610" y="320" width="260" height="28" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="740" y="338" font-size="10" fill="#047857" text-anchor="middle">catch-all /{path} → StaticFiles 路由</text>
  <rect x="610" y="354" width="260" height="28" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="740" y="372" font-size="10" fill="#047857" text-anchor="middle">GetAgentUiBootstrap → CustomUI</text>
  <text x="750" y="400" font-size="9" fill="#64748b" text-anchor="middle">/v1/responses · /agentengine/api/v1/* · WS</text>

  <!-- Runner ↔ FastAPI -->
  <path d="M 550,285 L 590,285" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>

  <!-- GetAgentUiBootstrap 卡片 -->
  <rect x="950" y="240" width="460" height="170" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="1180" y="266" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">GetAgentUiBootstrap action</text>
  <line x1="970" y1="276" x2="1390" y2="276" stroke="#d97706" stroke-width="0.6" stroke-opacity="0.4"/>
  <rect x="970" y="286" width="420" height="32" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="1180" y="306" font-size="10" fill="#92400e" text-anchor="middle">CustomUI: Enabled · Profile · Path · Url · BundlePath</text>
  <rect x="970" y="324" width="200" height="32" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="1070" y="344" font-size="10" fill="#92400e" text-anchor="middle">RuntimeCapabilities</text>
  <rect x="1190" y="324" width="200" height="32" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="1290" y="344" font-size="10" fill="#92400e" text-anchor="middle">CheckpointResumeCapability</text>
  <text x="1180" y="378" font-size="9" fill="#64748b" text-anchor="middle">SharePermissions · AccessMode · ApiFormats · Stream</text>
  <text x="1180" y="394" font-size="9" fill="#64748b" text-anchor="middle">hosted 与 local 走同一 bootstrap</text>

  <!-- FastAPI → Bootstrap -->
  <path d="M 910,325 L 950,325" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar-o)"/>

  <!-- custom bundle 解析路径 -->
  <rect x="950" y="430" width="460" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="1180" y="452" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">custom bundle 静态路由 · _resolve_ui_static_response()</text>
  <text x="1180" y="468" font-size="9" fill="#64748b" text-anchor="middle">index.html → SPA fallback · assets/* → FileResponse · /chat 自动修正为 /</text>

  <!-- ui_bundle_path 解析 -->
  <path d="M 1210,175 L 1210,200 L 1180,200 L 1180,430" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#ar-o)" stroke-opacity="0.6" stroke-dasharray="4,3"/>
  <text x="1190" y="200" font-size="9" fill="#d97706">ui_bundle_path</text>

  <!-- ui config sources -->
  <rect x="90" y="430" width="440" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="310" y="452" font-size="11" font-weight="600" fill="#5b21b6" text-anchor="middle">UI 配置优先级 · resolve_ui_config()</text>
  <text x="310" y="468" font-size="9" fill="#64748b" text-anchor="middle">agentengine.yaml → .agentengine/state → KSADK_UI_* env → research-ui/dist 自动探测</text>

  <path d="M 530,455 L 590,330" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.5" stroke-dasharray="4,3"/>

  <!-- ===== Layer 3: 前端消费 ===== -->
  <rect x="40" y="560" width="1400" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="583" font-size="13" font-weight="700" fill="#92400e">前端消费</text>
  <text x="160" y="583" font-size="11" fill="#64748b">读 CustomUI · 加载静态资源 · 调 runtime API</text>

  <rect x="90" y="595" width="320" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="250" y="615" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">本地 Web UI</text>
  <text x="250" y="632" font-size="9" fill="#64748b" text-anchor="middle">agentengine web 自动探测</text>

  <rect x="460" y="595" width="320" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="620" y="615" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Hosted UI</text>
  <text x="620" y="632" font-size="9" fill="#64748b" text-anchor="middle">同一 bootstrap · 同一 API 契约</text>

  <rect x="830" y="595" width="320" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="990" y="615" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">自定义业务前端</text>
  <text x="990" y="632" font-size="9" fill="#64748b" text-anchor="middle">按 BundlePath 加载 · 接 runtime API</text>

  <!-- runtime → 前端 -->
  <path d="M 750,410 L 750,520 L 250,520 L 250,595" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#ar-o)" stroke-opacity="0.5"/>
  <path d="M 1180,480 L 1180,520 L 990,520 L 990,595" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#ar-o)" stroke-opacity="0.5"/>

  <!-- 图例 -->
  <g transform="translate(40, 700)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="10" width="14" height="14" rx="2" fill="#eff6ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="21" font-size="10" fill="#475569">业务 Agent / 自定义 bundle</text>
    <rect x="180" y="10" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="200" y="21" font-size="10" fill="#475569">KsADK Runtime 数据面</text>
    <rect x="380" y="10" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="400" y="21" font-size="10" fill="#475569">bootstrap / 前端消费</text>
    <rect x="560" y="10" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="580" y="21" font-size="10" fill="#475569">UI 配置来源</text>
    <text x="0" y="44" font-size="10" fill="#64748b">边界：Agent 代码写「做什么」+ 前端写「业务 UI」；KsADK 负责「UI 怎么挂载、怎么路由、怎么透传 bootstrap」</text>
  </g>
</svg>
