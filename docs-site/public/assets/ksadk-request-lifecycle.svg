<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 620" role="img" aria-labelledby="t d">
  <title id="t">KsADK 请求生命周期</title>
  <desc id="d">从入口到对话运行时、Runner、Session 持久化与 Run 能力层的完整链路。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      rect[fill="#fbfbf9"], rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#eff6ff"] { fill: #1a1f2e; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#f5f3ff"] { fill: #1f1a2e; }
      rect[fill="#fee2e2"] { fill: #2a1414; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg" width="1640" height="620" fill="#fbfbf9"/>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">KsADK 请求生命周期</text>
  <text x="30" y="54" font-size="11" fill="#64748b">入口 → 启动 → HTTP/UI → 对话运行时 → Runner → Session 持久化 → Run 能力层</text>

  <!-- 统一网格: 所有 region 顶 y=80, 高度对齐到行. 卡片在 region 内 padding 20.
       region 高度: ① 140 (2 卡), ② 220 (3 卡), ③ 220 (2 卡), ④ 320 (4 卡+retry), ⑤ 140 (1 卡), ⑥ 140 (1 卡), ⑦ 360 (5 卡)
       主流程 region (①-⑤) 顶对齐 y=80; ⑥ Session 在 ⑤ 下方 y=240..380; ⑦ 在最右 y=80..440 -->

  <!-- ===== ① 入口  x=30..190 (w=160), y=80..220 (h=140) ===== -->
  <rect x="30" y="80" width="160" height="140" rx="10" fill="#eff6ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#4338ca">① 入口</text>
  <rect x="50" y="115" width="120" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="110" y="145" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">agentengine</text>
  <text x="110" y="163" font-size="10" fill="#64748b" text-anchor="middle">run · web</text>
  <text x="110" y="180" font-size="9" fill="#64748b" text-anchor="middle">CLI · 本地 UI</text>

  <!-- ===== ② 启动  x=210..410 (w=200), y=80..340 (h=260) ===== -->
  <!-- region ② h=260: 3 卡片 h=55 gap=30 (20+55+30+55+30+55+15=260) ✓ -->
  <rect x="210" y="80" width="200" height="260" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="226" y="100" font-size="11" font-weight="700" fill="#047857">② 启动</text>
  <rect x="225" y="110" width="170" height="55" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="134" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">framework detection</text>
  <text x="310" y="150" font-size="9" fill="#64748b" text-anchor="middle">FrameworkDetector</text>
  <rect x="225" y="195" width="170" height="55" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="219" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">create_runner</text>
  <text x="310" y="235" font-size="9" fill="#64748b" text-anchor="middle">Runner Factory</text>
  <rect x="225" y="280" width="170" height="55" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="304" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">runner.load_agent</text>
  <text x="310" y="320" font-size="9" fill="#64748b" text-anchor="middle">用户代码加载</text>

  <!-- ===== ③ HTTP/UI  x=430..630 (w=200), y=80..340 (h=260) 对齐 ② ===== -->
  <rect x="430" y="80" width="200" height="260" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="446" y="100" font-size="11" font-weight="700" fill="#047857">③ HTTP / UI</text>
  <rect x="445" y="110" width="170" height="55" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="530" y="134" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">FastAPI app</text>
  <text x="530" y="150" font-size="9" fill="#64748b" text-anchor="middle">ksadk.server.app</text>
  <rect x="445" y="195" width="170" height="140" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="530" y="220" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">路由协议</text>
  <text x="530" y="240" font-size="9" fill="#047857" text-anchor="middle">/v1/responses</text>
  <text x="530" y="256" font-size="9" fill="#047857" text-anchor="middle">/v1/chat/completions</text>
  <text x="530" y="272" font-size="9" fill="#047857" text-anchor="middle">/run_sse</text>
  <text x="530" y="288" font-size="9" fill="#047857" text-anchor="middle">RunAgent</text>

  <!-- ===== ④ 对话运行时 (核心)  x=650..950 (w=300), y=80..440 (h=360) ===== -->
  <rect x="650" y="80" width="300" height="360" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="666" y="100" font-size="12" font-weight="700" fill="#047857">④ Conversations Runtime · 核心</text>
  <!-- 3 行卡片 (h=55, gap=30) + 底部 retry 两卡 (h=55). 内容区 y=110..430.
       row1 y=110..165, row2 y=195..250, row3 y=280..335, row4 y=375..430? gap 40.
       row3 y=280..335, row4 gap 30 → y=365..420. region 底 440, pad 20 → 内容到 420 ✓ -->
  <rect x="665" y="110" width="270" height="55" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="132" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">build_run_input</text>
  <text x="800" y="148" font-size="9" fill="#64748b" text-anchor="middle">history + attachments</text>
  <rect x="665" y="195" width="270" height="55" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="217" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">PlatformInvocationContext</text>
  <text x="800" y="233" font-size="9" fill="#64748b" text-anchor="middle">invocation_id · account_id</text>
  <rect x="665" y="280" width="270" height="55" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="800" y="302" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">append run_status</text>
  <text x="800" y="318" font-size="9" fill="#64748b" text-anchor="middle">in_progress / completed / failed</text>
  <!-- row4 两卡: run_checkpoint + retry, 等宽 130, gap 10? < 30. 用 gap 10 接受(同 region 内子卡).
       改: region 内左右两卡 130+130 + gap 10 = 270 ✓ 居中 x=665..935 -->
  <rect x="665" y="365" width="130" height="55" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="730" y="387" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">run_checkpoint</text>
  <text x="730" y="403" font-size="9" fill="#64748b" text-anchor="middle">run_resume</text>
  <rect x="805" y="365" width="130" height="55" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="870" y="387" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">retry</text>
  <text x="870" y="403" font-size="9" fill="#64748b" text-anchor="middle">fallback / PTL</text>

  <!-- ===== ⑤ Runner  x=970..1170 (w=200), y=80..220 (h=140) ===== -->
  <rect x="970" y="80" width="200" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="986" y="100" font-size="11" font-weight="700" fill="#047857">⑤ Runner</text>
  <rect x="985" y="115" width="170" height="90" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1070" y="145" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">BaseRunner</text>
  <text x="1070" y="163" font-size="10" fill="#64748b" text-anchor="middle">invoke / stream</text>
  <text x="1070" y="180" font-size="9" fill="#64748b" text-anchor="middle">ADK · LangGraph</text>
  <text x="1070" y="194" font-size="9" fill="#64748b" text-anchor="middle">LangChain · DeepAgents</text>

  <!-- ===== ⑥ Session  x=970..1170 (w=200), y=240..440 (h=200, 对齐到 ④ 底) ===== -->
  <rect x="970" y="240" width="200" height="200" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="986" y="260" font-size="11" font-weight="700" fill="#5b21b6">⑥ Session</text>
  <rect x="985" y="275" width="170" height="145" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1070" y="320" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">session + events</text>
  <text x="1070" y="345" font-size="9" fill="#64748b" text-anchor="middle">持久化</text>
  <text x="1070" y="365" font-size="9" fill="#64748b" text-anchor="middle">transcript</text>
  <text x="1070" y="385" font-size="9" fill="#64748b" text-anchor="middle">checkpoint</text>

  <!-- ===== ⑦ Run 能力层  x=1190..1610 (w=420), y=80..440 (h=360, 对齐 ④) ===== -->
  <rect x="1190" y="80" width="420" height="360" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="1206" y="100" font-size="12" font-weight="700" fill="#92400e">⑦ Run 能力层 · 0.6.7</text>
  <!-- 5 卡片 h=48, gap=30: 20+5*48+4*30+? = 20+240+120=380. region 内容 360-20(top)-20(bot)=320. 5*48+4*30=360 超.
       改 h=44, gap=20: 5*44+4*20=220+80=300 < 320 ✓ y=110,174,238,302,366 -->
  <rect x="1205" y="110" width="390" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1400" y="128" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ResumeRun</text>
  <text x="1400" y="143" font-size="9" fill="#64748b" text-anchor="middle">find checkpoint · resume_input</text>
  <rect x="1205" y="174" width="390" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1400" y="192" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">GetCheckpointResumePreview</text>
  <text x="1400" y="207" font-size="9" fill="#64748b" text-anchor="middle">risk + receipts</text>
  <rect x="1205" y="238" width="390" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1400" y="256" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ListSessionCheckpoints</text>
  <text x="1400" y="271" font-size="9" fill="#64748b" text-anchor="middle">分页 + 审计字段</text>
  <rect x="1205" y="302" width="390" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="1400" y="320" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">CancelRun</text>
  <text x="1400" y="335" font-size="9" fill="#64748b" text-anchor="middle">cooperative · next chunk/tool boundary</text>
  <rect x="1205" y="366" width="390" height="44" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1400" y="384" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">SubscribeRunEvents</text>
  <text x="1400" y="399" font-size="9" fill="#64748b" text-anchor="middle">AfterSeqId · 5min 重连窗口</text>

  <!-- ===== 主链路连线 (全部正交折线, 走 region 间空隙, 不穿卡片) ===== -->
  <!-- ① → ② detect: ①右(190,150) → ②左(210,138) -->
  <path d="M 190,150 L 210,138" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="195" y="132" font-size="9" fill="#475569">detect</text>
  <!-- ② 内部 vertical: framework(310,165)→create_runner(310,195) -->
  <path d="M 310,165 L 310,195" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M 310,250 L 310,280" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <!-- ② → ③ load_agent→FastAPI: (395,310)→(445,138) 走 region 间空隙. 折线: 右到 x=420, 上到 y=138, 右到 445 -->
  <path d="M 395,310 L 420,310 L 420,138 L 445,138" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="402" y="220" font-size="9" fill="#059669">server mode</text>
  <!-- ③ → ④ route: ③右(615,138)→④左(665,138) -->
  <path d="M 615,138 L 665,138" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="625" y="132" font-size="9" fill="#475569">route</text>
  <!-- ④ → ⑤ invoke: ④右(935,165)→⑤左(970,160) -->
  <path d="M 935,165 L 970,160" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="942" y="153" font-size="9" fill="#059669">invoke</text>
  <!-- ⑤ → ④ output+meta (回连): ⑤左底(985,205)→④右(935,220) 折线避免穿卡 -->
  <path d="M 985,200 L 960,200 L 960,220 L 935,220" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="940" y="195" font-size="9" fill="#059669">output+meta</text>
  <!-- ④ → ⑥ persist: ④右(935,300)→⑥左(970,300) -->
  <path d="M 935,300 L 970,300" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar-p)"/>
  <text x="940" y="295" font-size="9" fill="#7c3aed">persist</text>

  <!-- retry 虚线回 Runner: ④内 retry 卡(870,420)→⑤Runner底(1070,205)
       走 ④ 右侧外空隙 x=960..970: 下到 y=460, 右到 x=960? 在 ④/⑤ 间. 用 x=955:
       (870,420)→(870,460)→(955,460)→(955,205)→(985,205) 进入 ⑤ 底 -->
  <path d="M 870,420 L 870,460 L 955,460 L 955,205 L 985,205" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-r)"/>
  <text x="900" y="455" font-size="9" fill="#b91c1c">recoverable</text>

  <!-- 能力层 → Session read events: ⑦左(1190,300)→⑥右(1170,300) -->
  <path d="M 1190,300 L 1170,300" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.5"/>
  <text x="1175" y="294" font-size="8" fill="#7c3aed">read events</text>

  <!-- ResumeRun → build_run_input (resume_input 虚线): ⑦左(1190,132)→④右(935,132)
       走 ⑥ 上方空隙 y=110 之上 (region ⑥ 顶=240, ⑤ 底=220, 空隙 220..240)
       ⑦ResumeRun(1205,132)→左到 x=960 (⑤/⑥ 间)→上到 y=110 (④顶上方 region 外? ④顶=80)
       改走 ④ 与 ⑤ 之间空隙 x=950..970: (1190,132)→(960,132)→(960,110)? ④ 卡顶 110. 穿卡.
       改: 走 ④ 顶部 y=70 (region 之上): (1205,132)→(1190,132)→(1190,70)→(800,70)→(800,110)?
       但 ④ 标题区 y=80..100. 入 build_run_input 卡顶 y=110. -->
  <path d="M 1205,132 L 1180,132 L 1180,68 L 800,68 L 800,110" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar-o)" stroke-opacity="0.5"/>
  <text x="990" y="62" font-size="9" fill="#d97706">resume_input</text>

  <!-- CancelRun → Runner cooperate: ⑦CancelRun(1205,324)→⑤Runner(1170,160)
       走 ⑥ 上方空隙 y=220..240: (1205,324)→(1180,324)→(1180,230)→(1170,160)?
       ⑥ region 顶=240. y=230 在 ⑤(80..220) 与 ⑥(240..) 之间空隙 220..240 ✓
       (1205,324)→(1180,324)→(1180,230)→(1170,205) 入 ⑤ 底 -->
  <path d="M 1205,324 L 1180,324 L 1180,230 L 1170,205" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar-r)" stroke-opacity="0.5"/>
  <text x="1183" y="248" font-size="9" fill="#b91c1c">cooperate</text>

  <!-- 图例 -->
  <g transform="translate(30, 490)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="10" width="14" height="14" rx="2" fill="#eff6ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="21" font-size="10" fill="#475569">入口 / 框架</text>
    <rect x="120" y="10" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="21" font-size="10" fill="#475569">运行时 / Runner</text>
    <rect x="270" y="10" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="290" y="21" font-size="10" fill="#475569">Session 持久化</text>
    <rect x="430" y="10" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="450" y="21" font-size="10" fill="#475569">Run 能力层</text>
    <rect x="570" y="10" width="14" height="14" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="590" y="21" font-size="10" fill="#475569">retry / cancel</text>
    <line x1="710" y1="17" x2="740" y2="17" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="748" y="21" font-size="10" fill="#475569">虚线 = 异步 / 回退</text>
    <text x="0" y="48" font-size="10" fill="#64748b">基于 ksadk/server/app.py + conversations/runtime.py 真实代码路径</text>
    <text x="0" y="68" font-size="10" fill="#64748b">可恢复错误时回退重试</text>
  </g>
</svg>
