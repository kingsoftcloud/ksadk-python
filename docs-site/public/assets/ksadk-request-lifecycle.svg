<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 560" role="img" aria-labelledby="t d">
  <title id="t">KsADK 请求生命周期</title>
  <desc id="d">从入口到对话运行时、Runner、Session 持久化与 Run 能力层的完整链路。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      rect[fill="#fbfbf9"], rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#eff6ff"] { fill: #1a1f2e; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#f5f3ff"] { fill: #1f1a2e; }
      rect[fill="#fee2e2"] { fill: #2a1414; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#475569"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#059669"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#d97706"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg" width="1620" height="560" fill="#fbfbf9"/>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#0f172a">KsADK 请求生命周期</text>
  <text x="30" y="54" font-size="11" fill="#64748b">入口 → 启动 → HTTP/UI → 对话运行时 → Runner → Session 持久化 → Run 能力层</text>

  <!-- ===== ① 入口 ===== -->
  <rect x="30" y="80" width="160" height="140" rx="10" fill="#eff6ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="46" y="100" font-size="11" font-weight="700" fill="#4338ca">① 入口</text>
  <rect x="50" y="115" width="120" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="110" y="145" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">agentengine</text>
  <text x="110" y="163" font-size="10" fill="#64748b" text-anchor="middle">run · web</text>
  <text x="110" y="180" font-size="9" fill="#64748b" text-anchor="middle">CLI · 本地 UI</text>

  <!-- ===== ② 启动 ===== -->
  <rect x="210" y="80" width="200" height="220" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="226" y="100" font-size="11" font-weight="700" fill="#047857">② 启动</text>
  <rect x="225" y="115" width="170" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">framework detection</text>
  <text x="310" y="153" font-size="9" fill="#64748b" text-anchor="middle">FrameworkDetector</text>
  <rect x="225" y="180" width="170" height="45" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="200" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">create_runner</text>
  <text x="310" y="215" font-size="9" fill="#64748b" text-anchor="middle">Runner Factory</text>
  <rect x="225" y="240" width="170" height="45" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="310" y="260" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">runner.load_agent</text>
  <text x="310" y="275" font-size="9" fill="#64748b" text-anchor="middle">用户代码加载</text>

  <!-- ===== ③ HTTP/UI ===== -->
  <rect x="430" y="80" width="220" height="220" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="446" y="100" font-size="11" font-weight="700" fill="#047857">③ HTTP / UI</text>
  <rect x="445" y="115" width="190" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="540" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">FastAPI app</text>
  <text x="540" y="153" font-size="9" fill="#64748b" text-anchor="middle">ksadk.server.app</text>
  <rect x="445" y="180" width="190" height="105" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="540" y="202" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">路由协议</text>
  <text x="540" y="220" font-size="9" fill="#047857" text-anchor="middle">/v1/responses</text>
  <text x="540" y="236" font-size="9" fill="#047857" text-anchor="middle">/v1/chat/completions</text>
  <text x="540" y="252" font-size="9" fill="#047857" text-anchor="middle">/run_sse</text>
  <text x="540" y="268" font-size="9" fill="#047857" text-anchor="middle">RunAgent</text>

  <!-- ===== ④ 对话运行时 (核心) ===== -->
  <rect x="670" y="80" width="300" height="320" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="686" y="100" font-size="12" font-weight="700" fill="#047857">④ Conversations Runtime · 核心</text>
  <rect x="685" y="115" width="270" height="45" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="820" y="135" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">build_run_input</text>
  <text x="820" y="150" font-size="9" fill="#64748b" text-anchor="middle">history + attachments</text>
  <rect x="685" y="170" width="270" height="45" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="820" y="190" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">PlatformInvocationContext</text>
  <text x="820" y="205" font-size="9" fill="#64748b" text-anchor="middle">invocation_id · account_id</text>
  <rect x="685" y="225" width="270" height="45" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="820" y="245" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">append run_status</text>
  <text x="820" y="260" font-size="9" fill="#64748b" text-anchor="middle">in_progress / completed / failed</text>
  <rect x="685" y="280" width="130" height="45" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="750" y="300" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">run_checkpoint</text>
  <text x="750" y="315" font-size="9" fill="#64748b" text-anchor="middle">run_resume</text>
  <rect x="825" y="280" width="130" height="45" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="890" y="300" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">retry</text>
  <text x="890" y="315" font-size="9" fill="#64748b" text-anchor="middle">fallback / PTL</text>
  <text x="820" y="355" font-size="9" fill="#b91c1c" text-anchor="middle">可恢复错误时回退重试</text>

  <!-- ===== ⑤ Runner ===== -->
  <rect x="990" y="80" width="180" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1006" y="100" font-size="11" font-weight="700" fill="#047857">⑤ Runner</text>
  <rect x="1005" y="115" width="150" height="90" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1080" y="145" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">BaseRunner</text>
  <text x="1080" y="163" font-size="10" fill="#64748b" text-anchor="middle">invoke / stream</text>
  <text x="1080" y="180" font-size="9" fill="#64748b" text-anchor="middle">ADK · LangGraph</text>
  <text x="1080" y="194" font-size="9" fill="#64748b" text-anchor="middle">LangChain · DeepAgents</text>

  <!-- ===== ⑥ Session ===== -->
  <rect x="990" y="240" width="180" height="140" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1006" y="260" font-size="11" font-weight="700" fill="#5b21b6">⑥ Session</text>
  <rect x="1005" y="275" width="150" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1080" y="305" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">session + events</text>
  <text x="1080" y="323" font-size="9" fill="#64748b" text-anchor="middle">持久化</text>
  <text x="1080" y="340" font-size="9" fill="#64748b" text-anchor="middle">transcript · checkpoint</text>

  <!-- ===== ⑦ Run 能力层 ===== -->
  <rect x="1190" y="80" width="400" height="360" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="1206" y="100" font-size="12" font-weight="700" fill="#92400e">⑦ Run 能力层 · 0.6.7</text>
  <rect x="1205" y="115" width="370" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1390" y="134" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ResumeRun</text>
  <text x="1390" y="149" font-size="9" fill="#64748b" text-anchor="middle">find checkpoint · resume_input</text>
  <rect x="1205" y="167" width="370" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1390" y="186" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">GetCheckpointResumePreview</text>
  <text x="1390" y="201" font-size="9" fill="#64748b" text-anchor="middle">risk + receipts</text>
  <rect x="1205" y="219" width="370" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1390" y="238" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ListSessionCheckpoints</text>
  <text x="1390" y="253" font-size="9" fill="#64748b" text-anchor="middle">分页 + 审计字段</text>
  <rect x="1205" y="271" width="370" height="42" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="1390" y="290" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">CancelRun</text>
  <text x="1390" y="305" font-size="9" fill="#64748b" text-anchor="middle">cooperative · next chunk/tool boundary</text>
  <rect x="1205" y="323" width="370" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1390" y="342" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">SubscribeRunEvents</text>
  <text x="1390" y="357" font-size="9" fill="#64748b" text-anchor="middle">AfterSeqId · 5min 重连窗口</text>

  <!-- ===== 主链路连线 ===== -->
  <path d="M 190,150 L 225,140" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="195" y="135" font-size="9" fill="#475569">detect</text>
  <path d="M 310,165 L 310,180" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M 310,225 L 310,240" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M 395,262 L 445,140" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="405" y="200" font-size="9" fill="#059669">server mode</text>
  <path d="M 635,140 L 685,138" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="645" y="132" font-size="9" fill="#475569">route</text>
  <path d="M 955,160 L 1005,160" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="965" y="152" font-size="9" fill="#059669">invoke</text>
  <path d="M 1005,175 L 955,248" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="960" y="220" font-size="9" fill="#059669">output+meta</text>
  <path d="M 955,270 L 1005,300" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar-p)"/>
  <text x="960" y="295" font-size="9" fill="#7c3aed">persist</text>

  <!-- retry 虚线回 Runner -->
  <path d="M 955,302 L 1080,205" fill="none" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-r)"/>
  <text x="990" y="260" font-size="9" fill="#b91c1c">recoverable</text>

  <!-- 能力层 → Session -->
  <path d="M 1205,300 L 1155,300" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.5"/>
  <text x="1158" y="295" font-size="8" fill="#7c3aed">read events</text>
  <path d="M 1205,136 L 1155,290" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.3"/>

  <!-- ResumeRun → build_run_input (resume_input 虚线) -->
  <path d="M 1205,136 L 955,138" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar-o)" stroke-opacity="0.5"/>
  <text x="990" y="120" font-size="9" fill="#d97706">resume_input</text>

  <!-- CancelRun → Runner -->
  <path d="M 1205,292 L 1155,160" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ar-r)" stroke-opacity="0.5"/>
  <text x="1158" y="225" font-size="9" fill="#b91c1c">cooperate</text>

  <!-- 图例 -->
  <g transform="translate(30, 470)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="10" width="14" height="14" rx="2" fill="#eff6ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="21" font-size="10" fill="#475569">入口 / 框架</text>
    <rect x="120" y="10" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="140" y="21" font-size="10" fill="#475569">运行时 / Runner</text>
    <rect x="270" y="10" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="290" y="21" font-size="10" fill="#475569">Session 持久化</text>
    <rect x="430" y="10" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="450" y="21" font-size="10" fill="#475569">Run 能力层</text>
    <rect x="570" y="10" width="14" height="14" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="590" y="21" font-size="10" fill="#475569">retry / cancel</text>
    <line x1="710" y1="17" x2="740" y2="17" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="748" y="21" font-size="10" fill="#475569">虚线 = 异步 / 回退</text>
    <text x="0" y="48" font-size="10" fill="#64748b">基于 ksadk/server/app.py + conversations/runtime.py 真实代码路径</text>
  </g>
</svg>
