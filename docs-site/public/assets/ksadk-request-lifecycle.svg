<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 760" role="img" aria-labelledby="t d">
  <title id="t">KsADK 请求生命周期</title>
  <desc id="d">从 agentengine 入口到对话运行时、Runner、session 持久化与 0.6.7 run 能力层的完整链路。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg-light { fill: #0f172a; }
      rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#fbfbf9"] { fill: #0f172a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#eef2ff"] { fill: #1a1f2e; }
      rect[fill="#fef2f2"] { fill: #1f1414; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
      text[fill="#92400e"] { fill: #fbbf24; }
      text[fill="#5b21b6"] { fill: #c4b5fd; }
      text[fill="#7c3aed"] { fill: #a78bfa; }
      text[fill="#047857"] { fill: #34d399; }
      text[fill="#059669"] { fill: #34d399; }
      text[fill="#b91c1c"] { fill: #fca5a5; }
      rect[stroke="#cbd5e1"] { stroke: #475569; }
      rect[stroke="#94a3b8"] { stroke: #64748b; }
    }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#475569"/></marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#059669"/></marker>
    <marker id="askill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#7c3aed"/></marker>
    <marker id="adisp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#d97706"/></marker>
    <marker id="aalert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg-light" width="1620" height="760" fill="#fbfbf9"/>

  <text x="30" y="34" font-size="16" font-weight="700" fill="#0f172a">KsADK 请求生命周期</text>
  <text x="30" y="52" font-size="10" fill="#64748b">入口 → 启动 → HTTP/UI → 对话运行时 → Runner → Session 持久化 → Run 能力层</text>

  <!-- Region: Entry -->
  <rect x="30" y="80" width="180" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="98" font-size="9.5" font-weight="600" fill="#334155">入口 Entry</text>
  <g>
    <rect x="50" y="115" width="140" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="120" y="142" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">agentengine</text>
    <text x="120" y="158" font-size="9" fill="#475569" text-anchor="middle">run / web</text>
    <text x="120" y="172" font-size="8.5" fill="#64748b" text-anchor="middle">CLI · 本地 UI</text>
  </g>

  <!-- Region: Boot -->
  <rect x="240" y="80" width="200" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="252" y="98" font-size="9.5" font-weight="600" fill="#334155">启动 Boot</text>
  <g>
    <rect x="260" y="115" width="160" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="340" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">framework detection</text>
    <text x="340" y="153" font-size="8.5" fill="#475569" text-anchor="middle">FrameworkDetector</text>
  </g>
  <g>
    <rect x="260" y="180" width="160" height="45" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="340" y="200" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">create_runner</text>
    <text x="340" y="215" font-size="8.5" fill="#475569" text-anchor="middle">Runner Factory</text>
  </g>
  <g>
    <rect x="260" y="240" width="160" height="45" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="340" y="260" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">runner.load_agent</text>
    <text x="340" y="275" font-size="8.5" fill="#475569" text-anchor="middle">用户代码加载</text>
  </g>

  <!-- Region: HTTP/UI -->
  <rect x="470" y="80" width="220" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="482" y="98" font-size="9.5" font-weight="600" fill="#334155">HTTP / UI 层</text>
  <g>
    <rect x="490" y="115" width="180" height="50" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="580" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">FastAPI app</text>
    <text x="580" y="153" font-size="8.5" fill="#475569" text-anchor="middle">ksadk.server.app</text>
  </g>
  <g>
    <rect x="490" y="180" width="180" height="80" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="580" y="202" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">路由协议</text>
    <text x="580" y="218" font-size="8.5" fill="#047857" text-anchor="middle">/v1/responses</text>
    <text x="580" y="232" font-size="8.5" fill="#047857" text-anchor="middle">/v1/chat/completions</text>
    <text x="580" y="246" font-size="8.5" fill="#047857" text-anchor="middle">/run_sse · RunAgent</text>
  </g>

  <!-- Region: Conversations Runtime -->
  <rect x="720" y="80" width="280" height="290" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="732" y="100" font-size="10" font-weight="700" fill="#047857">Conversations Runtime · 数据面核心</text>
  <g>
    <rect x="740" y="115" width="240" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="860" y="136" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">build_run_input</text>
    <text x="860" y="151" font-size="8.5" fill="#475569" text-anchor="middle">history + attachments</text>
  </g>
  <g>
    <rect x="740" y="173" width="240" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="860" y="194" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">PlatformInvocationContext</text>
    <text x="860" y="209" font-size="8.5" fill="#475569" text-anchor="middle">invocation_id · account_id</text>
  </g>
  <g>
    <rect x="740" y="231" width="240" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="860" y="252" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">append run_status</text>
    <text x="860" y="267" font-size="8.5" fill="#475569" text-anchor="middle">in_progress / completed / failed</text>
  </g>
  <g>
    <rect x="740" y="289" width="115" height="48" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="797" y="310" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">run_checkpoint</text>
    <text x="797" y="325" font-size="8.5" fill="#475569" text-anchor="middle">run_resume</text>
  </g>
  <g>
    <rect x="865" y="289" width="115" height="48" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="922" y="310" font-size="10" font-weight="600" fill="#1e293b" text-anchor="middle">retry</text>
    <text x="922" y="325" font-size="8.5" fill="#475569" text-anchor="middle">fallback / PTL</text>
  </g>
  <text x="860" y="362" font-size="8.5" fill="#b91c1c" text-anchor="middle">可恢复错误时回退重试</text>

  <!-- Region: Runner -->
  <rect x="1030" y="80" width="180" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1042" y="98" font-size="9.5" font-weight="600" fill="#334155">Runner</text>
  <g>
    <rect x="1050" y="115" width="140" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="1120" y="140" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">BaseRunner</text>
    <text x="1120" y="156" font-size="9" fill="#475569" text-anchor="middle">invoke / stream</text>
    <text x="1120" y="170" font-size="8.5" fill="#64748b" text-anchor="middle">ADK · LangGraph · LC · DA</text>
  </g>

  <!-- Region: Session Service -->
  <rect x="1030" y="220" width="180" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="1042" y="238" font-size="9.5" font-weight="600" fill="#334155">Session Service</text>
  <g>
    <rect x="1050" y="255" width="140" height="70" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="1120" y="280" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">session + events</text>
    <text x="1120" y="296" font-size="8.5" fill="#475569" text-anchor="middle">持久化</text>
    <text x="1120" y="310" font-size="8.5" fill="#64748b" text-anchor="middle">transcript · checkpoint</text>
  </g>

  <!-- Region: Run 能力层 -->
  <rect x="1240" y="80" width="350" height="400" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1252" y="100" font-size="10" font-weight="700" fill="#92400e">Run 能力层 · 0.6.7</text>
  <g>
    <rect x="1260" y="115" width="310" height="42" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="1415" y="134" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ResumeRun</text>
    <text x="1415" y="149" font-size="8.5" fill="#475569" text-anchor="middle">find checkpoint · resume_input</text>
  </g>
  <g>
    <rect x="1260" y="167" width="310" height="42" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="1415" y="186" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">GetCheckpointResumePreview</text>
    <text x="1415" y="201" font-size="8.5" fill="#475569" text-anchor="middle">risk + receipts</text>
  </g>
  <g>
    <rect x="1260" y="219" width="310" height="42" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="1415" y="238" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">ListSessionCheckpoints</text>
    <text x="1415" y="253" font-size="8.5" fill="#475569" text-anchor="middle">分页 + 审计字段</text>
  </g>
  <g>
    <rect x="1260" y="271" width="310" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="1415" y="290" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">CancelRun</text>
    <text x="1415" y="305" font-size="8.5" fill="#475569" text-anchor="middle">cooperative · next chunk/tool boundary</text>
  </g>
  <g>
    <rect x="1260" y="323" width="310" height="42" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="1415" y="342" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">SubscribeRunEvents</text>
    <text x="1415" y="357" font-size="8.5" fill="#475569" text-anchor="middle">AfterSeqId · 5min 重连窗口</text>
  </g>

  <!-- 主链路箭头 -->
  <path d="M 190,150 L 260,140" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="222" y="134" font-size="8" fill="#475569">detect</text>
  <path d="M 340,165 L 340,180" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <path d="M 340,225 L 340,240" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <path d="M 420,262 L 490,140" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <text x="438" y="200" font-size="8" fill="#059669">server mode</text>
  <path d="M 670,140 L 740,139" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="680" y="132" font-size="8" fill="#475569">route</text>
  <path d="M 860,163 L 860,173" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <path d="M 980,197 L 1050,150" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <text x="990" y="180" font-size="8" fill="#059669">invoke</text>
  <path d="M 1050,170 L 980,250" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <text x="985" y="225" font-size="8" fill="#059669">output+meta</text>
  <path d="M 980,255 L 1050,290" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)"/>
  <text x="985" y="278" font-size="8" fill="#7c3aed">persist</text>
  <path d="M 855,255 L 1050,285" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.5"/>

  <!-- retry 虚线回 Runner -->
  <path d="M 980,313 L 1120,185" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aalert)"/>
  <text x="1018" y="258" font-size="8" fill="#b91c1c">recoverable</text>

  <!-- 能力层 → session -->
  <path d="M 1260,335 L 1190,295" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.5"/>
  <text x="1180" y="328" font-size="8" fill="#7c3aed">read events</text>
  <path d="M 1260,136 L 1190,260" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.3"/>
  <path d="M 1260,188 L 1190,275" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.3"/>
  <path d="M 1260,240 L 1190,285" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.3"/>

  <!-- ResumeRun → build_run_input -->
  <path d="M 1260,136 L 980,140" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#adisp)" stroke-opacity="0.5"/>
  <text x="990" y="118" font-size="8" fill="#d97706">resume_input</text>

  <!-- CancelRun → Runner -->
  <path d="M 1260,292 L 1190,150" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aalert)" stroke-opacity="0.5"/>
  <text x="1195" y="225" font-size="8" fill="#b91c1c">cooperate</text>

  <!-- 图例 -->
  <g transform="translate(30, 560)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="12" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="20" y="23" font-size="9.5" fill="#475569">入口 / API / Runner</text>
    <rect x="160" y="12" width="14" height="14" rx="2" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="23" font-size="9.5" fill="#475569">Session 持久化</text>
    <rect x="300" y="12" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="320" y="23" font-size="9.5" fill="#475569">Run 能力层</text>
    <rect x="440" y="12" width="14" height="14" rx="2" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="460" y="23" font-size="9.5" fill="#475569">retry / cancel</text>
    <line x1="580" y1="19" x2="610" y2="19" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="618" y="23" font-size="9.5" fill="#475569">虚线 = 异步/回退</text>
    <text x="0" y="50" font-size="9.5" fill="#64748b">基于 ksadk/server/app.py + conversations/runtime.py 真实代码路径</text>
  </g>
</svg>
