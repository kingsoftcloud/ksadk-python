<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">KsADK 总体技术架构</title>
  <desc id="desc">KsADK 浅色总体技术架构图，突出可信内核、Harness 执行层和插件化 Provider。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe5f0" stroke-width="1" opacity="0.62"/>
    </pattern>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.48" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="harnessGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#0891b2"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .section-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .section-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #64748b; }
      .box-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .box-title-lg { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .body { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #334155; }
      .small { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #475569; }
      .pill { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #155e75; }
      .mono { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
      .arrow-label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; fill: #475569; }
      .line-cyan { fill: none; stroke: #0891b2; stroke-width: 2.2; marker-end: url(#arrowCyan); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .line-orange { fill: none; stroke: #ea580c; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .line-gray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrowGray); }
      .bus-cyan { fill: none; stroke: #0891b2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .bus-blue { fill: none; stroke: #2563eb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1250" fill="#f8fafc"/>
  <rect width="1600" height="1250" fill="url(#grid)" opacity="0.72"/>

  <!-- 标题 -->
  <rect x="36" y="24" width="1528" height="80" rx="18" fill="url(#headerGlow)" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text class="title" x="64" y="76">KsADK 总体技术架构</text>
  <rect x="1394" y="46" width="140" height="36" rx="18" fill="#ffffff" stroke="#0891b2"/>
  <text class="pill" x="1464" y="69" text-anchor="middle">运行时能力</text>

  <!-- 分区底板 -->
  <g>
    <rect x="36" y="126" width="1528" height="154" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="36" y="300" width="1528" height="174" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="36" y="494" width="1528" height="326" rx="20" fill="url(#harnessGlow)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect x="36" y="840" width="1528" height="128" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="36" y="988" width="1528" height="124" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="36" y="1132" width="1528" height="86" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 5"/>
  </g>

  <!-- 分区标题 -->
  <text class="section-title" x="60" y="153">1 · 使用入口</text>
  <text class="section-note" x="184" y="153">同一运行底座，多种开发、调用与协议入口</text>
  <text class="section-title" x="60" y="327">2 · 可信内核</text>
  <text class="section-note" x="184" y="327">把并发、恢复和状态一致性收口到唯一可信边界</text>
  <text class="section-title" x="60" y="523">3 · Harness 执行层与插件化架构</text>
  <text class="section-note" x="346" y="523">稳定外壳负责控制与生命周期，Provider 保留原生执行语义</text>
  <text class="section-title" x="60" y="867">4 · Harness 共用能力</text>
  <text class="section-note" x="248" y="867">通过能力总线向上注入，不与具体 Agent 框架绑定</text>
  <text class="section-title" x="60" y="1015">5 · 统一事件与呈现</text>
  <text class="section-note" x="236" y="1015">Harness 运行事件依次适配、固化并投影到不同界面</text>
  <text class="section-title" x="60" y="1159">平台外部依赖</text>
  <text class="section-note" x="196" y="1159">KsADK 通过明确契约连接，不在 SDK 内重复建设</text>

  <!-- 主流程连线：入口先汇聚，再进入可信内核 -->
  <path class="bus-cyan" d="M203 253V270M501 253V270M799 253V270M1097 253V270M1395 253V270M203 270H1395"/>
  <circle cx="203" cy="270" r="3.5" fill="#0891b2"/>
  <circle cx="501" cy="270" r="3.5" fill="#0891b2"/>
  <circle cx="799" cy="270" r="3.5" fill="#0891b2"/>
  <circle cx="1097" cy="270" r="3.5" fill="#0891b2"/>
  <circle cx="1395" cy="270" r="3.5" fill="#0891b2"/>
  <path class="line-cyan" d="M799 270V342"/>
  <path class="line-blue" d="M800 454V538"/>
  <path class="line-blue" d="M470 663H514"/>
  <path class="line-blue" d="M926 663H966"/>
  <!-- 运行事件沿右侧独立通道进入第 5 层，不穿过共用能力卡片 -->
  <path class="line-orange" d="M900 786V828H1538V1023H197V1035"/>
  <!-- 六类共用能力汇聚后向上注入 Harness -->
  <path class="bus-blue" d="M169 944V956M407 944V956M645 944V956M927 944V956M1165 944V956M1403 944V956M169 956H1403"/>
  <path class="line-blue" d="M786 956V790"/>
  <rect x="758" y="476" width="84" height="20" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text class="arrow-label" x="800" y="490" text-anchor="middle">内核调度</text>

  <!-- 入口 -->
  <g filter="url(#shadow)">
    <rect x="64" y="171" width="278" height="82" rx="13" fill="#ecfeff" stroke="#0891b2"/>
    <rect x="362" y="171" width="278" height="82" rx="13" fill="#ecfdf5" stroke="#059669"/>
    <rect x="660" y="171" width="278" height="82" rx="13" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="958" y="171" width="278" height="82" rx="13" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="1256" y="171" width="278" height="82" rx="13" fill="#fffbeb" stroke="#d97706"/>
  </g>
  <g text-anchor="middle">
    <text class="box-title" x="203" y="202">开发者入口</text>
    <text class="body" x="203" y="227">Python SDK · AgentEngine CLI</text>
    <text class="box-title" x="501" y="202">本地工作台</text>
    <text class="body" x="501" y="227">Studio · 调试与回放</text>
    <text class="box-title" x="799" y="202">标准调用接口</text>
    <text class="body" x="799" y="227">Responses · Chat · Session</text>
    <text class="box-title" x="1097" y="202">协议接入</text>
    <text class="body" x="1097" y="227">A2A · AG-UI · A2UI</text>
    <text class="box-title" x="1395" y="202">自动任务</text>
    <text class="body" x="1395" y="227">Scheduler · 定时与批量触发</text>
  </g>

  <!-- 可信内核 -->
  <g filter="url(#shadow)">
    <rect x="64" y="348" width="292" height="100" rx="14" fill="#f8fafc" stroke="#64748b"/>
    <rect x="380" y="342" width="840" height="112" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <rect x="1244" y="348" width="290" height="100" rx="14" fill="#f8fafc" stroke="#64748b"/>
  </g>
  <text class="box-title" x="86" y="377">应用装配</text>
  <text class="body" x="86" y="401">FastAPI 路由 · 生命周期</text>
  <text class="small" x="86" y="424">认证、会话、协议入口统一编排</text>
  <text class="box-title-lg" x="406" y="374">Agent Kernel</text>
  <text class="body" x="406" y="399">许可控制 · 持久收件箱 · 租约与防旧写 · 交互恢复</text>
  <rect x="406" y="416" width="180" height="24" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <rect x="598" y="416" width="180" height="24" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <rect x="790" y="416" width="180" height="24" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <rect x="982" y="416" width="210" height="24" rx="12" fill="#cffafe" stroke="#67e8f9"/>
  <text class="pill" x="496" y="432" text-anchor="middle">并发与背压</text>
  <text class="pill" x="688" y="432" text-anchor="middle">取消与恢复</text>
  <text class="pill" x="880" y="432" text-anchor="middle">状态一致性</text>
  <text class="pill" x="1087" y="432" text-anchor="middle">运行时安全边界</text>
  <text class="box-title" x="1266" y="377">构建与部署</text>
  <text class="body" x="1266" y="401">代码 / 容器 / ManagedRuntime</text>
  <text class="small" x="1266" y="424">Bundle、摘要与来源可追溯</text>

  <!-- Harness 核心：三栏 -->
  <rect x="64" y="548" width="406" height="238" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="514" y="548" width="412" height="238" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="966" y="548" width="568" height="238" rx="16" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>

  <text class="box-title-lg" x="88" y="580">插件组合</text>
  <text class="small" x="88" y="602">配置决定“本次运行装入什么”</text>
  <rect x="88" y="619" width="358" height="38" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="body" x="267" y="643" text-anchor="middle">版本 → 组合配置 → AgentBundle v2</text>
  <rect x="88" y="668" width="358" height="38" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="body" x="267" y="692" text-anchor="middle">PluginHost：发现、装载、启停、回滚</text>
  <text class="small" x="88" y="731">锁文件 / 摘要 / 来源证明，支持原子切换</text>
  <text class="small" x="88" y="754">默认生态：DSH / Cordis；原生桥接：Codex</text>

  <text class="box-title-lg" x="538" y="580">Harness 执行层</text>
  <text class="small" x="538" y="602">稳定外壳：统一控制，不吞掉框架特性</text>
  <rect x="538" y="619" width="364" height="46" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="box-title" x="720" y="639" text-anchor="middle">一次 Activation 选择一个 Provider</text>
  <text class="small" x="720" y="656" text-anchor="middle">并建立隔离的运行上下文</text>
  <rect x="538" y="676" width="174" height="42" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <rect x="728" y="676" width="174" height="42" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
  <text class="small" x="625" y="701" text-anchor="middle">控制 / 工具 / 会话连续性</text>
  <text class="small" x="815" y="701" text-anchor="middle">上下文 / 事件 / 可观测性</text>
  <rect x="538" y="730" width="364" height="34" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text class="small" x="720" y="752" text-anchor="middle">Host 管生命周期 · Provider 管原生语义与私有状态</text>

  <text class="box-title-lg" x="990" y="580">可插拔 Provider</text>
  <text class="small" x="990" y="602">同一 Harness 契约下接入不同执行内核</text>
  <rect x="990" y="619" width="250" height="63" rx="11" fill="#ecfeff" stroke="#0891b2"/>
  <rect x="1258" y="619" width="250" height="63" rx="11" fill="#ecfdf5" stroke="#059669"/>
  <rect x="990" y="698" width="250" height="63" rx="11" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="1258" y="698" width="250" height="63" rx="11" fill="#fffbeb" stroke="#d97706"/>
  <text class="box-title" x="1115" y="644" text-anchor="middle">Codex 原生 Provider</text>
  <text class="small" x="1115" y="665" text-anchor="middle">桥接原生执行与事件</text>
  <text class="box-title" x="1383" y="644" text-anchor="middle">KsADK Harness Provider</text>
  <text class="small" x="1383" y="665" text-anchor="middle">ADK / LangGraph 等框架族</text>
  <text class="box-title" x="1115" y="723" text-anchor="middle">DSH / Cordis Provider</text>
  <text class="small" x="1115" y="744" text-anchor="middle">插件生态与宿主协作</text>
  <text class="box-title" x="1383" y="723" text-anchor="middle">SubagentProvider</text>
  <text class="small" x="1383" y="744" text-anchor="middle">子代理路由与嵌套执行</text>

  <!-- 连线说明遮罩 -->
  <rect x="473" y="651" width="38" height="24" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text class="arrow-label" x="492" y="667" text-anchor="middle">装载</text>
  <rect x="927" y="651" width="38" height="24" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text class="arrow-label" x="946" y="667" text-anchor="middle">选择</text>

  <!-- 共用能力 -->
  <g filter="url(#shadow)">
    <rect x="64" y="884" width="210" height="60" rx="12" fill="#ecfeff" stroke="#0891b2"/>
    <rect x="302" y="884" width="210" height="60" rx="12" fill="#ecfdf5" stroke="#059669"/>
    <rect x="540" y="884" width="210" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="822" y="884" width="210" height="60" rx="12" fill="#fffbeb" stroke="#d97706"/>
    <rect x="1060" y="884" width="210" height="60" rx="12" fill="#fff1f2" stroke="#e11d48"/>
    <rect x="1298" y="884" width="210" height="60" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  </g>
  <rect x="718" y="849" width="136" height="28" rx="14" fill="#eff6ff" stroke="#2563eb"/>
  <text class="arrow-label" x="786" y="868" text-anchor="middle">共用能力注入</text>
  <rect x="1490" y="849" width="72" height="28" rx="14" fill="#fff7ed" stroke="#ea580c"/>
  <text class="arrow-label" x="1526" y="868" text-anchor="middle">事件通道</text>
  <g text-anchor="middle">
    <text class="box-title" x="169" y="910">上下文与提示</text>
    <text class="small" x="169" y="930">压缩、拼装、快照</text>
    <text class="box-title" x="407" y="910">工具与安全</text>
    <text class="small" x="407" y="930">策略、审批、权限</text>
    <text class="box-title" x="645" y="910">MCP 与 Skill</text>
    <text class="small" x="645" y="930">工具发现与能力注入</text>
    <text class="box-title" x="927" y="910">沙箱与工作区</text>
    <text class="small" x="927" y="930">隔离执行、文件与命令</text>
    <text class="box-title" x="1165" y="910">记忆与知识</text>
    <text class="small" x="1165" y="930">Memory · KnowledgeBase</text>
    <text class="box-title" x="1403" y="910">追踪与评测</text>
    <text class="small" x="1403" y="930">Trace · 指标 · Eval</text>
  </g>

  <!-- 统一事件链 -->
  <path class="line-orange" d="M330 1070H365"/>
  <path class="line-orange" d="M624 1070H659"/>
  <path class="line-orange" d="M918 1070H953"/>
  <path class="line-orange" d="M1212 1070H1247"/>
