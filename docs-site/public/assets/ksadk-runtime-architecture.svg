<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 880" role="img" aria-labelledby="t d">
  <title id="t">KsADK Agent Runtime Platform 架构</title>
  <desc id="d">三层架构:业务 Agent 框架、KsADK Runtime 数据面、托管控制面。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      rect[fill="#fbfbf9"], rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#f8fafc"] { fill: #0f172a; }
      rect[fill="#eff6ff"] { fill: #1a1f2e; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#f5f3ff"] { fill: #1f1a2e; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#059669"/></marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#d97706"/></marker>
    <marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect class="bg" width="1480" height="880" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">KsADK — Agent Runtime Platform</text>
  <text x="40" y="60" font-size="12" fill="#64748b">用户写 agent 做什么 · 平台管怎么跑</text>

  <!-- ===== Layer 1: 业务 Agent 框架 ===== -->
  <rect x="40" y="85" width="1400" height="110" rx="12" fill="#eff6ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="108" font-size="13" font-weight="700" fill="#4338ca">业务 Agent 框架（用户自带）</text>
  <!-- 4 框架卡片 -->
  <rect x="120" y="120" width="280" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="260" y="146" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Google ADK</text>
  <text x="260" y="164" font-size="10" fill="#64748b" text-anchor="middle">agent.py · root_agent</text>

  <rect x="440" y="120" width="280" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="580" y="146" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">LangGraph</text>
  <text x="580" y="164" font-size="10" fill="#64748b" text-anchor="middle">StateGraph</text>

  <rect x="760" y="120" width="280" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="900" y="146" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">LangChain</text>
  <text x="900" y="164" font-size="10" fill="#64748b" text-anchor="middle">Runnable · chain</text>

  <rect x="1080" y="120" width="280" height="60" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="1220" y="146" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">DeepAgents</text>
  <text x="1220" y="164" font-size="10" fill="#64748b" text-anchor="middle">create_deep_agent</text>

  <!-- 4 框架 → Runner (汇聚到中间) -->
  <path d="M 260,180 L 260,210 L 580,210 L 580,240" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ar)" stroke-opacity="0.6"/>
  <path d="M 580,180 L 580,240" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ar)" stroke-opacity="0.6"/>
  <path d="M 900,180 L 900,210 L 580,210" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
  <path d="M 1220,180 L 1220,210 L 580,210" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- ===== Layer 2: KsADK Runtime 数据面 ===== -->
  <rect x="40" y="225" width="1400" height="475" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="56" y="248" font-size="14" font-weight="700" fill="#047857">KsADK Runtime · 数据面</text>
  <text x="240" y="248" font-size="11" fill="#64748b">runner · session/transcript · toolsets · sandbox · API</text>

  <!-- 左列: CLI + Web UI -->
  <rect x="70" y="270" width="200" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="170" y="296" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">agentengine CLI</text>
  <text x="170" y="314" font-size="10" fill="#64748b" text-anchor="middle">init · run · web · build · launch</text>

  <rect x="70" y="345" width="200" height="55" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="170" y="370" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">本地 Web UI</text>
  <text x="170" y="387" font-size="10" fill="#64748b" text-anchor="middle">会话 · 附件 · workspace</text>

  <!-- Runner (核心,大卡片) -->
  <rect x="310" y="270" width="240" height="130" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="430" y="298" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">Runner 编排</text>
  <text x="430" y="316" font-size="10" fill="#475569" text-anchor="middle">BaseRunner · 框架适配</text>
  <line x1="330" y1="328" x2="530" y2="328" stroke="#059669" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="430" y="346" font-size="10" fill="#047857" text-anchor="middle">ADKRunner</text>
  <text x="430" y="362" font-size="10" fill="#047857" text-anchor="middle">LangGraphRunner</text>
  <text x="430" y="378" font-size="10" fill="#047857" text-anchor="middle">LangChain · DeepAgents</text>
  <text x="430" y="393" font-size="9" fill="#64748b" text-anchor="middle">invoke · stream · request_cancel</text>

  <!-- Conversations Runtime (核心,大卡片) -->
  <rect x="590" y="270" width="280" height="130" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="730" y="298" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">Conversations Runtime</text>
  <text x="730" y="316" font-size="10" fill="#475569" text-anchor="middle">对话运行时 · 数据面核心</text>
  <line x1="610" y1="328" x2="850" y2="328" stroke="#059669" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="615" y="346" font-size="10" fill="#047857">session / transcript</text>
  <text x="615" y="362" font-size="10" fill="#047857">PlatformInvocationContext</text>
  <text x="615" y="378" font-size="10" fill="#047857">invocation_id · account_id</text>
  <text x="615" y="393" font-size="9" fill="#64748b">checkpoint / resume · SubscribeRunEvents</text>

  <!-- OpenAI API -->
  <rect x="910" y="270" width="240" height="60" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="296" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">OpenAI 兼容 API</text>
  <text x="1030" y="314" font-size="10" fill="#64748b" text-anchor="middle">/v1/responses · /v1/chat/completions</text>

  <!-- 记忆知识库 -->
  <rect x="910" y="345" width="240" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1030" y="370" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">记忆与知识库</text>
  <text x="1030" y="387" font-size="10" fill="#64748b" text-anchor="middle">LTM · KB · LanceDB</text>

  <!-- 连线: CLI→Runner, WebUI→Conv, Runner↔Conv, Conv→API, Conv→Mem -->
  <path d="M 270,300 L 310,335" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M 270,372 L 590,335" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)" stroke-opacity="0.6"/>
  <path d="M 550,335 L 590,335" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
  <path d="M 870,310 L 910,300" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M 870,365 L 910,370" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ar-p)"/>

  <!-- ===== 内置 Toolsets (子层) ===== -->
  <rect x="70" y="425" width="1340" height="120" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="86" y="448" font-size="12" font-weight="700" fill="#92400e">内置 Toolsets</text>

  <rect x="90" y="460" width="200" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="190" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Skill 工具</text>
  <text x="190" y="502" font-size="9" fill="#64748b" text-anchor="middle">list · load · search · execute</text>
  <text x="190" y="516" font-size="9" fill="#64748b" text-anchor="middle">Skill Space · SkillService</text>

  <rect x="310" y="460" width="200" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="410" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Workspace 工具</text>
  <text x="410" y="502" font-size="9" fill="#64748b" text-anchor="middle">read · write · list · edit</text>
  <text x="410" y="516" font-size="9" fill="#64748b" text-anchor="middle">search · lint</text>

  <rect x="530" y="460" width="200" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="630" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Sandbox 工具</text>
  <text x="630" y="502" font-size="9" fill="#64748b" text-anchor="middle">run_command · run_code</text>
  <text x="630" y="516" font-size="9" fill="#64748b" text-anchor="middle">E2B backend</text>

  <rect x="750" y="460" width="200" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="850" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Web 工具</text>
  <text x="850" y="502" font-size="9" fill="#64748b" text-anchor="middle">web_fetch · web_search</text>
  <text x="850" y="516" font-size="9" fill="#64748b" text-anchor="middle">SSRF 校验</text>

  <rect x="970" y="460" width="200" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="1070" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Platform 工具</text>
  <text x="1070" y="502" font-size="9" fill="#64748b" text-anchor="middle">component_status</text>
  <text x="1070" y="516" font-size="9" fill="#64748b" text-anchor="middle">memory · knowledge</text>

  <!-- Tool Gateway (alert) -->
  <rect x="1190" y="460" width="200" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="1290" y="485" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Tool Gateway</text>
  <text x="1290" y="502" font-size="9" fill="#64748b" text-anchor="middle">审批 envelope</text>
  <text x="1290" y="516" font-size="9" fill="#64748b" text-anchor="middle">approval_required</text>

  <!-- Toolsets → Conv (工具注入) -->
  <path d="M 730,400 L 730,425" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar-o)" stroke-dasharray="4,3" stroke-opacity="0.6"/>
  <text x="740" y="418" font-size="9" fill="#d97706">工具注入</text>

  <!-- ===== Sandbox/Skill Runtime/Dispatcher ===== -->
  <rect x="70" y="565" width="420" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="592" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Sandbox Runtime</text>
  <text x="280" y="612" font-size="10" fill="#475569" text-anchor="middle">通用隔离执行底座 · E2B-compatible backend</text>
  <text x="280" y="628" font-size="9" fill="#64748b" text-anchor="middle">Skill Runtime + sandbox direct tools 共用 · KSADK_SANDBOX_TEMPLATE_ID</text>

  <rect x="510" y="565" width="420" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="592" font-size="13" font-weight="700" fill="#064e3b" text-anchor="middle">Skill Runtime</text>
  <text x="720" y="612" font-size="10" fill="#475569" text-anchor="middle">发现 · 下载 · sha256 校验 · 安全解压 · loader</text>
  <text x="720" y="628" font-size="9" fill="#64748b" text-anchor="middle">local_process / e2b backend · execute_skills</text>

  <rect x="950" y="565" width="440" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1170" y="592" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Tool Dispatcher · 渐进式披露</text>
  <text x="1170" y="612" font-size="10" fill="#475569" text-anchor="middle">list · describe · call</text>
  <text x="1170" y="628" font-size="9" fill="#64748b" text-anchor="middle">KSADK_BUILTIN_TOOLS_MODE: off/dispatcher/focused/deferred</text>

  <!-- Toolsets → 下方 runtime -->
  <path d="M 190,530 L 190,565" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.5"/>
  <path d="M 630,530 L 720,565" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#ar-g)" stroke-opacity="0.5"/>
  <path d="M 1070,530 L 1170,565" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#ar-o)" stroke-opacity="0.5"/>

  <!-- ===== Layer 3: 托管控制面 ===== -->
  <rect x="40" y="665" width="1400" height="120" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="688" font-size="13" font-weight="700" fill="#92400e">托管层 · 控制面</text>
  <text x="200" y="688" font-size="11" fill="#64748b">agentengine-server · 部署后端 · 平台服务</text>

  <rect x="70" y="705" width="280" height="65" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="210" y="730" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">AgentEngine Server</text>
  <text x="210" y="748" font-size="10" fill="#64748b" text-anchor="middle">artifact · runtime lifecycle</text>
  <text x="210" y="762" font-size="10" fill="#64748b" text-anchor="middle">route · auth · observe · policy</text>

  <rect x="370" y="705" width="220" height="65" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="480" y="730" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">部署后端</text>
  <text x="480" y="748" font-size="10" fill="#64748b" text-anchor="middle">Serverless · Hermes · OpenClaw</text>

  <rect x="610" y="705" width="240" height="65" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="730" y="730" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Skill Service</text>
  <text x="730" y="748" font-size="10" fill="#64748b" text-anchor="middle">Skill Space / Version 治理</text>
  <text x="730" y="762" font-size="10" fill="#64748b" text-anchor="middle">manifest · download url</text>

  <rect x="870" y="705" width="240" height="65" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="990" y="730" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Sandbox Service</text>
  <text x="990" y="748" font-size="10" fill="#64748b" text-anchor="middle">template · instance · token</text>
  <text x="990" y="762" font-size="10" fill="#64748b" text-anchor="middle">AIO / Code / Browser / Private</text>

  <rect x="1130" y="705" width="260" height="65" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="1260" y="730" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">金山云基础设施</text>
  <text x="1260" y="748" font-size="10" fill="#64748b" text-anchor="middle">KS3 · KCR · KOP</text>
  <text x="1260" y="762" font-size="10" fill="#64748b" text-anchor="middle">对象存储 · 镜像仓库 · 签名</text>

  <!-- Runtime → 托管层 连线 -->
  <path d="M 280,645 L 280,665 L 480,705" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#ar-o)" stroke-opacity="0.5"/>
  <path d="M 720,645 L 720,665 L 730,705" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#ar-g)" stroke-opacity="0.5"/>
  <path d="M 280,645 L 990,665 L 990,705" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.4"/>
  <path d="M 1170,645 L 1260,665 L 1260,705" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#ar-p)" stroke-opacity="0.4"/>

  <!-- 图例 -->
  <g transform="translate(40, 810)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="10" width="14" height="14" rx="2" fill="#eff6ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="20" y="21" font-size="10" fill="#475569">业务 Agent 框架</text>
    <rect x="150" y="10" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="170" y="21" font-size="10" fill="#475569">KsADK Runtime (Runner/API/运行时)</text>
    <rect x="430" y="10" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="450" y="21" font-size="10" fill="#475569">工具 / 控制面</text>
    <rect x="580" y="10" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="600" y="21" font-size="10" fill="#475569">存储 / Sandbox</text>
    <rect x="730" y="10" width="14" height="14" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="750" y="21" font-size="10" fill="#475569">审批 / 安全</text>
    <text x="0" y="48" font-size="10" fill="#64748b">边界：业务 Agent 只写「做什么」（agent 定义 · prompt · domain tools · 工作流）；KsADK 负责「怎么跑」（runner · session · toolsets · sandbox · API · 部署 · 观测）</text>
  </g>
</svg>
