    <text x="1180" y="619" font-size="9.5" fill="#475569" text-anchor="middle">list · describe · call</text>
    <text x="1180" y="636" font-size="9.5" fill="#475569" text-anchor="middle">KSADK_BUILTIN_TOOLS_MODE: off/dispatcher/focused/deferred</text>
    <text x="1180" y="650" font-size="8.5" fill="#64748b" text-anchor="middle">profile: default / coding</text>
  </g>

