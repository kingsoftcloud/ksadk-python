    <text x="1290" y="493" font-size="8.5" fill="#475569" text-anchor="middle">审批 envelope</text>
    <text x="1290" y="506" font-size="8.5" fill="#475569" text-anchor="middle">approval_required</text>
  </g>
  <path d="M 280,487 L 1180,487" fill="none" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
  <text x="730" y="483" font-size="8.5" fill="#b91c1c" text-anchor="middle">medium/high 风险工具走审批</text>

  <!-- Sandbox Runtime / Skill Runtime / Dispatcher -->
  <g>
    <rect x="80" y="575" width="400" height="78" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="280" y="601" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Sandbox Runtime</text>
    <text x="280" y="619" font-size="9.5" fill="#475569" text-anchor="middle">通用隔离执行底座 · E2B-compatible backend</text>
    <text x="280" y="636" font-size="9.5" fill="#475569" text-anchor="middle">Skill Runtime + sandbox direct tools 共用</text>
    <text x="280" y="650" font-size="8.5" fill="#64748b" text-anchor="middle">KSADK_SANDBOX_TEMPLATE_ID · run_code · run_command</text>
  </g>
  <g>
