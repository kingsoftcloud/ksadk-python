    <text x="720" y="619" font-size="9.5" fill="#475569" text-anchor="middle">发现 · 下载 · sha256 校验 · 安全解压 · loader</text>
    <text x="720" y="636" font-size="9.5" fill="#475569" text-anchor="middle">工具注入 · 隔离执行编排</text>
    <text x="720" y="650" font-size="8.5" fill="#64748b" text-anchor="middle">local_process / e2b backend · execute_skills</text>
  </g>
  <g>
