  <!-- 边界与图例 -->
  <line x1="1140" y1="1234" x2="1178" y2="1234" stroke="#2563eb" stroke-width="2.4"/>
  <text class="small" x="1188" y="1239">主运行链路</text>
  <line x1="1300" y1="1234" x2="1338" y2="1234" stroke="#ea580c" stroke-width="2.2"/>
  <text class="small" x="1348" y="1239">事件事实链</text>
  <line x1="1452" y1="1234" x2="1490" y2="1234" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
