  <g text-anchor="middle">
    <text class="box-title" x="197" y="1062">框架事件适配</text>
    <text class="small" x="197" y="1084">保留 Provider 原生身份</text>
    <text class="box-title" x="494.5" y="1062">RuntimeEvent v2</text>
    <text class="small" x="494.5" y="1084">统一事实模型</text>
    <text class="box-title" x="788.5" y="1062">SessionEvent 日志</text>
    <text class="small" x="788.5" y="1084">持久化与顺序保证</text>
    <text class="box-title" x="1082.5" y="1062">投影与回放</text>
    <text class="small" x="1082.5" y="1084">流式、聚合、断点续传</text>
    <text class="box-title" x="1390.5" y="1062">API / Studio / 托管界面</text>
    <text class="small" x="1390.5" y="1084">同源一致呈现</text>
  </g>

  <!-- 外部依赖 -->
  <g text-anchor="middle">
    <rect x="320" y="1171" width="250" height="32" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="590" y="1171" width="250" height="32" rx="10" fill="#ffffff" stroke="#94a3b8"/>
