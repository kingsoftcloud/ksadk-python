    <text x="180" y="478" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Skill 工具</text>
    <text x="180" y="493" font-size="8.5" fill="#475569" text-anchor="middle">list_skills · load_skill</text>
    <text x="180" y="506" font-size="8.5" fill="#475569" text-anchor="middle">search · execute_skills</text>
  </g>
  <g>
    <rect x="300" y="455" width="200" height="65" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="400" y="478" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Workspace 工具</text>
    <text x="400" y="493" font-size="8.5" fill="#475569" text-anchor="middle">read · write · list</text>
    <text x="400" y="506" font-size="8.5" fill="#475569" text-anchor="middle">edit · search · lint</text>
  </g>
  <g>
    <rect x="520" y="455" width="200" height="65" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="620" y="478" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Sandbox 工具</text>
    <text x="620" y="493" font-size="8.5" fill="#475569" text-anchor="middle">run_command · run_code</text>
    <text x="620" y="506" font-size="8.5" fill="#475569" text-anchor="middle">E2B backend</text>
  </g>
  <g>
    <rect x="740" y="455" width="200" height="65" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="840" y="478" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Web 工具</text>
    <text x="840" y="493" font-size="8.5" fill="#475569" text-anchor="middle">web_fetch · web_search</text>
    <text x="840" y="506" font-size="8.5" fill="#475569" text-anchor="middle">SSRF 校验</text>
  </g>
  <g>
    <rect x="960" y="455" width="200" height="65" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
    <text x="1060" y="478" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Platform 工具</text>
    <text x="1060" y="493" font-size="8.5" fill="#475569" text-anchor="middle">component_status</text>
    <text x="1060" y="506" font-size="8.5" fill="#475569" text-anchor="middle">memory · knowledge</text>
  </g>
  <!-- Tool Gateway (alert) -->
  <g>
    <rect x="1180" y="455" width="220" height="65" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
