<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 980" role="img" aria-labelledby="title desc">
  <title id="title">KsADK Agent Runtime Platform 架构</title>
  <desc id="desc">用户写 agent 做什么,平台管怎么跑。三层:业务 Agent 框架、KsADK Runtime 数据面、托管控制面。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg-light { fill: #0f172a; }
      rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#fbfbf9"] { fill: #0f172a; }
      rect[fill="#f8fafc"] { fill: #0f172a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#eef2ff"] { fill: #1a1f2e; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
      text[fill="#92400e"] { fill: #fbbf24; }
      text[fill="#7c2d12"] { fill: #fed7aa; }
      text[fill="#5b21b6"] { fill: #c4b5fd; }
      text[fill="#7c3aed"] { fill: #a78bfa; }
      text[fill="#047857"] { fill: #34d399; }
      text[fill="#059669"] { fill: #34d399; }
      rect[stroke="#cbd5e1"] { stroke: #475569; }
      rect[stroke="#94a3b8"] { stroke: #64748b; }
    }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="askill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#7c3aed"/></marker>
    <marker id="adisp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#d97706"/></marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#059669"/></marker>
    <marker id="aalert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5,L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg-light" width="1480" height="980" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="40" y="36" font-size="18" font-weight="700" fill="#0f172a">KsADK — Agent Runtime Platform</text>
  <text x="40" y="56" font-size="11" fill="#64748b">用户写 agent 做什么 · 平台管怎么跑</text>

  <!-- ===== Layer 1: 业务 Agent 框架 ===== -->
  <rect x="40" y="80" width="1400" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="56" y="100" font-size="11.5" font-weight="700" fill="#334155">业务 Agent 框架（用户自带）</text>
  <g>
    <rect x="120" y="114" width="150" height="48" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="195" y="136" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">Google ADK</text>
    <text x="195" y="151" font-size="9" fill="#64748b" text-anchor="middle">agent.py / root_agent</text>
  </g>
  <g>
    <rect x="450" y="114" width="150" height="48" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="525" y="136" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">LangGraph</text>
    <text x="525" y="151" font-size="9" fill="#64748b" text-anchor="middle">StateGraph</text>
  </g>
  <g>
    <rect x="780" y="114" width="150" height="48" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="855" y="136" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">LangChain</text>
    <text x="855" y="151" font-size="9" fill="#64748b" text-anchor="middle">Runnable / chain</text>
  </g>
  <g>
    <rect x="1110" y="114" width="150" height="48" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="1185" y="136" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle">DeepAgents</text>
    <text x="1185" y="151" font-size="9" fill="#64748b" text-anchor="middle">create_deep_agent</text>
  </g>
  <path d="M 195,162 L 195,195 L 440,195 L 440,222" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.6"/>
  <path d="M 525,162 L 525,195 L 540,195 L 540,222" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.6"/>
  <path d="M 855,162 L 855,195 L 680,195 L 680,222" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.6"/>
  <path d="M 1185,162 L 1185,195 L 820,195 L 820,222" fill="none" stroke="#6366f1" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.6"/>

  <!-- ===== Layer 2: KsADK Runtime 数据面 ===== -->
  <rect x="40" y="205" width="1400" height="560" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="56" y="225" font-size="12" font-weight="700" fill="#047857">KsADK Runtime · 数据面</text>
  <text x="230" y="225" font-size="10" fill="#64748b">runner · session/transcript · toolsets · sandbox · API</text>

  <!-- CLI / Web UI -->
  <g>
    <rect x="80" y="245" width="200" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="270" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">agentengine CLI</text>
    <text x="180" y="286" font-size="9" fill="#475569" text-anchor="middle">init · run · web</text>
    <text x="180" y="300" font-size="9" fill="#475569" text-anchor="middle">build · launch · config</text>
  </g>
  <g>
    <rect x="80" y="333" width="200" height="55" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="180" y="358" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">本地 Web UI</text>
    <text x="180" y="375" font-size="9" fill="#475569" text-anchor="middle">会话 · 附件 · workspace · streaming</text>
  </g>

  <!-- Runner 编排 -->
  <g>
    <rect x="330" y="245" width="220" height="143" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="440" y="270" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Runner 编排</text>
    <text x="440" y="285" font-size="9" fill="#475569" text-anchor="middle">BaseRunner · 框架适配</text>
    <line x1="350" y1="295" x2="530" y2="295" stroke="#059669" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="440" y="313" font-size="9.5" fill="#047857" text-anchor="middle">ADKRunner</text>
    <text x="440" y="330" font-size="9.5" fill="#047857" text-anchor="middle">LangGraphRunner</text>
    <text x="440" y="347" font-size="9.5" fill="#047857" text-anchor="middle">LangChain · DeepAgents</text>
    <text x="440" y="372" font-size="8.5" fill="#64748b" text-anchor="middle">invoke · stream · request_cancel</text>
  </g>

  <!-- Conversations Runtime -->
  <g>
    <rect x="600" y="245" width="280" height="143" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="740" y="270" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Conversations Runtime</text>
    <text x="740" y="285" font-size="9" fill="#475569" text-anchor="middle">对话运行时 · 数据面核心</text>
    <line x1="620" y1="295" x2="860" y2="295" stroke="#059669" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="650" y="313" font-size="9.5" fill="#047857">session / transcript</text>
    <text x="650" y="330" font-size="9.5" fill="#047857">PlatformInvocationContext</text>
    <text x="650" y="347" font-size="9.5" fill="#047857">invocation_id · account_id</text>
    <text x="650" y="372" font-size="8.5" fill="#64748b">checkpoint/resume · SubscribeRunEvents</text>
  </g>

  <!-- OpenAI API -->
  <g>
    <rect x="930" y="245" width="240" height="68" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="1050" y="270" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">OpenAI 兼容 API</text>
    <text x="1050" y="286" font-size="9" fill="#475569" text-anchor="middle">/v1/responses</text>
    <text x="1050" y="300" font-size="9" fill="#475569" text-anchor="middle">/v1/chat/completions</text>
  </g>
  <!-- 记忆与知识库 -->
  <g>
    <rect x="930" y="333" width="240" height="55" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="1050" y="358" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">记忆与知识库</text>
    <text x="1050" y="375" font-size="9" fill="#475569" text-anchor="middle">LTM · KB · LanceDB backend</text>
  </g>

  <!-- 连线 -->
  <path d="M 280,278 L 330,295" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)"/>
  <path d="M 280,360 L 600,300" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)" stroke-opacity="0.5"/>
