<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-labelledby="t d">
  <title id="t">Skills Mode 判定</title>
  <desc id="d">ADK runner 解析 skills mode 的判定链：显式 KSADK_SKILLS_MODE 优先，auto 模式下依次按 Skill Runtime Backend、Sandbox Backend、template id、本地 SKILL.md 推断 sandbox 或 local，否则不注入 Skill Runtime。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    @media (prefers-color-scheme: light) {
      .bg-dark { fill: none; }
      .grid-pattern { display: none; }
      text[fill="white"] { fill: #0f172a; }
      text[fill="#94a3b8"] { fill: #475569; }
      text[fill="#a7f3d0"] { fill: #047857; }
      text[fill="#64748b"] { fill: #64748b; }
      text[fill="#22d3ee"] { fill: #0e7490; }
      text[fill="#34d399"] { fill: #047857; }
      text[fill="#fbbf24"] { fill: #b45309; }
      text[fill="#a78bfa"] { fill: #6d28d9; }
      text[fill="#fb7185"] { fill: #be123c; }
      rect[fill="#0f172a"] { fill: none; }
      rect[stroke="#94a3b8"], rect[stroke="#22d3ee"], rect[stroke="#34d399"], rect[stroke="#fbbf24"], rect[stroke="#a78bfa"], rect[stroke="#fb7185"] { stroke-opacity: 0.8; }
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ar-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="ar-c" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="ar-a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="ar-v" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="ar-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185"/></marker>
  </defs>

  <rect class="bg-dark" width="980" height="720" fill="#0f172a"/>
  <rect class="grid-pattern" width="980" height="720" fill="url(#grid)"/>

  <text x="30" y="34" fill="white" font-size="16" font-weight="700">Skills Mode 判定</text>
  <text x="30" y="52" fill="#94a3b8" font-size="10">显式 KSADK_SKILLS_MODE 优先 · auto 模式按环境与本地目录逐级推断 sandbox / local / 不注入</text>

  <!-- Start -->
  <g>
    <rect x="380" y="80" width="220" height="50" rx="6" fill="#0f172a"/>
    <rect x="380" y="80" width="220" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="490" y="103" fill="white" font-size="11" font-weight="600" text-anchor="middle">解析 skills mode</text>
    <text x="490" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">ADK runner 装载期</text>
  </g>

  <!-- Decision 1: explicit -->
  <g>
    <polygon points="490,155 660,210 490,265 320,210" fill="#0f172a"/>
    <polygon points="490,155 660,210 490,265 320,210" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="490" y="205" fill="white" font-size="10" font-weight="600" text-anchor="middle">KSADK_SKILLS_MODE</text>
    <text x="490" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">不是 auto?</text>
  </g>

  <!-- Explicit mode result -->
  <g>
    <rect x="690" y="185" width="200" height="55" rx="6" fill="#0f172a"/>
    <rect x="690" y="185" width="200" height="55" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="790" y="208" fill="white" font-size="11" font-weight="600" text-anchor="middle">使用显式 mode</text>
    <text x="790" y="224" fill="#94a3b8" font-size="8" text-anchor="middle">直接生效，不再推断</text>
  </g>

  <!-- Decision 2: runtime backend -->
  <g>
    <polygon points="490,290 660,345 490,400 320,345" fill="#0f172a"/>
    <polygon points="490,290 660,345 490,400 320,345" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="490" y="340" fill="white" font-size="10" font-weight="600" text-anchor="middle">KSADK_SKILL_RUNTIME_BACKEND</text>
    <text x="490" y="356" fill="#94a3b8" font-size="8" text-anchor="middle">有效且非 disabled?</text>
  </g>

  <!-- Decision 3: sandbox backend -->
  <g>
    <polygon points="490,425 660,480 490,535 320,480" fill="#0f172a"/>
    <polygon points="490,425 660,480 490,535 320,480" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="490" y="475" fill="white" font-size="10" font-weight="600" text-anchor="middle">KSADK_SANDBOX_BACKEND</text>
    <text x="490" y="491" fill="#94a3b8" font-size="8" text-anchor="middle">有效且非 disabled?</text>
  </g>

  <!-- Decision 4: template -->
  <g>
    <polygon points="490,560 660,615 490,670 320,615" fill="#0f172a"/>
    <polygon points="490,560 660,615 490,670 320,615" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="490" y="610" fill="white" font-size="10" font-weight="600" text-anchor="middle">配置 sandbox/template id?</text>
  </g>

  <!-- Decision 5: local skills dir -->
  <g>
    <polygon points="160,575 290,615 160,655 30,615" fill="#0f172a"/>
    <polygon points="160,575 290,615 160,655 30,615" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="160" y="610" fill="white" font-size="10" font-weight="600" text-anchor="middle">本地 skills 目录</text>
    <text x="160" y="626" fill="#94a3b8" font-size="8" text-anchor="middle">包含 SKILL.md?</text>
  </g>

  <!-- Sandbox mode (shared target) -->
  <g>
    <rect x="730" y="430" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="730" y="430" width="200" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="830" y="455" fill="white" font-size="11" font-weight="600" text-anchor="middle">sandbox mode</text>
    <text x="830" y="471" fill="#94a3b8" font-size="8" text-anchor="middle">隔离 backend 执行</text>
  </g>

  <!-- Local mode -->
  <g>
    <rect x="730" y="580" width="200" height="60" rx="6" fill="#0f172a"/>
    <rect x="730" y="580" width="200" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="605" fill="white" font-size="11" font-weight="600" text-anchor="middle">local mode</text>
    <text x="830" y="621" fill="#94a3b8" font-size="8" text-anchor="middle">本地 SKILL.md 装载</text>
  </g>

  <!-- Auto (not injected) -->
  <g>
    <rect x="730" y="660" width="200" height="45" rx="6" fill="#0f172a"/>
    <rect x="730" y="660" width="200" height="45" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="830" y="680" fill="white" font-size="11" font-weight="600" text-anchor="middle">auto</text>
    <text x="830" y="695" fill="#94a3b8" font-size="8" text-anchor="middle">不注入 Skill Runtime</text>
  </g>

  <!-- Arrows -->
  <path d="M 490,130 L 490,155" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ar-c)"/>

  <path d="M 660,210 L 690,210" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar-a)"/>
  <text x="665" y="203" fill="#fbbf24" font-size="8">是</text>

  <path d="M 490,265 L 490,290" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-v)"/>
  <text x="498" y="283" fill="#64748b" font-size="7">否</text>

  <path d="M 660,345 L 730,455" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ar-c)"/>
  <text x="685" y="385" fill="#22d3ee" font-size="8">是</text>

  <path d="M 490,400 L 490,425" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-v)"/>
  <text x="498" y="418" fill="#64748b" font-size="7">否</text>

  <path d="M 660,480 L 730,460" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ar-c)"/>
  <text x="685" y="470" fill="#22d3ee" font-size="8">是</text>

  <path d="M 490,535 L 490,560" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-v)"/>
  <text x="498" y="553" fill="#64748b" font-size="7">否</text>

  <path d="M 660,615 L 730,490" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ar-c)"/>
  <text x="685" y="560" fill="#22d3ee" font-size="8">是</text>

  <path d="M 320,615 L 290,615" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-v)"/>
  <text x="295" y="608" fill="#64748b" font-size="7">否</text>

  <path d="M 290,615 L 730,605" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <text x="500" y="595" fill="#34d399" font-size="8">是 → local</text>

  <path d="M 160,655 L 160,682 L 730,682" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar-r)"/>
  <text x="400" y="676" fill="#fb7185" font-size="8">否 → auto 不注入</text>

  <!-- Legend -->
  <g transform="translate(30, 80)">
    <text x="0" y="0" fill="white" font-size="10" font-weight="700">图例</text>
    <rect x="0" y="12" width="14" height="14" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="20" y="23" fill="#94a3b8" font-size="9">起点</text>
    <rect x="80" y="12" width="14" height="14" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="100" y="23" fill="#94a3b8" font-size="9">显式 mode</text>
    <rect x="190" y="12" width="14" height="14" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="210" y="23" fill="#94a3b8" font-size="9">auto 推断判定</text>
    <rect x="320" y="12" width="14" height="14" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="340" y="23" fill="#94a3b8" font-size="9">sandbox 终态</text>
    <rect x="440" y="12" width="14" height="14" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
    <text x="460" y="23" fill="#94a3b8" font-size="9">local 终态</text>
    <rect x="540" y="12" width="14" height="14" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.2"/>
    <text x="560" y="23" fill="#94a3b8" font-size="9">auto 不注入</text>
  </g>
</svg>
