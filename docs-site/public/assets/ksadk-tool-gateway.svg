<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" role="img" aria-labelledby="title desc">
  <title id="title">KsADK Tool Gateway 审批流</title>
  <desc id="desc">Agent 调工具 → ToolPolicy 评估风险 → high/medium 触发 approval_required → 用户确认 → execute / reject。三态:直执行 / 审批 / 拒绝。</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg-light { fill: #0f172a; }
      rect[fill="#ffffff"] { fill: #1e293b; }
      rect[fill="#fbfbf9"] { fill: #0f172a; }
      rect[fill="#fff7ed"] { fill: #1e1b14; }
      rect[fill="#ecfdf5"] { fill: #0f1f1a; }
      rect[fill="#eef2ff"] { fill: #1a1f2e; }
      rect[fill="#fef2f2"] { fill: #1f1414; }
      text[fill="#0f172a"] { fill: #f1f5f9; }
      text[fill="#1e293b"] { fill: #e2e8f0; }
      text[fill="#334155"] { fill: #cbd5e1; }
      text[fill="#475569"] { fill: #94a3b8; }
      text[fill="#64748b"] { fill: #94a3b8; }
      text[fill="#92400e"] { fill: #fbbf24; }
      text[fill="#7c2d12"] { fill: #fed7aa; }
      text[fill="#5b21b6"] { fill: #c4b5fd; }
      text[fill="#7c3aed"] { fill: #a78bfa; }
      text[fill="#047857"] { fill: #34d399; }
      text[fill="#059669"] { fill: #34d399; }
      text[fill="#b91c1c"] { fill: #fca5a5; }
      rect[stroke="#cbd5e1"] { stroke: #475569; }
      rect[stroke="#94a3b8"] { stroke: #64748b; }
    }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="agn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="adisp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="askill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aalert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>

  <rect class="bg-light" width="1320" height="920" fill="#fbfbf9"/>

  <!-- 标题 -->
  <text x="40" y="36" font-size="18" font-weight="700" fill="#1e293b">KsADK — Tool Gateway 审批流</text>
  <text x="40" y="56" font-size="11" fill="#64748b">ToolPolicy 评估风险 · 三态判定：直执行 / 审批 / 拒绝 · 基于 ksadk/tools/gateway.py</text>

  <!-- ===== Region: Agent 调用方 ===== -->
  <rect x="40" y="80" width="1240" height="92" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="56" y="100" font-size="11.5" font-weight="700" fill="#334155">Agent 调用方</text>
  <g>
    <rect x="490" y="110" width="340" height="50" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="660" y="133" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Agent / tool_dispatcher</text>
    <text x="660" y="150" font-size="9.5" fill="#64748b" text-anchor="middle">tool_name · func · args · approval?</text>
  </g>
  <path d="M 660,160 L 660,205" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="670" y="186" font-size="9.5" fill="#475569">invoke(tool_name, func, *args, approval=None, **kwargs)</text>

  <!-- ===== Region: Tool Gateway ===== -->
  <rect x="40" y="200" width="1240" height="500" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="56" y="220" font-size="12" font-weight="700" fill="#b91c1c">ToolGateway.invoke · 审批闸口</text>
  <text x="280" y="220" font-size="10" fill="#64748b">_is_rejected → _is_approved / _requires_approval → func / _approval_required</text>

  <!-- Step 1: 读取 ToolPolicy -->
  <g>
    <rect x="490" y="238" width="340" height="62" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="660" y="261" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">读取 ToolPolicy</text>
    <text x="660" y="277" font-size="9.5" fill="#475569" text-anchor="middle">risk_level · side_effects · requires_approval</text>
    <text x="660" y="291" font-size="9" fill="#92400e" text-anchor="middle">policies.get(tool_name, ToolPolicy())</text>
  </g>
  <path d="M 660,300 L 660,332" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#adisp)"/>

  <!-- Step 2: 命令策略校验 (check_command_policy) -->
  <g>
    <rect x="380" y="336" width="560" height="62" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="660" y="359" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">命令策略校验（仅 shell 命令工具）check_command_policy(command)</text>
    <text x="660" y="375" font-size="9.5" fill="#475569" text-anchor="middle">递归 rm · sudo/kubectl/docker · git reset/clean/push · metadata 端点</text>
    <text x="660" y="389" font-size="9" fill="#92400e" text-anchor="middle">decision = reject → 直接拒绝 · allow → 继续</text>
  </g>

  <!-- 命令策略 reject 分路（左侧去 S2 拒绝）-->
  <path d="M 380,367 L 200,367 L 200,560" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#aalert)" stroke-dasharray="5,3"/>
  <text x="210" y="360" font-size="9.5" fill="#b91c1c">命令策略 reject</text>

  <!-- continue path to risk eval -->
  <path d="M 660,398 L 660,430" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#adisp)"/>

  <!-- Step 3: risk 评估 (diamond) -->
  <g>
    <path d="M 660,432 L 770,470 L 660,508 L 550,470 Z" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="660" y="466" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">tool_policy_requires_approval</text>
    <text x="660" y="481" font-size="9" fill="#475569" text-anchor="middle">KSADK_TOOL_APPROVAL_MODE=strict</text>
    <text x="660" y="494" font-size="9" fill="#047857" text-anchor="middle">risk ∈ {medium, high, critical}</text>
  </g>

  <!-- 否 → 直执行 -->
  <path d="M 550,470 L 230,470 L 230,560" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <text x="270" y="463" font-size="9.5" fill="#047857">否 · low / off 模式</text>

  <!-- 已 approved → 直执行 -->
  <path d="M 660,508 L 660,540 L 350,540 L 350,560" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <text x="470" y="534" font-size="9.5" fill="#047857">approval.approved=true（已确认）</text>

  <!-- 是 → approval_required -->
  <path d="M 770,470 L 1060,470 L 1060,540" fill="none" stroke="#d97706" stroke-width="1.2" marker-end="url(#adisp)"/>
  <text x="800" y="463" font-size="9.5" fill="#92400e">是 · 需要审批</text>

  <!-- ===== 三态卡片 ===== -->
  <!-- S3 直执行 -->
  <g>
    <rect x="120" y="562" width="220" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="230" y="586" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">① 直执行 execute</text>
    <line x1="140" y1="595" x2="320" y2="595" stroke="#059669" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="230" y="613" font-size="9.5" fill="#475569" text-anchor="middle">func(*args, **kwargs)</text>
    <text x="230" y="628" font-size="9.5" fill="#475569" text-anchor="middle">调用真实工具 impl</text>
    <text x="230" y="648" font-size="9" fill="#64748b" text-anchor="middle">low 风险 · 默认放行</text>
    <text x="230" y="662" font-size="9" fill="#64748b" text-anchor="middle">或已带 approved=true</text>
  </g>
  <!-- S1 审批 -->
  <g>
    <rect x="900" y="562" width="320" height="110" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.4"/>
    <text x="1060" y="586" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">② 审批 approval_required</text>
    <line x1="920" y1="595" x2="1200" y2="595" stroke="#d97706" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="1060" y="613" font-size="9.5" fill="#475569" text-anchor="middle">返回 envelope: ok=false</text>
    <text x="1060" y="628" font-size="9.5" fill="#475569" text-anchor="middle">approval_request.id = appr_&lt;uuid&gt;</text>
    <text x="1060" y="648" font-size="9" fill="#64748b" text-anchor="middle">risk_level + side_effects</text>
    <text x="1060" y="662" font-size="9" fill="#64748b" text-anchor="middle">→ 中断 run / 等待用户确认</text>
  </g>
  <!-- S2 拒绝 -->
  <g>
    <rect x="380" y="562" width="220" height="110" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="490" y="586" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">③ 拒绝 approval_rejected</text>
    <line x1="400" y1="595" x2="580" y2="595" stroke="#b91c1c" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="490" y="613" font-size="9.5" fill="#475569" text-anchor="middle">approved=false / 命令 reject</text>
    <text x="490" y="628" font-size="9.5" fill="#475569" text-anchor="middle">ok=false · reason 回填</text>
    <text x="490" y="648" font-size="9" fill="#64748b" text-anchor="middle">用户拒绝 · 不执行</text>
    <text x="490" y="662" font-size="9" fill="#64748b" text-anchor="middle">命令策略拦截</text>
  </g>

  <!-- 用户确认回流（approval_required → execute）-->
  <path d="M 900,617 L 680,617 L 680,640 L 340,640 L 340,672" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-dasharray="5,3"/>
  <text x="690" y="610" font-size="9.5" fill="#047857">用户确认 approved=true → 重新 invoke</text>

  <!-- 用户拒绝 → S2 -->
  <path d="M 960,617 L 600,617" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#aalert)" stroke-dasharray="5,3"/>
  <text x="780" y="635" font-size="9.5" fill="#b91c1c" text-anchor="middle">用户拒绝 approved=false</text>

  <!-- S1 envelope → InterruptInfo (runtime.py) -->
  <path d="M 1060,672 L 1060,710 L 760,710 L 760,755" fill="none" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#askill)" stroke-opacity="0.55"/>

  <!-- ===== Region: 执行边界 + 结构化结果 ===== -->
  <rect x="40" y="720" width="1240" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="56" y="740" font-size="11.5" font-weight="700" fill="#334155">执行边界 + 结构化结果</text>

  <!-- 真实 impl -->
  <g>
    <rect x="100" y="752" width="240" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="220" y="775" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">工具实现 impl</text>
    <text x="220" y="791" font-size="9" fill="#475569" text-anchor="middle">workspace · sandbox · web · skill</text>
    <text x="220" y="803" font-size="9" fill="#64748b" text-anchor="middle">run_command / write_workspace_file …</text>
  </g>
  <!-- Sandbox backend -->
  <g>
    <rect x="430" y="752" width="240" height="56" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="550" y="775" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Sandbox backend</text>
    <text x="550" y="791" font-size="9" fill="#475569" text-anchor="middle">E2B-compatible · 隔离执行</text>
    <text x="550" y="803" font-size="9" fill="#64748b" text-anchor="middle">local_process / e2b backend</text>
  </g>
  <!-- InterruptInfo -->
  <g>
    <rect x="660" y="752" width="240" height="56" rx="6" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="780" y="775" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">approval_interrupt_info</text>
    <text x="780" y="791" font-size="9" fill="#475569" text-anchor="middle">interrupt_info · 中断 run</text>
    <text x="780" y="803" font-size="9" fill="#64748b" text-anchor="middle">conversations/runtime.py</text>
  </g>
  <!-- 结构化结果 -->
  <g>
    <rect x="980" y="752" width="260" height="56" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="1110" y="775" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">结构化结果</text>
    <text x="1110" y="791" font-size="9" fill="#475569" text-anchor="middle">ok · type · result · receipts</text>
    <text x="1110" y="803" font-size="9" fill="#64748b" text-anchor="middle">idempotency_key (sha256)</text>
  </g>

  <!-- 连线：impl → sandbox → 结果；reject → 结果 -->
  <path d="M 340,780 L 430,780" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
  <path d="M 670,780 L 980,780" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)" stroke-opacity="0.5"/>
  <path d="M 490,672 L 490,710 L 1110,710 L 1110,752" fill="none" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#aalert)" stroke-dasharray="5,3"/>
  <text x="780" y="704" font-size="9.5" fill="#b91c1c" text-anchor="middle">rejected / envelope 一并写回 transcript</text>

  <!-- ===== 图例 ===== -->
  <g transform="translate(40, 845)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#1e293b">图例</text>
    <rect x="0" y="12" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="20" y="23" font-size="9.5" fill="#475569">运行时 / 直接执行</text>
    <rect x="150" y="12" width="14" height="14" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
    <text x="170" y="23" font-size="9.5" fill="#475569">策略评估 / 审批闸口</text>
    <rect x="320" y="12" width="14" height="14" rx="2" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="340" y="23" font-size="9.5" fill="#475569">拒绝 / 拦截</text>
    <rect x="450" y="12" width="14" height="14" rx="2" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="470" y="23" font-size="9.5" fill="#475569">中断 / 存储侧</text>
    <line x1="600" y1="19" x2="640" y2="19" stroke="#059669" stroke-width="1.2" marker-end="url(#agn)"/>
    <text x="648" y="23" font-size="9.5" fill="#475569">直执行 / 确认通过</text>
    <line x1="780" y1="19" x2="820" y2="19" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aalert)"/>
    <text x="828" y="23" font-size="9.5" fill="#475569">拒绝 / 拦截流</text>
    <text x="0" y="48" font-size="9.5" fill="#64748b">三态：low / off 模式 → 直执行；strict 且 risk≥medium → approval_required；approved=false 或命令策略 reject → approval_rejected</text>
    <text x="0" y="63" font-size="9.5" fill="#64748b">边界：ToolGateway.invoke 在调用真实 impl 前校验 ToolPolicy；shell 命令额外经 check_command_policy；envelope 与 receipts 写回会话 transcript</text>
  </g>
</svg>
