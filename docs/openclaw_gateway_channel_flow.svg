<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">ksadk OpenClaw Gateway Channel 管理流程</title>
  <desc id="desc">说明 ksadk 当前如何通过 Dashboard 短链、Cookie Session、Gateway WebSocket RPC 管理 OpenClaw 的 weixin 与 feishu channel。</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf5f7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L11,7 L1,13 Z" fill="#2d5b80"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L11,7 L1,13 Z" fill="#1d7a58"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L11,7 L1,13 Z" fill="#b56017"/>
    </marker>
    <style>
      .title { font: 700 34px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #fff; }
      .subtitle { font: 400 15px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #d7e7ef; }
      .section { font: 700 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; letter-spacing: 1px; fill: #102a43; }
      .card-title { font: 700 22px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #102a43; }
      .card-sub { font: 400 13px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #587084; }
      .body { font: 400 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #22384a; }
      .body-strong { font: 700 14px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #102a43; }
      .small { font: 400 12px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #52697b; }
      .mono { font: 600 12px "SFMono-Regular", "Menlo", "Monaco", monospace; fill: #0f172a; }
      .badge { fill: #0f172a; }
      .badge-text { font: 700 12px "SFMono-Regular", "Menlo", "Monaco", monospace; fill: #fff; }
      .white-card { fill: #fff; stroke: #d7e2ea; stroke-width: 1.3; }
      .summary { fill: #f5fbff; stroke: #b9d7ea; stroke-width: 1.4; }
      .teal-card { fill: #f2fbfd; stroke: #9fd7df; stroke-width: 1.4; }
      .green-card { fill: #f4fbf7; stroke: #9fd0b8; stroke-width: 1.4; }
      .orange-card { fill: #fff7ef; stroke: #efc08f; stroke-width: 1.4; }
      .rpc-card { fill: #f8fbfd; stroke: #c1d3dd; stroke-width: 1.2; }
      .line { stroke: #2d5b80; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .line-dashed { stroke: #7e98ab; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrowBlue); }
      .line-green { stroke: #1d7a58; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .line-orange { stroke: #b56017; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect width="1800" height="1500" fill="url(#bg)"/>

  <rect x="40" y="26" width="1720" height="124" rx="28" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="82" y="84" class="title">ksadk OpenClaw Gateway / Channel 管理流程</text>
  <text x="82" y="115" class="subtitle">当前没有单独的 channel manager 服务。真正的管理入口是 CLI 编排 Dashboard 短链、Cookie Session 与 Gateway WebSocket RPC。</text>

  <rect x="60" y="178" width="1680" height="92" rx="20" class="summary"/>
  <circle cx="100" cy="224" r="18" fill="#0f766e"/>
  <text x="100" y="228" text-anchor="middle" class="badge-text">TL;DR</text>
  <text x="130" y="212" class="body-strong">一句话理解</text>
  <text x="130" y="236" class="body">CLI 先拿短链和 cookie，再通过 websocket 连到 Gateway；之后所有 channel 状态查询、配置开关和接入动作，都是对远端 OpenClaw 实例发 RPC 或写回远端 config。</text>
  <text x="130" y="258" class="body">微信更偏“远端运行时扫码登录”，飞书更偏“本地 onboarding 后把结果写回远端配置”。</text>

  <text x="70" y="310" class="section">A. 入口链路与会话模型</text>

  <g filter="url(#shadow)">
    <rect x="70" y="334" width="280" height="210" rx="24" class="white-card"/>
    <circle cx="108" cy="374" r="18" class="badge"/>
    <text x="108" y="378" text-anchor="middle" class="badge-text">1</text>
    <text x="136" y="378" class="card-title">ksadk CLI</text>
    <text x="136" y="401" class="card-sub">入口命令</text>
    <text x="96" y="434" class="mono">agentengine openclaw gateway ...</text>
    <text x="96" y="456" class="mono">agentengine openclaw channel ...</text>
    <text x="96" y="492" class="body">
      <tspan x="96" dy="0">先解析实例，检查状态是否允许</tspan>
      <tspan x="96" dy="22">gateway / channel 操作。</tspan>
      <tspan x="96" dy="22">如果控制面状态尚未 READY，</tspan>
      <tspan x="96" dy="22">会循环探测 gateway 连通性。</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="334" width="280" height="210" rx="24" class="white-card"/>
    <circle cx="448" cy="374" r="18" class="badge"/>
    <text x="448" y="378" text-anchor="middle" class="badge-text">2</text>
    <text x="476" y="378" class="card-title">AgentEngine API</text>
    <text x="476" y="401" class="card-sub">控制面只做建链</text>
    <text x="436" y="438" class="mono">CreateDashboardAccessLink</text>
    <text x="436" y="474" class="body">
      <tspan x="436" dy="0">返回访问短链。</tspan>
      <tspan x="436" dy="22">CLI 再主动 GET 这个短链，</tspan>
      <tspan x="436" dy="22">让 Router 写入 cookie session。</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="334" width="390" height="270" rx="24" class="teal-card"/>
    <circle cx="788" cy="374" r="18" class="badge"/>
    <text x="788" y="378" text-anchor="middle" class="badge-text">3</text>
    <text x="816" y="378" class="card-title">Gateway Router</text>
    <text x="816" y="401" class="card-sub">短链入口、Cookie Session、HTTP / WS 代理</text>
    <text x="776" y="438" class="mono">GET /s/{link_id}  -&gt; 302 + Set-Cookie</text>
    <text x="776" y="474" class="body">
      <tspan x="776" dy="0">Session payload 里会带上：</tspan>
      <tspan x="776" dy="22">agent_id / account_id / framework / link_id / exp。</tspan>
      <tspan x="776" dy="22">之后 HTTP 和 WebSocket 都靠这个 cookie</tspan>
      <tspan x="776" dy="22">恢复路由上下文。</tspan>
    </text>
    <rect x="776" y="540" width="338" height="40" rx="12" class="rpc-card"/>
    <text x="794" y="565" class="small">framework=openclaw 时，Router 还会补 trusted-proxy 头后再代理到上游运行时。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1200" y="334" width="220" height="210" rx="24" class="white-card"/>
    <circle cx="1238" cy="374" r="18" class="badge"/>
    <text x="1238" y="378" text-anchor="middle" class="badge-text">4</text>
    <text x="1266" y="378" class="card-title">Redis</text>
    <text x="1266" y="401" class="card-sub">UI 短会话</text>
    <text x="1226" y="442" class="body">
      <tspan x="1226" dy="0">保存 session 数据。</tspan>
      <tspan x="1226" dy="22">TTL 跟 link 剩余有效期对齐。</tspan>
      <tspan x="1226" dy="22">也会保存 revoked link 标记。</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1480" y="334" width="280" height="270" rx="24" class="white-card"/>
    <circle cx="1518" cy="374" r="18" class="badge"/>
    <text x="1518" y="378" text-anchor="middle" class="badge-text">5</text>
    <text x="1546" y="378" class="card-title">OpenClaw Runtime</text>
    <text x="1546" y="401" class="card-sub">真正被管理的是远端实例</text>

    <rect x="1510" y="432" width="220" height="88" rx="14" class="rpc-card"/>
    <text x="1528" y="460" class="body-strong">Gateway RPC</text>
    <text x="1528" y="484" class="mono">channels.status / config.get</text>
    <text x="1528" y="504" class="mono">config.apply / web.login.*</text>

    <text x="1510" y="548" class="body">
      <tspan x="1510" dy="0">channel 的真实状态、插件开关、</tspan>
      <tspan x="1510" dy="22">账号配置，最后都落在这里。</tspan>
    </text>
  </g>

  <path d="M350 438 L410 438" class="line"/>
  <text x="365" y="423" class="small">创建短链</text>

  <path d="M690 438 L750 438" class="line"/>
  <text x="705" y="423" class="small">GET 短链拿 cookie</text>

  <path d="M1140 440 L1200 440" class="line-dashed"/>
  <text x="1155" y="425" class="small">create_ui_session</text>

  <path d="M1140 510 L1480 510" class="line"/>
  <text x="1230" y="495" class="small">WebSocket 代理 + trusted-proxy headers</text>

  <path d="M350 508 C670 508, 860 282, 1480 282" class="line-dashed"/>
  <text x="828" y="262" class="small">CLI 的 gateway client 实际会先用 requests.Session 引导出 cookie，再用 websocket 建立 operator 连接。</text>

  <text x="70" y="660" class="section">B. channel 管理有两条实现分支</text>

  <g filter="url(#shadow)">
    <rect x="70" y="686" width="800" height="530" rx="28" class="green-card"/>
    <circle cx="112" cy="730" r="18" fill="#1d7a58"/>
    <text x="112" y="734" text-anchor="middle" class="badge-text">WX</text>
    <text x="142" y="734" class="card-title">微信 channel：远端运行时主导</text>
    <text x="142" y="758" class="card-sub">CLI 主要做“触发”与“确认”，不是自己本地组装完整账号配置。</text>

    <rect x="100" y="790" width="340" height="128" rx="18" class="white-card"/>
    <text x="124" y="824" class="body-strong">步骤 1. 预检查并确保插件可见</text>
    <text x="124" y="854" class="mono">config.get</text>
    <text x="124" y="882" class="body">
      <tspan x="124" dy="0">先看当前 config。</tspan>
      <tspan x="124" dy="22">如果 bundled 的 openclaw-weixin</tspan>
      <tspan x="124" dy="22">还没启用，就先写一次 config.apply。</tspan>
    </text>

    <rect x="500" y="790" width="340" height="128" rx="18" class="white-card"/>
    <text x="524" y="824" class="body-strong">步骤 2. 触发远端扫码登录</text>
    <text x="524" y="854" class="mono">web.login.start</text>
    <text x="524" y="882" class="body">
      <tspan x="524" dy="0">拿到 qrDataUrl 和 sessionKey。</tspan>
      <tspan x="524" dy="22">CLI 在本地终端打印 ASCII 二维码，</tspan>
      <tspan x="524" dy="22">必要时还能在浏览器里打开二维码页。</tspan>
    </text>

    <rect x="100" y="972" width="340" height="128" rx="18" class="white-card"/>
    <text x="124" y="1006" class="body-strong">步骤 3. 等待远端登录结果</text>
    <text x="124" y="1036" class="mono">web.login.wait</text>
    <text x="124" y="1064" class="body">
      <tspan x="124" dy="0">当前实现会把 sessionKey</tspan>
      <tspan x="124" dy="22">作为 account_id 传回 wait RPC。</tspan>
      <tspan x="124" dy="22">真正的账号落地动作由远端插件完成。</tspan>
    </text>

    <rect x="500" y="972" width="340" height="128" rx="18" class="white-card"/>
    <text x="524" y="1006" class="body-strong">步骤 4. 用 probe 读取最终状态</text>
    <text x="524" y="1036" class="mono">channels.status --probe</text>
    <text x="524" y="1064" class="body">
      <tspan x="524" dy="0">CLI 最后做的是确认远端状态。</tspan>
      <tspan x="524" dy="22">如果一切正常，就能在 snapshot 里看到</tspan>
      <tspan x="524" dy="22">weixin 或 openclaw-weixin 的状态。</tspan>
    </text>

    <path d="M440 854 L500 854" class="line-green"/>
    <path d="M670 918 L670 972" class="line-green"/>
    <path d="M500 1036 L440 1036" class="line-green"/>

    <rect x="100" y="1134" width="740" height="58" rx="14" class="rpc-card"/>
    <text x="124" y="1170" class="body">状态与开关的常见落点：<tspan class="mono">plugins.allow</tspan>、<tspan class="mono">plugins.entries.openclaw-weixin.enabled</tspan>、<tspan class="mono">channels.openclaw-weixin.accounts.&lt;account_id&gt;</tspan>。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="686" width="800" height="530" rx="28" class="orange-card"/>
    <circle cx="972" cy="730" r="18" fill="#b56017"/>
    <text x="972" y="734" text-anchor="middle" class="badge-text">FS</text>
    <text x="1002" y="734" class="card-title">飞书 channel：本地 onboarding 主导</text>
    <text x="1002" y="758" class="card-sub">CLI 会调用官方 Node 工具，拿到 Bot 配置后再统一写回远端 OpenClaw config。</text>

    <rect x="960" y="790" width="340" height="128" rx="18" class="white-card"/>
    <text x="984" y="824" class="body-strong">步骤 1. 先读取远端现状</text>
    <text x="984" y="854" class="mono">config.get</text>
    <text x="984" y="882" class="body">
      <tspan x="984" dy="0">取当前 config 和已有 appId。</tspan>
      <tspan x="984" dy="22">这一步是为了复用已有配置，</tspan>
      <tspan x="984" dy="22">避免每次都从零开始 onboarding。</tspan>
    </text>

    <rect x="1360" y="790" width="340" height="128" rx="18" class="white-card"/>
    <text x="1384" y="824" class="body-strong">步骤 2. 本地跑官方 onboarding</text>
    <text x="1384" y="854" class="mono">@larksuite/openclaw-lark-tools</text>
    <text x="1384" y="882" class="body">
      <tspan x="1384" dy="0">依赖本机 node / npx。</tspan>
      <tspan x="1384" dy="22">扫码后拿到 appId、appSecret、</tspan>
      <tspan x="1384" dy="22">domain 和 userInfo.openId。</tspan>
    </text>

    <rect x="960" y="972" width="340" height="128" rx="18" class="white-card"/>
    <text x="984" y="1006" class="body-strong">步骤 3. 组装远端 feishu 配置</text>
    <text x="984" y="1036" class="mono">mutate_feishu_connect_config()</text>
    <text x="984" y="1064" class="body">
      <tspan x="984" dy="0">会补 enabled、appId、appSecret、</tspan>
      <tspan x="984" dy="22">connectionMode、requireMention、</tspan>
      <tspan x="984" dy="22">allowlist / groupPolicy / groups。</tspan>
    </text>

    <rect x="1360" y="972" width="340" height="128" rx="18" class="white-card"/>
    <text x="1384" y="1006" class="body-strong">步骤 4. 写回并再次 probe</text>
    <text x="1384" y="1036" class="mono">config.apply + channels.status</text>
    <text x="1384" y="1064" class="body">
      <tspan x="1384" dy="0">如果 config 发生变化，先 apply。</tspan>
      <tspan x="1384" dy="22">必要时等待 gateway 恢复，</tspan>
      <tspan x="1384" dy="22">最后再用 probe 读取最终状态。</tspan>
    </text>

    <path d="M1300 854 L1360 854" class="line-orange"/>
    <path d="M1530 918 L1530 972" class="line-orange"/>
    <path d="M1360 1036 L1300 1036" class="line-orange"/>

    <rect x="960" y="1134" width="740" height="58" rx="14" class="rpc-card"/>
    <text x="984" y="1170" class="body">状态与开关的常见落点：<tspan class="mono">plugins.entries.openclaw-lark.enabled</tspan>、<tspan class="mono">channels.feishu.enabled</tspan>、<tspan class="mono">channels.feishu.appId</tspan>、<tspan class="mono">channels.feishu.allowFrom</tspan>。</text>
  </g>

  <text x="70" y="1270" class="section">C. 为什么微信和飞书做法不一样</text>

  <g filter="url(#shadow)">
    <rect x="70" y="1294" width="520" height="146" rx="22" class="white-card"/>
    <text x="96" y="1330" class="body-strong">微信</text>
    <text x="96" y="1360" class="body">
      <tspan x="96" dy="0">当前实现依赖远端插件暴露</tspan>
      <tspan x="96" dy="22" class="mono">web.login.start / web.login.wait</tspan>
      <tspan x="96" dy="24" class="body">所以默认镜像里还会对特定版本的</tspan>
      <tspan x="96" dy="22" class="body">openclaw-weixin 打一个很小的 shim。</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="1294" width="520" height="146" rx="22" class="white-card"/>
    <text x="666" y="1330" class="body-strong">飞书</text>
    <text x="666" y="1360" class="body">
      <tspan x="666" dy="0">当前实现更像“CLI 侧的配置助手”。</tspan>
      <tspan x="666" dy="22">本地先跑官方 onboarding，</tspan>
      <tspan x="666" dy="22">再统一写回远端 config。</tspan>
      <tspan x="666" dy="22">因此本机必须有 node / npx。</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1210" y="1294" width="520" height="146" rx="22" class="summary"/>
    <text x="1236" y="1330" class="body-strong">最终落点</text>
    <text x="1236" y="1360" class="body">
      <tspan x="1236" dy="0">无论哪条分支，channel 管理都不是保存在本地 CLI。</tspan>
      <tspan x="1236" dy="22">真正生效的是远端 OpenClaw 运行时里的配置和插件状态。</tspan>
      <tspan x="1236" dy="22">CLI 只是统一入口和编排器。</tspan>
    </text>
  </g>
</svg>
