<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Workbench</title>
  <link rel="icon" type="image/svg+xml" href="./adk_favicon.svg">
  <link rel="stylesheet" href="./agent-workbench.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="eyebrow">AgentEngine</div>
          <h1>Agent Workbench</h1>
        </div>
        <button id="new-session-button" class="ghost-button">New</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <main class="main-panel">
      <header class="panel-header">
        <div>
          <div id="agent-name" class="agent-name">Loading...</div>
          <div id="agent-meta" class="agent-meta"></div>
        </div>
        <div class="header-actions">
          <button id="stop-button" class="ghost-button" disabled>Stop</button>
        </div>
      </header>

      <section id="message-list" class="message-list"></section>

      <section id="composer-status" class="composer-status hidden"></section>

      <form id="composer-form" class="composer">
        <label class="composer-input">
          <textarea id="message-input" rows="1" placeholder="Send a message. Use /new, /clear, /help, /stop."></textarea>
        </label>
        <div class="composer-actions">
          <label class="ghost-button" for="attachment-input">Attach</label>
          <input id="attachment-input" type="file" multiple hidden>
          <button id="send-button" type="submit" class="primary-button">Send</button>
        </div>
      </form>
      <div id="attachment-list" class="attachment-list"></div>
    </main>
  </div>

  <script>
    window.__AGENTENGINE_UI__ = {
      version: "v1",
      hostMode: "embedded",
    };
  </script>
  <script type="module" src="./agent-workbench.js"></script>
</body>
</html>
