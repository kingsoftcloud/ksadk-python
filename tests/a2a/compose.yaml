services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ksadk_a2a
      POSTGRES_USER: ksadk
      POSTGRES_PASSWORD: ksadk
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksadk -d ksadk_a2a"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
